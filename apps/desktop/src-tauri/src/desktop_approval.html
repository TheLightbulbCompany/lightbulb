<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>Allow command once?</title>
<style>body{font:15px system-ui;margin:28px;color:#202020;background:#fafafa}pre{white-space:pre-wrap;overflow-wrap:anywhere;padding:14px;background:#eee;border-radius:8px;max-height:48vh;overflow:auto}button{font:inherit;padding:10px 18px;margin-right:12px}#expires{color:#555}</style>
</head><body><h2>Allow this command once?</h2><p>This command can access files and applications on your Mac.</p><pre id="details"></pre><p id="expires"></p><button id="deny" autofocus>Deny</button><button id="allow">Allow once</button>
<script>
const p=window.__desktopApproval;
document.getElementById('details').textContent=JSON.stringify({workspace:p.workspace,agent:p.agent,device:p.device,run:p.run,argv:p.argv,cwd:p.cwd,environment:p.env},null,2);
if(p.operation){document.querySelector('h2').textContent='Allow this Paperclip operation once?';document.querySelector('p').textContent='This approves only the operation below on this Mac. Shell commands also need command approval.';document.getElementById('details').textContent=JSON.stringify({workspace:p.workspace,company:p.company,agent:p.agent,run:p.run,selectedDevice:p.device,mac:p.nativeDevice,operation:p.operation},null,2);}
document.getElementById('expires').textContent='Expires at '+new Date(p.expiresAtMs).toLocaleTimeString()+'. Closing this window denies the request.';
for(const [id,approved] of [['deny',false],['allow',true]]) document.getElementById(id).onclick=async()=>{document.querySelectorAll('button').forEach(b=>b.disabled=true);await window.__TAURI_INTERNALS__.invoke('plugin:desktop-approval|desktop_shell_answer',{approved});};
</script></body></html>
