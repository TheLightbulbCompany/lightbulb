id: b10-digest
kind: automation
type: build
prompt: |
  Please build "Weekly Digest": people save short items (links, ideas, notes) during the week and the app emails them a digest of everything they saved since the last one. People sign up (name, email, password; signed in straight away) and sign in and out. Signed-out visitors to any page go to sign-in.

  On `/items` a person adds an item (a title) and sees their list; each item is pending until it has been included in a digest. The page shows how many items are pending. Everyone sees only their own items (`GET /api/items` returns the caller's items as an array, 401 when signed out).

  A scheduled job builds and sends the digests. Make it a route, `GET /api/cron/digest`, so the host's scheduler (for example a Vercel cron entry, configure one to run weekly on Mondays at 08:00 UTC) can call it. For every person with at least one pending item the job creates one digest holding those items, "sends" it, and marks those items as sent so they are never sent twice. There is no email provider in this project, so "send" means recording the digest and logging what would be sent; do not invent API keys. The job supports a dry run, `GET /api/cron/digest?dryRun=1`, which returns what it would do as JSON `{ "dryRun": true, "digests": [{ "email": "...", "itemCount": 2 }] }` and changes nothing: no digest is recorded and no item is marked sent. A real run returns `{ "dryRun": false, "sent": <number of digests> }`. Each person sees their sent digests on `/digests`, newest first, each showing how many items it held (the text of the count element is just the number).

  The job route requires the `CRON_SECRET` environment variable as a bearer token (`Authorization: Bearer <CRON_SECRET>`); it is the only thing in the app reachable without signing in.

  Names the checks rely on. Please use these exactly, because an automatic check drives the app by them.

  Pages: `/auth/sign-up`, `/auth/sign-in`, `/items`, `/digests`, `/api/items`, `/api/cron/digest`.

  Elements: give each of these a `data-testid` attribute with exactly this value: `signup-name`, `signup-email`, `signup-password`, `signup-submit`, `signup-error`, `signin-email`, `signin-password`, `signin-submit`, `signin-error`, `user-menu`, `sign-out-button`, `item-title`, `item-add`, `items-list`, `item-row`, `items-pending-count`, `digests-list`, `digest-row`, `digest-item-count`.

  The scheduled job is a plain HTTP route, `GET /api/cron/digest`, protected by the secret in the environment variable `CRON_SECRET` (read it at request time). It must answer 401 and do nothing unless the request carries the header `Authorization: Bearer <CRON_SECRET>`.
fixture: blank
journeys: journeys.spec.ts
probes:
  - id: unauth-digests
    kind: unauthenticated-route
    target: /digests
  - id: cross-user-api-items
    kind: cross-user-read
    target: /api/items
timeoutMin: 45
