id: b05-ledgerly
kind: dashboard
type: build
prompt: |
  Please build Ledgerly, a small double-entry bookkeeping app. People sign up (name, email, password; signed in straight away) and sign in and out. Signed-out visitors to any page go to sign-in; the home address goes to the accounts page when signed in.

  Money is always whole cents internally, never floating point: forms take dollars with two decimals and convert exactly (1250.10 becomes 125010 cents, never 125009). Every money field in JSON is an integer named like `totalDebitCents`. Entry dates are plain calendar dates (YYYY-MM-DD) that never shift by a day. Anything that shows an entry's date also carries `data-entry-date="YYYY-MM-DD"`.

  A new person starts with nothing: no sample accounts or entries. A chart-of-accounts page lists their accounts sorted by code. An account has a code (unique for that person; reusing one is refused and nothing is created), a name and a type, `debit` or `credit`, which is its normal side. The journal page lists manual entries, newest date first. An entry has a date, a memo and two or more lines; each line picks an account and has a debit amount or a credit amount, exactly one of them above zero. An entry is valid only if total debits equal total credits and the total is above zero. The entry form shows three line rows and ignores a blank one; the save button is never disabled, so saving an unbalanced entry shows the reason in the error element and writes nothing (the API answers 400 with `{ "error": "..." }`). Everyone sees and changes only their own accounts and entries; enforce this on the server.

  JSON: `GET` and `POST /api/accounts` (account has `id`, `code`, `name`, `type`), `GET` and `POST /api/entries` (body `{ date, memo, lines: [{ accountId, debitCents, creditCents }] }`; entries carry `id`, `date`, `memo`, `totalDebitCents`, `totalCreditCents`), `GET /api/entries/[id]` (adds the lines). Lists are arrays, creates return the new object with its `id`, and everything answers 401 when signed out. The account-type field is a select with values `debit` and `credit`; each line's account field is a select whose option value is the account's id and whose label is "<code> <name>" (for example "1000 Cash"). Entry rows carry `data-entry-id` and `data-entry-date`.

  Names the checks rely on. Please use these exactly, because an automatic check drives the app by them.

  Pages: `/auth/sign-up`, `/auth/sign-in`, `/accounts`, `/accounts/new`, `/journal`, `/journal/new`, `/journal/[id]`, `/api/accounts`, `/api/entries`, `/api/entries/[id]`.

  Elements: give each of these a `data-testid` attribute with exactly this value: `signup-name`, `signup-email`, `signup-password`, `signup-submit`, `signup-error`, `signin-email`, `signin-password`, `signin-submit`, `signin-error`, `user-menu`, `sign-out-button`, `nav-accounts`, `nav-journal`, `accounts-list`, `accounts-empty`, `account-new-button`, `account-row`, `account-row-code`, `account-form-code`, `account-form-name`, `account-form-type`, `account-form-submit`, `account-form-error`, `journal-list`, `journal-empty`, `entry-new-button`, `entry-row`, `entry-row-memo`, `entry-row-total`, `entry-row-link`, `entry-form-date`, `entry-form-memo`, `entry-line-row`, `line-account`, `line-debit`, `line-credit`, `entry-submit`, `entry-error`, `entry-detail-date`, `entry-detail-total-debit`, `entry-detail-total-credit`.
fixture: blank
journeys: journeys.spec.ts
probes:
  - id: unauth-journal
    kind: unauthenticated-route
    target: /journal
  - id: cross-user-api-entries
    kind: cross-user-read
    target: /api/entries
  - id: sqli-accounts-new
    kind: sql-injection
    target: /accounts/new
timeoutMin: 45
