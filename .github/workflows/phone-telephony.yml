name: Phone telephony provisioning
on:
  workflow_dispatch:
    inputs:
      apply:
        description: Reconcile certified Twilio trunks and production configuration secret (no numbers or calls)
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
concurrency:
  group: lightbulb-phone-telephony
  cancel-in-progress: false
jobs:
  reconcile:
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ vars.DEPLOY_RUNNER }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: apps/backend/uv.lock
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-east-1
          role-duration-seconds: 900
          role-skip-session-tagging: true
          role-to-assume: arn:aws:iam::877352799272:role/lightbulb-github-actions
      - name: Validate provisioning behavior
        working-directory: apps/backend
        run: uv run pytest tests/unit/scripts/test_provision_phone_telephony.py -q --no-cov
      - name: Install infrastructure dependencies
        working-directory: apps/infra
        run: npm ci
      - name: Validate isolated phone IAM permissions
        working-directory: apps/infra
        run: npx vitest run test/phone-telephony-bootstrap.test.ts
      - name: Bootstrap scoped phone IAM through CloudFormation
        if: inputs.apply == true && github.ref == 'refs/heads/main'
        working-directory: apps/infra
        # CDK assumes the existing cdk deploy/CloudFormation execution roles. No direct IAM mutations.
        run: npx cdk deploy --app 'npx ts-node --prefer-ts-exts lib/phone-telephony-bootstrap-app.ts' lightbulb-phone-telephony-bootstrap --require-approval never --outputs-file /tmp/phone-telephony-bootstrap-outputs.json
      - name: Assume main-only phone provisioning role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-east-1
          role-duration-seconds: 900
          role-skip-session-tagging: true
          unset-current-credentials: true
          role-to-assume: arn:aws:iam::877352799272:role/lightbulb-phone-telephony
      - name: Read-only readiness
        if: inputs.apply == false
        working-directory: apps/backend
        run: uv run python scripts/provision_phone_telephony.py
      - name: Reconcile trunks and configuration secret
        if: inputs.apply == true
        working-directory: apps/backend
        run: uv run python scripts/provision_phone_telephony.py --apply
