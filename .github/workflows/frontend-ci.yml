# =============================================================================
# Frontend CI (PRs only)
# =============================================================================
name: Frontend CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/frontend/**'
      # packages/shared resolves straight to ./src/index.ts with no build step,
      # and the frontend suite exercises it (useAgentChat, useGateway, the Teams
      # run-transcript modules). Without this, a shared-only PR could break the
      # frontend tests and merge with them never having run.
      - 'packages/**'
      - '.github/workflows/frontend-ci.yml'
      - 'pnpm-lock.yaml'

# Supersede in-flight runs for the same PR. `github.ref` is refs/pull/<n>/merge
# here (pull_request only), so the group is per-PR and PRs never cancel each
# other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  lint-and-build:
    name: Lint & Build
    # GitHub-hosted (2026-11-05), not vars.CI_RUNNER: one shared self-hosted box
    # queued every PR behind the others. Unit tests are their own sharded job
    # below, so this one is lint + tsc + build (~5m). 30m bounds a hang.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          # Per-job install dir: harmless on a fresh hosted runner, and keeps
          # concurrent jobs apart on a shared self-hosted home (ENOTEMPTY races).
          dest: ${{ runner.temp }}/setup-pnpm

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm --filter @lightbulb/frontend run lint

      - name: Type check
        run: pnpm --filter @lightbulb/frontend exec tsc --noEmit

      - name: Build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_API_URL: https://api-dev.thelightbulb.company/api/v1
        run: pnpm --filter @lightbulb/frontend run build

  unit-tests:
    name: Unit tests (shard ${{ matrix.shard }}/4)
    # ~380 jsdom files took 13m serially on the self-hosted box. vitest.config.ts
    # caps each run at 2 worker threads (the core count of a private-repo
    # ubuntu-latest runner), so the files are split 4 ways with vitest --shard.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          # Per-job install dir: harmless on a fresh hosted runner, and keeps
          # concurrent jobs apart on a shared self-hosted home (ENOTEMPTY races).
          dest: ${{ runner.temp }}/setup-pnpm

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Extra args after the script name reach the script's last command, `vitest run`.
      - name: Unit tests
        run: pnpm --filter @lightbulb/frontend run test --shard=${{ matrix.shard }}/4
