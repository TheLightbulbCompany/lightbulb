name: runner-maintenance

# Manual remedy for the self-hosted box filling its /tmp.
#
# /tmp there is a 16 GB tmpfs (RAM) — NOT the 1 TB volume / lives on. On
# 2026-08-18 it reached 100% used / 1.3 MB free while `df /` read 29%, so
# every dashboard looked healthy. It took down two unrelated workflows in
# sequence: the image builds (soci convert, "write /tmp/tmp.NNNN: no
# space left on device") and then deploy (cdk synth, "ENOSPC ... copyfile
# -> /tmp/cdk-custom-resourceXXXX/index.js", run 32195537485).
#
# It was filled by a soci convert that died mid-run and stranded its ztoc
# spill. Nothing collects /tmp, and tmpfs does not survive being full any
# better than a disk — so one failure became sticky and broke the NEXT
# thing to want scratch space. The image builds now spill to
# /var/tmp instead, but anything else on the box can still fill /tmp.
#
# Run this when a workflow on the box fails with ENOSPC and `df /` looks
# fine. Check /tmp, not /.
on:
  workflow_dispatch:
    inputs:
      min_age_minutes:
        description: "Only reclaim entries untouched for at least this long"
        required: false
        default: "60"

permissions:
  contents: read

jobs:
  reclaim-tmp:
    name: Reclaim /tmp on the self-hosted box
    runs-on: [self-hosted, isol8-wsl]
    timeout-minutes: 10
    steps:
      - name: Reclaim
        env:
          MIN_AGE: ${{ inputs.min_age_minutes || '60' }}
        run: |
          set -uo pipefail
          echo "=== before ==="
          df -h /tmp /var/tmp / 2>/dev/null || true
          echo
          echo "=== top /tmp consumers ==="
          sudo du -sh /tmp/* 2>/dev/null | sort -rh | head -15 || true
          echo
          # Deliberately NOT `rm -rf /tmp/*`. This box runs jobs concurrently
          # and a blanket wipe would delete a live job's scratch mid-run.
          # Known-garbage patterns only, and only when untouched for MIN_AGE
          # (default 60m) so an in-flight job is never a candidate.
          # sudo because soci and cdk both run as root here.
          echo "=== reclaiming (untouched > ${MIN_AGE}m) ==="
          # `cdk.out*` is the big one and is easy to miss. Note the DOT — a
          # `cdk-*` glob does NOT match it, which is how the first pass
          # reclaimed only megabytes and still came back 100% full.
          #
          # These are NOT from `cdk synth`, despite what this comment used to
          # say: the CLI sets CDK_OUTDIR, so a synth writes to
          # apps/infra/cdk.out on the 1 TB volume and leaves /tmp empty
          # (measured). They came from `new App()` WITHOUT an outdir, which
          # mkdtemps `os.tmpdir()/cdk.outXXXXXX` and never removes it — i.e.
          # the apps/infra vitest suite, which built 54 Apps and stranded
          # ~1.2 GB per run. infra-ci runs that suite on every PR touching
          # apps/infra, so ~13 PR runs filled the 16 GB tmpfs. Fixed in
          # apps/infra/test/scratch-tmpdir.ts; this sweep still covers runs
          # that crashed before their cleanup hook.
          sudo find /tmp -maxdepth 1 -mmin "+${MIN_AGE}" \
            \( -name 'tmp.*' -o -name 'cdk-*' -o -name 'cdk.out*' -o -name 'soci*' \
               -o -name 'ztoc*' -o -name 'buildkit*' -o -name 'containerd*' \) \
            -exec rm -rf {} + 2>/dev/null || true
          echo
          echo "=== after ==="
          df -h /tmp /var/tmp / 2>/dev/null || true

      - name: Fail if still critically full
        run: |
          set -uo pipefail
          # A reclaim that "succeeds" while leaving /tmp at 100% is worse than
          # a failure: the next workflow inherits the problem and reports a
          # confusing ENOSPC instead. Surface it here.
          USE=$(df --output=pcent /tmp 2>/dev/null | tail -1 | tr -dc '0-9')
          echo "/tmp now ${USE:-unknown}% used"
          if [ -n "${USE:-}" ] && [ "$USE" -ge 95 ]; then
            echo "::error::/tmp is still ${USE}% full after reclaim — the fill is live, not stale. Inspect the consumers listed above."
            exit 1
          fi
