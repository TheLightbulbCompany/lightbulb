name: E2E (dev) — manual

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'BASE_URL to test against'
        required: false
        default: 'https://dev.flickmeon.ai'

jobs:
  e2e:
    name: Playwright E2E vs dev
    runs-on: ${{ vars.CI_RUNNER }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # Per-job install dir — the self-hosted box runs several runner
          # instances out of one home, so two jobs installing pnpm into the
          # default ~/setup-pnpm race each other (ENOTEMPTY on rmdir). Every
          # other pnpm workflow already sets this; this one was the gap.
          dest: ${{ runner.temp }}/setup-pnpm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `--with-deps` shells out to `sudo apt-get install` for chromium's
      # system libraries. On the self-hosted box that write is permanent
      # rather than discarded with the VM, so the first run installs and
      # every run after it is a no-op. Passwordless sudo is already a
      # requirement of the box (build-paperclip-image.yml installs soci and
      # nerdctl into /usr/local/bin the same way).
      - name: Install Playwright browsers
        run: cd apps/frontend && npx playwright install chromium --with-deps

      - name: Run E2E suite
        run: cd apps/frontend && npx playwright test --project=chromium --grep-invert='Chat Smoke'
        env:
          BASE_URL: ${{ inputs.base_url }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL_DEV }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY_DEV }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY_DEV }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/frontend/playwright-report/
          retention-days: 7
