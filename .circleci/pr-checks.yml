# =============================================================================
# PR checks (continuation of .circleci/config.yml). One workflow per GitHub
# workflow, switched on by the path-filtering parameters the setup job sets.
# Commands, env and versions are the GitHub workflows' (backend.yml,
# frontend-ci.yml, mobile-ci.yml, infra-ci.yml, company-ci.yml, tla.yml,
# huddle-agent.yml, secret-scan.yml); read those for the why of each step.
#
# Credits: small = 5/min, medium = 10/min, large = 20/min, machine medium =
# 10/min. CircleCI bills vCPU-minutes, so a bigger class finishes a CPU-bound
# job sooner at about the same cost; the class here is the smallest one whose
# memory fits. Worker counts are explicit everywhere (-n 2, --maxWorkers=2):
# os.cpus() inside the docker executor reports the HOST's cores (36+), so any
# "auto" setting forks dozens of workers into a 4 GB container.
# =============================================================================
version: 2.1

parameters:
  run-backend:
    type: boolean
    default: false
  run-frontend:
    type: boolean
    default: false
  run-mobile:
    type: boolean
    default: false
  run-infra:
    type: boolean
    default: false
  run-company:
    type: boolean
    default: false
  run-tla:
    type: boolean
    default: false
  run-huddle:
    type: boolean
    default: false

executors:
  # Python 3.12 + uv (astral's image on python:3.12-bookworm, so git/ssh are present).
  uv:
    docker:
      - image: ghcr.io/astral-sh/uv:python3.12-bookworm
  node:
    docker:
      - image: cimg/node:20.19
    environment:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  # Linux VM: a local Docker daemon, which CDK synth bundling and the Hermes
  # image smokes' bind mounts need (the remote-docker add-on cannot mount the
  # job's files).
  machine:
    machine:
      image: ubuntu-2204:current
    resource_class: medium
    environment:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

commands:
  pnpm-install:
    description: >
      pnpm at the root package.json's packageManager version via corepack, the
      store cached on pnpm-lock.yaml (what actions/setup-node cache:pnpm does).
    steps:
      - run:
          name: Enable pnpm
          command: |
            corepack enable --install-directory "$HOME/.local/bin"
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"
            export PATH="$HOME/.local/bin:$PATH"
            pnpm config set --global store-dir "$HOME/.pnpm-store"
            pnpm --version
      - restore_cache:
          keys:
            - pnpm-store-v1-{{ checksum "pnpm-lock.yaml" }}
            - pnpm-store-v1-
      - run:
          name: Install dependencies
          command: pnpm install --frozen-lockfile
      - save_cache:
          key: pnpm-store-v1-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - ~/.pnpm-store
  uv-sync:
    description: uv sync with uv's cache keyed on the project's lockfile (what setup-uv enable-cache does).
    parameters:
      project:
        type: string
      args:
        type: string
        default: ""
    steps:
      - restore_cache:
          keys:
            - uv-v1-<< parameters.project >>-{{ checksum "<< parameters.project >>/uv.lock" }}
      - run:
          name: Install dependencies
          working_directory: << parameters.project >>
          command: uv sync << parameters.args >>
      - save_cache:
          key: uv-v1-<< parameters.project >>-{{ checksum "<< parameters.project >>/uv.lock" }}
          paths:
            - ~/.cache/uv

jobs:
  # ---------------------------------------------------------------- backend.yml
  backend-lint-test:
    executor: uv
    # 2 vCPU / 4 GB: 2 xdist workers, each a FastAPI app + in-process moto.
    resource_class: medium
    # The 4 shards of backend.yml's matrix (tests/conftest.py, BACKEND_TEST_SHARD),
    # one per parallel container.
    parallelism: 4
    steps:
      - checkout
      - uv-sync:
          project: apps/backend
          args: --frozen
      - run:
          name: Run linting
          working_directory: apps/backend
          command: |
            uv run ruff check .
            uv run ruff format --check .
      - run:
          name: Run tests
          working_directory: apps/backend
          environment:
            CLERK_ISSUER: https://test.clerk.accounts.dev
            HUGGINGFACE_TOKEN: test_token
            DYNAMODB_TABLE_PREFIX: isol8-test-
            AWS_DEFAULT_REGION: us-east-1
            AWS_ACCESS_KEY_ID: testing
            AWS_SECRET_ACCESS_KEY: testing
            DEBUG: "false"
          # -n 2, not -n auto: see the header. pytest-cov merges worker coverage itself.
          command: |
            export BACKEND_TEST_SHARD="$((CIRCLE_NODE_INDEX + 1))/4"
            echo "BACKEND_TEST_SHARD=$BACKEND_TEST_SHARD"
            uv run pytest tests/ -q -n 2 --cov=. --cov-report=xml --cov-report=term-missing
          no_output_timeout: 20m
      # backend.yml runs the six Lambda suites on shard 1 only; they are the
      # ingest/authorizer/projector/settlement paths whose tests ran nowhere before.
      - run:
          name: Run Lambda tests (shard 1 only)
          working_directory: apps/backend
          environment:
            AWS_DEFAULT_REGION: us-east-1
            AWS_ACCESS_KEY_ID: testing
            AWS_SECRET_ACCESS_KEY: testing
          command: |
            if [ "$CIRCLE_NODE_INDEX" != "0" ]; then echo "shard 1 only"; exit 0; fi
            for d in ses-inbound ws-connect pub-authorizer messaging-projector messaging-search-indexer; do
              uv run pytest "../infra/lambda/$d" -v
            done
            uv run python -m unittest discover -s ../infra/lambda/openrouter-settlement -t ../infra/lambda/openrouter-settlement -v

  # ------------------------------------------------------------ frontend-ci.yml
  frontend-lint-build:
    executor: node
    # 4 vCPU / 8 GB: `next build` of ~1,500 source files; the GitHub-hosted
    # runner it came from had 16 GB. ponytail: drop to medium+ (6 GB) once a few
    # runs show the build's peak RSS.
    resource_class: large
    steps:
      - checkout
      - pnpm-install
      - run:
          name: Run ESLint
          command: pnpm --filter @lightbulb/frontend run lint
      - run:
          name: Type check
          command: pnpm --filter @lightbulb/frontend exec tsc --noEmit
      - run:
          name: Build
          # frontend-ci.yml reads the key from secrets.CLERK_PUBLISHABLE_KEY. A Clerk
          # publishable key is public by design (NEXT_PUBLIC_, shipped in every client
          # bundle); this is the dev instance's, the same literal apps/mobile/package.json
          # start:dev carries.
          environment:
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_dXAtbW90aC01NS5jbGVyay5hY2NvdW50cy5kZXYk
            NEXT_PUBLIC_API_URL: https://api-dev.thelightbulb.company/api/v1
          command: pnpm --filter @lightbulb/frontend run build
          no_output_timeout: 20m

  frontend-unit-tests:
    executor: node
    # vitest.config.ts caps each run at 2 worker threads, so 2 vCPU is the fit.
    resource_class: medium
    # The 4 shards of frontend-ci.yml's matrix: vitest --shard=k/4.
    parallelism: 4
    steps:
      - checkout
      - pnpm-install
      - run:
          name: Unit tests
          # Extra args after the script name reach the script's last command, `vitest run`.
          command: pnpm --filter @lightbulb/frontend run test --shard=$((CIRCLE_NODE_INDEX + 1))/4
          no_output_timeout: 20m

  # -------------------------------------------------------------- mobile-ci.yml
  mobile-check-bundle:
    executor: node
    resource_class: medium
    steps:
      - checkout
      - pnpm-install
      - run:
          name: Shared tests
          command: pnpm --filter @lightbulb/shared run test --maxWorkers=2
      - run:
          name: Shared type check
          command: pnpm --filter @lightbulb/shared run typecheck
      - run:
          name: Shared lint
          command: pnpm --filter @lightbulb/shared run lint
      - run:
          name: Mobile type check
          command: pnpm --filter @lightbulb/mobile run typecheck
      - run:
          name: Mobile lint
          command: pnpm --filter @lightbulb/mobile run lint
      - run:
          name: Mobile tests
          # --forceExit: @clerk/expo leaves MessagePort handles open and jest never exits (mobile-ci.yml).
          command: pnpm --filter @lightbulb/mobile run test --forceExit --maxWorkers=2
          no_output_timeout: 20m
      - run:
          name: Mobile iOS bundle (Metro export)
          environment:
            CI: "1"
          command: pnpm --filter @lightbulb/mobile run export:ios --max-workers 2
          no_output_timeout: 20m

  # --------------------------------------------------------------- infra-ci.yml
  infra-hermes-bridge-tests:
    executor: uv
    resource_class: small
    steps:
      - checkout
      - run:
          name: Run bridge tests
          working_directory: apps/infra/hermes
          # No project/lockfile: the bridge is vendored into the image, so its deps are named inline.
          command: uv run --no-project --with pytest --with botocore --with pyyaml --with websockets python -m pytest tests -q

  infra-openrouter-gate-tests:
    executor: node
    resource_class: small
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-gate-v1-{{ checksum "apps/infra/lambda/openrouter-gate/package-lock.json" }}
      - run:
          name: Install gate dependencies
          working_directory: apps/infra/lambda/openrouter-gate
          command: npm ci --no-audit --no-fund
      - save_cache:
          key: npm-gate-v1-{{ checksum "apps/infra/lambda/openrouter-gate/package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: Run gate tests
          working_directory: apps/infra/lambda/openrouter-gate
          command: npm test

  infra-synth-test:
    executor: machine
    steps:
      - checkout
      - run:
          name: Use Node 20
          # nvm is a shell function on the machine image; source it rather than rely on BASH_ENV.
          command: |
            source "$HOME/.nvm/nvm.sh"
            nvm install 20 >/dev/null
            nvm alias default 20 >/dev/null
            echo 'source "$HOME/.nvm/nvm.sh"' >> "$BASH_ENV"
            node --version
      - pnpm-install
      - run:
          name: Run tests
          command: pnpm --filter @lightbulb/infra run test
          no_output_timeout: 20m
      # deploy.yml is GENERATED from apps/infra/lib/app.ts and synth rewrites it in
      # place, so `git diff` is the drift check (the long story is in infra-ci.yml).
      # Docker: the WS authorizer Lambda bundles its Python deps in a container.
      - run:
          name: Check deploy.yml matches the pipeline definition
          working_directory: apps/infra
          command: |
            npx cdk synth --no-notices > /dev/null
            if git diff --quiet -- ../../.github/workflows/deploy.yml; then
              echo "deploy.yml is in sync with apps/infra/lib/app.ts"
              exit 0
            fi
            git diff -- ../../.github/workflows/deploy.yml
            cat >&2 <<'MSG'

            ============================================================
            .github/workflows/deploy.yml is OUT OF SYNC with the pipeline
            definition in apps/infra/lib/app.ts (diff above).

            deploy.yml is generated, not hand-written. Regenerate and commit it:

                cd apps/infra && npx cdk synth
                git add ../../.github/workflows/deploy.yml
                git commit

            (Requires a running Docker daemon — synth bundles Lambda deps.)
            ============================================================
            MSG
            exit 1
          no_output_timeout: 20m

  infra-hermes-image-smokes:
    executor: machine
    steps:
      - checkout
      - run:
          name: Pull the pinned Hermes base image
          # hermes-version.json#base.image is a multi-arch manifest list; this x86_64 VM gets amd64.
          command: |
            IMAGE=$(jq -r '.base.image' hermes-version.json)
            echo "export IMAGE=$IMAGE" >> "$BASH_ENV"
            docker pull "$IMAGE"
          no_output_timeout: 20m
      - run:
          name: Run bridge smokes in the pinned image
          # Only bridge/ is bind-mounted; --network none: no model call, no egress.
          command: |
            shopt -s nullglob
            smokes=(apps/infra/hermes/tests/smoke/*.py)
            if [ ${#smokes[@]} -eq 0 ]; then
              echo "no smokes"
              exit 0
            fi
            for smoke in "${smokes[@]}"; do
              echo "== $smoke"
              docker run --rm --network none \
                -v "$PWD/apps/infra/hermes/bridge:/opt/bridge/bridge:ro" \
                -v "$PWD/$smoke:/opt/bridge/smoke.py:ro" \
                --entrypoint python "$IMAGE" /opt/bridge/smoke.py
            done
      - run:
          name: Apply the Lightbulb patch series to the pinned base and smoke it
          # The Dockerfile's loop, against the same pinned base: --check first, SERIES order.
          command: |
            W="$PWD"
            rm -rf /tmp/hermes
            cid=$(docker create "$IMAGE")
            docker cp "$cid:/opt/hermes" /tmp/hermes
            docker rm "$cid" >/dev/null
            cd /tmp/hermes
            for p in $(grep -E '^[0-9]{4}-.*\.patch$' "$W/apps/infra/hermes/hermes-patches/SERIES"); do
              git apply --check "$W/apps/infra/hermes/hermes-patches/$p"
              git apply "$W/apps/infra/hermes/hermes-patches/$p"
            done
            docker run --rm --network none \
              -v "/tmp/hermes:/opt/hermes" \
              -v "$W/apps/infra/hermes/tests/image_smoke/patched_hermes_smoke.py:/tmp/smoke.py:ro" \
              -e HERMES_HOME=/tmp/patched-smoke \
              --entrypoint python "$IMAGE" /tmp/smoke.py

  # ------------------------------------------------------------- company-ci.yml
  company-lint-test-build:
    executor: node
    resource_class: medium
    steps:
      - checkout
      - pnpm-install
      - run:
          name: Lint
          command: pnpm --filter @lightbulb/company run lint
      - run:
          name: Type check
          command: pnpm --filter @lightbulb/company run typecheck
      - run:
          name: Unit tests
          command: pnpm --filter @lightbulb/company run test --maxWorkers=2
      - run:
          name: Build
          command: pnpm --filter @lightbulb/company run build
          no_output_timeout: 20m

  # -------------------------------------------------------------------- tla.yml
  tla-tlc:
    docker:
      - image: cimg/openjdk:17.0
    resource_class: small
    steps:
      - checkout
      - run:
          name: Model-check every config
          command: tla/check.sh
          no_output_timeout: 15m

  # ----------------------------------------------------------- huddle-agent.yml
  huddle-agent-test:
    executor: uv
    resource_class: small
    steps:
      - checkout
      - uv-sync:
          project: apps/huddle-agent
      - run:
          name: Run tests
          working_directory: apps/huddle-agent
          command: uv run pytest

  # ------------------------------------------------------------ secret-scan.yml
  secret-scan:
    docker:
      - image: cimg/base:current
    resource_class: small
    environment:
      VERSION: 8.30.1
      SHA_X64: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      SHA_ARM64: e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080
    steps:
      - checkout
      - run:
          name: Install gitleaks
          # The binary, not gitleaks-action (which demands a GITLEAKS_LICENSE for org repos);
          # tarball pinned by sha256. Bump VERSION and both hashes together.
          command: |
            case "$(uname -m)" in
              x86_64) arch=x64; sha="$SHA_X64" ;;
              aarch64|arm64) arch=arm64; sha="$SHA_ARM64" ;;
              *) echo "unsupported arch"; exit 1 ;;
            esac
            f="gitleaks_${VERSION}_linux_${arch}.tar.gz"
            curl -fsSL -o "/tmp/$f" "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/$f"
            echo "$sha  /tmp/$f" | sha256sum -c -
            tar -xzf "/tmp/$f" -C /tmp gitleaks
      - run:
          name: Scan new commits
          # secret-scan.yml scans base.sha..head.sha of the PR; here that is the
          # commits this branch adds over main.
          command: |
            git fetch -q origin main
            RANGE="$(git merge-base origin/main HEAD)..HEAD"
            echo "scanning $RANGE"
            /tmp/gitleaks git --redact -v --log-opts="--diff-merges=first-parent $RANGE" .

workflows:
  secret-scan:
    jobs:
      - secret-scan

  backend:
    when: << pipeline.parameters.run-backend >>
    jobs:
      - backend-lint-test

  frontend:
    when: << pipeline.parameters.run-frontend >>
    jobs:
      - frontend-lint-build
      - frontend-unit-tests

  mobile:
    when: << pipeline.parameters.run-mobile >>
    jobs:
      - mobile-check-bundle

  infra:
    when: << pipeline.parameters.run-infra >>
    jobs:
      - infra-hermes-bridge-tests
      - infra-openrouter-gate-tests
      - infra-synth-test
      - infra-hermes-image-smokes

  company:
    when: << pipeline.parameters.run-company >>
    jobs:
      - company-lint-test-build

  tla:
    when: << pipeline.parameters.run-tla >>
    jobs:
      - tla-tlc

  huddle-agent:
    when: << pipeline.parameters.run-huddle >>
    jobs:
      - huddle-agent-test
