# B Shared goal: a request split across two speakers (routing rows B01a/b, B11).
- id: B-dev-01
  condition: B
  cast: [maya, leo]
  agents: {ceo: active, finance: active, engineering: active}
  steps:
    - as: maya
      say: "So we're trying to work out"
      expect:
        responder: null
        goal: open
