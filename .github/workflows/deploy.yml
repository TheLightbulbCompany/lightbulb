      - dev-lightbulb-dev-openrouter-gate-Deploy
      - dev-lightbulb-dev-service-Deploy
      - dev-lightbulb-dev-observability-Deploy
      - Build-Synth
    env: {}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: pnpm
      - name: Install Vercel CLI
        run: npm install -g vercel@63.1.0
      - name: Pull Vercel Settings
        run: vercel pull --yes --token=$VERCEL_TOKEN
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_COMPANY }}
      - name: Build Company Site
        run: vercel build --token=$VERCEL_TOKEN
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_COMPANY }}
      - name: Deploy to Vercel (Preview)
        run: vercel deploy --prebuilt --archive=tgz --token=$VERCEL_TOKEN
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_COMPANY }}
  dev-DeployVercelDev:
    name: DeployVercelDev
    permissions:
      contents: write
    runs-on: ${{ vars.DEPLOY_RUNNER }}
    needs:
      - dev-lightbulb-dev-auth-Deploy
      - dev-lightbulb-dev-dns-Deploy
      - dev-lightbulb-dev-agent-mail-outbound-Deploy
      - dev-lightbulb-dev-database-Deploy
      - dev-lightbulb-dev-network-Deploy
      - dev-lightbulb-dev-api-Deploy
      - dev-lightbulb-dev-container-Deploy
      - dev-lightbulb-dev-openrouter-gate-Deploy
      - dev-lightbulb-dev-service-Deploy
      - dev-lightbulb-dev-observability-Deploy
      - Build-Synth
    env: {}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: pnpm
      - name: Install Vercel CLI
        run: npm install -g vercel@63.1.0
      - name: Pull Vercel Settings
        run: vercel pull --yes --token=$VERCEL_TOKEN
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Build Frontend
        run: vercel build --token=$VERCEL_TOKEN
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY_DEV }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL_DEV }}
      - name: Deploy to Vercel (Preview)
        id: vercel-deploy-dev
        run: DEPLOY_URL=$(vercel deploy --prebuilt --archive=tgz --token=$VERCEL_TOKEN)
          && echo "DEPLOY_URL=$DEPLOY_URL" >> $GITHUB_OUTPUT
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Register dev.thelightbulb.company project domain
        run: vercel domains add dev.thelightbulb.company frontend --force
          --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Keep dev.thelightbulb.company off production deploys
        run: "curl -fsS -o /dev/null -X PATCH
          \"https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID/domains/dev.t\
          helightbulb.company?teamId=$VERCEL_ORG_ID\" -H \"Authorization: Bearer
          $VERCEL_TOKEN\" -H \"Content-Type: application/json\" -d
          '{\"gitBranch\":\"main\"}'"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Register admin.dev.thelightbulb.company project domain
        run: vercel domains add admin.dev.thelightbulb.company frontend --force
          --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Keep admin.dev.thelightbulb.company off production deploys
        run: "curl -fsS -o /dev/null -X PATCH
          \"https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID/domains/admin\
          .dev.thelightbulb.company?teamId=$VERCEL_ORG_ID\" -H \"Authorization:
          Bearer $VERCEL_TOKEN\" -H \"Content-Type: application/json\" -d
          '{\"gitBranch\":\"main\"}'"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Alias to dev.thelightbulb.company
        run: vercel alias ${{ steps.vercel-deploy-dev.outputs.DEPLOY_URL }}
          dev.thelightbulb.company --token=$VERCEL_TOKEN
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Alias to admin.dev.thelightbulb.company
        run: vercel alias ${{ steps.vercel-deploy-dev.outputs.DEPLOY_URL }}
          admin.dev.thelightbulb.company --token=$VERCEL_TOKEN
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Alias to dev.flickmeon.ai
        run: vercel alias ${{ steps.vercel-deploy-dev.outputs.DEPLOY_URL }}
          dev.flickmeon.ai --token=$VERCEL_TOKEN
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
