[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/neko-supervisord.pid

[program:pulseaudio]
command=/usr/bin/pulseaudio --daemonize=no --exit-idle-time=-1 --disallow-exit --disallow-module-loading
environment=HOME="/home/node",USER="node",DISPLAY=":1",XDG_RUNTIME_DIR="/tmp/neko-runtime",PULSE_SERVER="unix:/tmp/pulseaudio.socket"
autorestart=true
priority=100
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:openbox]
command=/usr/bin/openbox --config-file /etc/neko/openbox.xml
environment=HOME="/home/node",USER="node",DISPLAY=":1"
autorestart=true
priority=200
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:neko]
command=/usr/local/bin/neko serve --config /etc/neko/neko.yaml
environment=HOME="/home/node",USER="node",DISPLAY=":1",XDG_RUNTIME_DIR="/tmp/neko-runtime",PULSE_SERVER="unix:/tmp/pulseaudio.socket"
autorestart=true
priority=300
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
