<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Session</title>
<link rel="stylesheet" href="/xterm.css">
<style>
  html, body { margin: 0; height: 100%; background: #16161a; }
  #bar { position: absolute; top: 0; left: 0; right: 0; height: 28px; display: flex; justify-content: flex-end; align-items: center; padding: 0 8px; }
  #end { font: 12px -apple-system, system-ui, sans-serif; color: #e6e6e9; background: #2b2b33; border: 0; border-radius: 4px; padding: 3px 8px; cursor: pointer; }
  #t { position: absolute; inset: 30px 4px 4px 8px; }
  #note { position: absolute; left: 0; right: 0; bottom: 0; padding: 8px 12px; font: 13px -apple-system, system-ui, sans-serif;
          color: #e6e6e9; background: #2b2b33; display: none; }
</style>
</head>
<body>
<div id="bar"><button id="end" type="button">End session</button></div>
<div id="t"></div>
<div id="note" role="status"></div>
<script src="/xterm.js"></script>
<script src="/addon-fit.js"></script>
<script src="/terminal.js"></script>
</body>
</html>
