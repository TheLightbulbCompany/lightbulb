# The platform Lightbulb Slack app. Create it ONCE per environment at
# api.slack.com/apps → "From a manifest". Bot scopes MUST equal
# core/services/slack_install_service.BOT_SCOPES (test enforces it).
# Events API, not Socket Mode — Socket Mode apps cannot be listed in the
# Slack Marketplace, and an app-level token cannot be minted by OAuth.
display_information:
  name: Lightbulb
  description: Your AI company, in Slack. Ask Friday anything.
  background_color: "#0b0d17"
features:
  bot_user:
    display_name: Lightbulb
    always_online: true
  app_home:
    home_tab_enabled: true
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  agent_view:
    agent_description: Friday runs your company's agents. Ask for a status, hand off a task, or approve work right here.
    suggested_prompts:
      - title: What's in flight?
        message: What is the team working on right now?
      - title: Draft a brief
        message: Draft a brief for the next thing we should ship.
      - title: Approvals
        message: Anything waiting on my approval?
  slash_commands:
    - command: /lightbulb
      url: https://api-dev.thelightbulb.company/api/v1/slack/events
      description: Talk to Friday
      usage_hint: "[what you need]"
      should_escape: false
  shortcuts:
    - name: Ask Friday about this
      type: message
      callback_id: lightbulb_ask_message
      description: Send this message to Friday
    - name: Ask Friday
      type: global
      callback_id: lightbulb_ask_global
      description: Start a conversation with Friday
oauth_config:
  redirect_urls:
    - https://api-dev.thelightbulb.company/api/v1/slack/oauth/callback
  scopes:
    bot:
      - app_mentions:read
      - assistant:write
      - channels:history
      - channels:read
      - chat:write
      - commands
      - emoji:read
      - files:read
      - files:write
      - groups:history
      - groups:read
      - im:history
      - im:read
      - im:write
      - mpim:history
      - mpim:read
      - mpim:write
      - pins:read
      - pins:write
      - reactions:read
      - reactions:write
      - usergroups:read
      - users:read
settings:
  event_subscriptions:
    request_url: https://api-dev.thelightbulb.company/api/v1/slack/events
    bot_events:
      - app_home_opened
      - app_mention
      - app_context_changed
      - app_uninstalled
      - assistant_thread_context_changed
      - assistant_thread_started
      - channel_rename
      - member_joined_channel
      - member_left_channel
      - message.channels
      - message.groups
      - message.im
      - message.mpim
      - reaction_added
      - reaction_removed
      - tokens_revoked
  interactivity:
    is_enabled: true
    request_url: https://api-dev.thelightbulb.company/api/v1/slack/events
    message_menu_options_url: https://api-dev.thelightbulb.company/api/v1/slack/events
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
