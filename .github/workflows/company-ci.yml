# =============================================================================
# Company site CI (PRs only) — apps/company, thelightbulb.company
# =============================================================================
name: Company CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/company/**'
      - '.github/workflows/company-ci.yml'
      - 'pnpm-lock.yaml'

# Supersede in-flight runs for the same PR (github.ref is refs/pull/<n>/merge
# here, so the group is per-PR).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Lint/test/build only — the token never needs to write.
permissions:
  contents: read

env:
  NODE_VERSION: "20"

jobs:
  lint-test-build:
    name: Lint, test & build
    # GitHub-hosted (2026-11-05), not vars.CI_RUNNER: nothing here needs the box.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          # Per-runner-instance install dir: harmless on a fresh hosted runner, and
          # keeps concurrent installs apart on a shared self-hosted home.
          dest: ${{ runner.temp }}/setup-pnpm

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @lightbulb/company run lint

      - name: Type check
        run: pnpm --filter @lightbulb/company run typecheck

      - name: Unit tests
        run: pnpm --filter @lightbulb/company run test

      - name: Build
        run: pnpm --filter @lightbulb/company run build
