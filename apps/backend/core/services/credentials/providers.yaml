# Bucket A — paste-key (no OAuth, no refresh)
stripe:
  display_name: Stripe
  acquisition: paste_token
  actor: mcp
  refresh_owner: none
  validate: { method: GET, url: "https://api.stripe.com/v1/account", auth_header: Authorization }
  wiring:
    mcp_server: { key: stripe, command: npx, args: ["-y", "@stripe/mcp", "--tools=all"], env: { STRIPE_SECRET_KEY: input.token } }

# Bucket B — dedicated self-refreshing CLI
google:
  display_name: Google Workspace
  acquisition: direct_oauth
  actor: cli
  refresh_owner: actor
  # BYO-only: no Isol8-managed Google app. Every owner connects with their own
  # OAuth app and owns its Limited-Use compliance. Visible to all; the connect
  # path requires a stored app.
  byo_required: true
  byo_setup_url: "https://console.cloud.google.com/apis/credentials"
  requires: { bins: [gog] }
  oauth:
    authorization_url: "https://accounts.google.com/o/oauth2/v2/auth"
    token_url: "https://oauth2.googleapis.com/token"
    scopes: ["https://www.googleapis.com/auth/gmail.modify", "https://www.googleapis.com/auth/calendar", "https://www.googleapis.com/auth/drive"]
    scope_separator: " "
    pkce: true
    extra_authorize_params: { access_type: offline, prompt: consent }
  wiring:
    materializer: gog_cli

# Bucket A — paste-key mcp_server integrations (full access is the chosen default)
# Slack is NOT a paste-token MCP integration: agent Slack actions come from the
# OpenClaw bundled `slack` channel tool (react/pin/files/read/post), which reuses
# the Slack CHANNEL's bot token (set up in the Channels tab). The old
# slack-mcp-server integration (a separate `xoxp-` user token) was redundant with
# that tool and is removed; Slack lives in the Channels tab, not Integrations.

# Bucket B variant — REMOTE, OAuth-protected hosted MCP (see Attio below for the
# mcp_oauth rail mechanics). Notion hosts its own MCP and is deprecating the local
# `@notionhq/notion-mcp-server` npx server, so the integration rides the hosted
# endpoint instead of a stdio paste-token process. Notion's auth server advertises
# NO granular scopes — access is governed by which pages the owner shares with the
# integration on the consent screen — so the only scope requested is
# offline_access (to obtain a refresh token); the server round-trips it harmlessly.
notion:
  display_name: Notion
  acquisition: direct_oauth
  actor: mcp
  refresh_owner: actor
  oauth:
    authorization_url: "https://mcp.notion.com/authorize"
    token_url: "https://mcp.notion.com/token"
    registration_url: "https://mcp.notion.com/register"
    scopes: ["offline_access"]
    scope_separator: " "
    pkce: true
  mcp_remote:
    key: notion
    url: "https://mcp.notion.com/mcp"
    transport: streamable-http
  wiring:
    materializer: mcp_oauth

# Bucket B variant — REMOTE, OAuth-protected hosted MCP. Sentry recommends its
# hosted MCP over the local npx server. Its auth server exposes one read scope
# (org:read); the others are write-only (project/team/event:write), so a
# read-focused integration requests just org:read.
sentry:
  display_name: Sentry
  acquisition: direct_oauth
  actor: mcp
  refresh_owner: actor
  oauth:
    authorization_url: "https://mcp.sentry.dev/oauth/authorize"
    token_url: "https://mcp.sentry.dev/oauth/token"
    registration_url: "https://mcp.sentry.dev/oauth/register"
    scopes: ["org:read"]
    scope_separator: " "
    pkce: true
  mcp_remote:
    key: sentry
    url: "https://mcp.sentry.dev/mcp"
    transport: streamable-http
  wiring:
    materializer: mcp_oauth

# Bucket B variant — REMOTE, OAuth-protected hosted MCP. Linear recommends its
# hosted MCP over the local npx server. Its auth server exposes coarse read/write
# scopes; a read-focused integration requests just `read`.
linear:
  display_name: Linear
  acquisition: direct_oauth
