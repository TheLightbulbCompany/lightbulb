[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "huddle-agent"
version = "0.1.0"
description = "Lightbulb CEO huddle worker (LiveKit Agents)"
requires-python = ">=3.10, <3.15"

dependencies = [
    "livekit-agents[openai,silero]~=1.8",
    "httpx",
    "livekit-plugins-noise-cancellation~=0.3",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.uv]
# yarl 1.24.1 shipped only a cp310 wheel (from the LiveKit starter); drop once upstream fixes it.
constraint-dependencies = ["yarl<1.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
markers = ["replay: the rig's scenarios replayed offline against the call controller (tests/replay)"]
