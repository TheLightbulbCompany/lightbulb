[package]
name = "lightbulb-desktop"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "unstable"] }
tauri-plugin-deep-link = "2"
tauri-plugin-shell = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
toml_edit = "0.25"
tokio = { version = "1", features = ["full"] }
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
tar = "0.4"
flate2 = "1"
walkdir = "2"
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
url = "2"
open = "5.3.3"
lazy_static = "1.5.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
urlencoding = "2"
unicode-normalization = "0.1"
ed25519-dalek = { version = "2", features = ["pem", "pkcs8", "rand_core"] }
rand = "0.8"
lightbulb-core = { path = "../core" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
portable-pty = "0.9"
tungstenite = "0.26"
vt100 = "0.16"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-user-notifications = "0.3"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"

# [profile.release] lives in the workspace root (../Cargo.toml): cargo ignores a member's.
