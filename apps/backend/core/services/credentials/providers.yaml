# Bucket B variant — REMOTE, OAuth-protected hosted MCP (see Attio below for the
# mcp_oauth rail mechanics). Stripe hosts its own MCP at mcp.stripe.com behind
# OAuth with DCR; this replaces the paste-key stdio @stripe/mcp server (and its
# npx cold-start). Stripe's register endpoint rejects any scope it doesn't know
# — including offline_access and the empty string — and self-assigns "mcp", so
# that is the one scope requested; the refresh_token grant is issued regardless.
# The mcp_remote url must stay exactly the advertised protected-resource value
# (no path, no trailing slash): it rides the RFC 8707 resource param and a
# mismatch breaks token audiencing.
stripe:
  display_name: Stripe
  acquisition: direct_oauth
  actor: mcp
  refresh_owner: actor
  oauth:
    authorization_url: "https://access.stripe.com/mcp/oauth2/authorize"
    token_url: "https://access.stripe.com/mcp/oauth2/token"
    registration_url: "https://access.stripe.com/mcp/oauth2/register"
    scopes: ["mcp"]
    scope_separator: " "
    pkce: true
  mcp_remote:
    key: stripe
    url: "https://mcp.stripe.com"
    transport: streamable-http
  wiring:
    materializer: mcp_oauth
  # 1-click Automations trigger source. Stripe has no webhook-registration API
  # reachable with an MCP OAuth token (creating an endpoint needs a restricted
  # API key), so registration is guided: the owner pastes the proxy URL into
  # their own Stripe Dashboard, then pastes the signing secret it hands back.
  # signing_mode: hmac_sha256 is a NATIVE Paperclip mode — its `{t}.{body}`
  # HMAC scheme is exactly Stripe's, so Paperclip verifies the Stripe-Signature
  # against the trigger's secret once the owner's whsec_ is armed. The Isol8
  # trigger proxy only splits Stripe's combined `Stripe-Signature` header into
  # the separate signature/timestamp headers Paperclip reads.
  inbound:
    webhook_registration: guided_paste
    signing_mode: hmac_sha256
    instructions: >-
      In your Stripe Dashboard, open Developers → Webhooks and add an endpoint
      pointed at {proxy_url} listening for the '{event_label}' event
      ({event_id}). Stripe then shows the endpoint's signing secret — paste it
      back here to finish arming this automation.
    secret_hint: "whsec_…"
    events:
      - id: invoice.payment_failed
        label: Invoice payment failed
      - id: charge.refunded
        label: Charge refunded
      - id: customer.subscription.deleted
        label: Subscription canceled
    template:
      title: "Stripe: {event_label}"
      suggested_agent: friday
      starter_prompt: >-
        A Stripe webhook just fired: {event_label}. Look at the event payload,
        figure out what happened, and take the appropriate next step (e.g.
        follow up with the customer, flag it to the team, or update records).

# Bucket B — dedicated self-refreshing CLI
google:
  display_name: Google Workspace
  acquisition: direct_oauth
  actor: cli
  refresh_owner: actor
  # BYO-only: no Isol8-managed Google app. Every owner connects with their own
  # OAuth app and owns its Limited-Use compliance. Visible to all; the connect
  # path requires a stored app.
  byo_required: true
  byo_setup_url: "https://console.cloud.google.com/apis/credentials"
  requires: { bins: [gog] }
  oauth:
    authorization_url: "https://accounts.google.com/o/oauth2/v2/auth"
    token_url: "https://oauth2.googleapis.com/token"
    scopes: ["https://www.googleapis.com/auth/gmail.modify", "https://www.googleapis.com/auth/calendar", "https://www.googleapis.com/auth/drive"]
    scope_separator: " "
    pkce: true
    extra_authorize_params: { access_type: offline, prompt: consent }
  wiring:
    materializer: gog_cli
  # Automations trigger source — the third AUTO-registering shape, and the
  # first with NO provider-side signature: Google push channels POST with
  # X-Goog-Channel-Token: <the token set at watch time> and no body HMAC.
  # The seed sets the channel token to the trigger's own one-time secret and
  # the trigger proxy maps X-Goog-Channel-Token into Authorization: Bearer,
  # so Paperclip's native bearer mode does the timing-safe compare. The
  # Google side is registered via the owner's gog keyring (Calendar
  # events.watch on the picked account's primary calendar / Drive
  # changes.watch on its drive — see core/services/google_watch.py);
  # channels expire ≤7 days and are re-armed by the renewal sweep in
  # update_service. The resource is a connected Google ACCOUNT email,
  # validated against the stored inventory. No provider_events: the watch
  # call itself picks the surface — there is no event array to subscribe.
  # Notifications carry no payload, so the starter prompt names the account
  # and tells the agent to gog-list what changed.
  # Gmail rides the SAME inbound block but with per-EVENT registration (the
  # watch surfaces above keep the block-level auto_google_watch):
  #   gmail.poll — no webhook at all: the seed attaches an enabled */10 cron
  #     schedule trigger and the starter prompt has the agent gog-search for
  #     mail newer than the last run. Zero owner setup.
  #   gmail.message — real-time push via the OWNER'S OWN Pub/Sub topic
  #     (Gmail's users.watch only publishes to a caller-owned topic, and
  #     Google is BYO here, so the owner already has a GCP project). The seed
  #     runs `gog gmail watch start` against their topic and returns the
  #     one-time topic/subscription setup steps; deliveries arrive as
  #     Pub/Sub push with a per-delivery OIDC JWT, verified by the trigger
  #     proxy (which then injects the trigger's own bearer secret from the
  #     gmail watch entry). Watches expire ~7 days and ride the same renewal
  #     sweep as the push channels (`gog gmail watch renew`).
  inbound:
    webhook_registration: auto_google_watch
    signing_mode: bearer
    events:
      - id: calendar.changed
        label: Calendar changed
      - id: drive.changed
        label: Drive file changed
      - id: gmail.poll
        label: New email (checked on a schedule)
        registration: poll
        starter_prompt: >-
          Scheduled inbox check (account: {account}). Use gog with
          `-a {account}` to search for messages that arrived since the last
          run — this automation runs every 10 minutes, so e.g.
          `gog gmail search 'newer_than:1d in:inbox' -a {account}` and skip
          anything you already handled. Deal with each new message
          appropriately (reply, flag it to the team, file it); if nothing new
          arrived, do nothing and exit.
      - id: gmail.message
        label: New email (real-time push)
        registration: owner_setup
        starter_prompt: >-
          A Gmail push notification just fired: new mail in {account}'s
          inbox. The notification carries no message content — use gog with
          `-a {account}` to look at what arrived (e.g.
          `gog gmail search 'newer_than:1d in:inbox' -a {account}`) and take
          the appropriate next step (reply, flag it to the team, file it).
    template:
      title: "Google: {event_label}"
      suggested_agent: friday
      starter_prompt: >-
        A Google push notification just fired: {event_label} (account:
        {account}). The notification carries no payload — use gog with
        `-a {account}` to list what changed since the last run (calendar:
        recent and upcoming events; drive: recent changes) and take the
        appropriate next step (e.g. prep for the meeting, review the file,
        or brief the team).

# Bucket A — paste-key mcp_server integrations (full access is the chosen default)
# Slack is NOT a paste-token MCP integration: agent Slack actions come from the
# OpenClaw bundled `slack` channel tool (react/pin/files/read/post), which reuses
# the Slack CHANNEL's bot token (set up in the Channels tab). The old
# slack-mcp-server integration (a separate `xoxp-` user token) was redundant with
# that tool and is removed; Slack lives in the Channels tab, not Integrations.

# Bucket B variant — REMOTE, OAuth-protected hosted MCP (see Attio below for the
# mcp_oauth rail mechanics). Notion hosts its own MCP and is deprecating the local
# `@notionhq/notion-mcp-server` npx server, so the integration rides the hosted
# endpoint instead of a stdio paste-token process. Notion's auth server advertises
# NO granular scopes — access is governed by which pages the owner shares with the
# integration on the consent screen — so the only scope requested is
# offline_access (to obtain a refresh token); the server round-trips it harmlessly.
notion:
  display_name: Notion
  acquisition: direct_oauth
  actor: mcp
  refresh_owner: actor
  oauth:
    authorization_url: "https://mcp.notion.com/authorize"
    token_url: "https://mcp.notion.com/token"
    registration_url: "https://mcp.notion.com/register"
    scopes: ["offline_access"]
    scope_separator: " "
    pkce: true
  mcp_remote:
    key: notion
    url: "https://mcp.notion.com/mcp"
    transport: streamable-http
  wiring:
    materializer: mcp_oauth

# Bucket B variant — REMOTE, OAuth-protected hosted MCP. Sentry recommends its
# hosted MCP over the local npx server. Its auth server exposes one read scope
# (org:read); the others are write-only (project/team/event:write), so a
# read-focused integration requests just org:read.
sentry:
  display_name: Sentry
  acquisition: direct_oauth
  actor: mcp
  refresh_owner: actor
  oauth:
    authorization_url: "https://mcp.sentry.dev/oauth/authorize"
    token_url: "https://mcp.sentry.dev/oauth/token"
    registration_url: "https://mcp.sentry.dev/oauth/register"
    scopes: ["org:read"]
    scope_separator: " "
    pkce: true
  mcp_remote:
    key: sentry
    url: "https://mcp.sentry.dev/mcp"
    transport: streamable-http
  wiring:
    materializer: mcp_oauth
  # Automations trigger source. Sentry webhooks belong to an INTERNAL
  # INTEGRATION the owner creates in their own org (Settings → Developer
  # Settings) — creating one via API needs org:write/org:admin, which the MCP
  # OAuth grant doesn't carry, so registration is guided. Sentry signs with
  # HMAC-SHA256 over the raw body, hex, no prefix, in Sentry-Hook-Signature —
  # Paperclip's github_hmac mode verifies that as-is (its sha256= strip is
  # optional); the proxy just copies the header to X-Paperclip-Signature.
  # The secret is the integration's Client Secret.
  inbound:
    webhook_registration: guided_paste
    signing_mode: github_hmac
    signature_header: Sentry-Hook-Signature
    instructions: >-
      In Sentry, open Settings → Developer Settings → Custom Integrations and
      create a New Internal Integration. Set its Webhook URL to {proxy_url},
      enable the '{event_label}' webhook ({event_id}), and save. Then copy the
      integration's Client Secret and paste it back here to finish arming this
      automation.
    secret_hint: "Client Secret from the integration"
    events:
      - id: issue
        label: Issue created or changed
      - id: event_alert
        label: Issue alert fired
      - id: metric_alert
        label: Metric alert fired
    template:
      title: "Sentry: {event_label}"
      suggested_agent: friday
      starter_prompt: >-
        A Sentry webhook just fired: {event_label}. Look at the payload, figure
        out what broke or changed, and take the appropriate next step (e.g.
        triage the issue, flag it to the team, or open a task for the fix).

# Bucket B variant — REMOTE, OAuth-protected hosted MCP. Linear recommends its
# hosted MCP over the local npx server. Its auth server exposes coarse read/write
# scopes; a read-focused integration requests just `read`.
linear:
  display_name: Linear
  acquisition: direct_oauth
  actor: mcp
  refresh_owner: actor
  oauth:
    authorization_url: "https://mcp.linear.app/authorize"
    token_url: "https://mcp.linear.app/token"
    registration_url: "https://mcp.linear.app/register"
    scopes: ["read"]
    scope_separator: " "
    pkce: true
  mcp_remote:
    key: linear
    url: "https://mcp.linear.app/mcp"
    transport: streamable-http
  wiring:
    materializer: mcp_oauth
  # Automations trigger source. Linear's webhookCreate mutation needs the
  # `admin` OAuth scope (which Linear tells apps never to request and blocks
  # for app actors), so registration is guided: a workspace admin creates the
  # webhook by hand. Linear signs HMAC-SHA256 over the raw body, hex, no
  # prefix, in Linear-Signature — verified by Paperclip's github_hmac mode via
  # the proxy's header copy. The secret is the webhook's signing secret, shown
  # on its settings page.
  inbound:
    webhook_registration: guided_paste
    signing_mode: github_hmac
    signature_header: Linear-Signature
    instructions: >-
      In Linear, open Settings → API → Webhooks (you need to be a workspace
      admin) and create a new webhook. Paste {proxy_url} as the URL and select
      the '{event_label}' data ({event_id}). After creating it, copy the
      webhook's signing secret and paste it back here to finish arming this
      automation.
    secret_hint: "Signing secret from the webhook"
    events:
      - id: Issue
        label: Issue created or updated
      - id: Comment
        label: New comment
      - id: ProjectUpdate
        label: Project update posted
    template:
      title: "Linear: {event_label}"
      suggested_agent: friday
      starter_prompt: >-
        A Linear webhook just fired: {event_label}. Look at the payload, figure
        out what changed, and take the appropriate next step (e.g. update the
        team, cross-file a task, or act on the issue itself).

# Bucket B variant — platform OAuth app into the baked gh CLI (the github /
# gh-issues skills are baked into the OpenClaw image, so GitHub rides the
# materializer rail — gh's own hosts.yml on EFS — not mcp_server). One Isol8-owned
# GitHub OAuth App per env (an OAuth App takes a single callback URL, and ours
# is env-specific), stored at platform-oauth/github. The minted token rides the
# same gh_cli materializer a pasted PAT did; OAuth App tokens don't expire, so
# refresh stays `none`. GitHub ignores PKCE params — the client_secret carried
# by the platform app is what authenticates the exchange.
github:
  display_name: GitHub
  acquisition: direct_oauth
  actor: cli
  refresh_owner: none
  requires: { bins: [gh] }
  oauth:
    authorization_url: "https://github.com/login/oauth/authorize"
    token_url: "https://github.com/login/oauth/access_token"
    # gh's own login requests repo/read:org/gist; workflow on top so agents can
    # push .github/workflows changes without a refused push.
    scopes: ["repo", "read:org", "gist", "workflow"]
    scope_separator: " "
    platform_app: github
  validate: { method: GET, url: "https://api.github.com/user", auth_header: Authorization, headers: { X-GitHub-Api-Version: "2022-11-28" } }
  wiring:
    materializer: gh_cli
  # Automations trigger source — the first AUTO-registering one. The connected
  # gh token carries `repo` scope, which is enough to create repo webhooks, so
  # the seed registers the hook itself: the trigger's one-time secretMaterial
  # secret becomes the hook's HMAC secret, and GitHub's X-Hub-Signature-256 is
  # read natively by Paperclip's github_hmac mode — no signature_header copy,
  # no guided paste, no instructions. provider_events maps our curated event
  # id to the GitHub hook `events` array to subscribe.
  inbound:
    webhook_registration: auto_github
    signing_mode: github_hmac
    events:
      - id: issues
        label: Issue opened or changed
        provider_events: [issues]
      - id: pull_request
        label: Pull request opened or changed
        provider_events: [pull_request]
      - id: push
        label: Code pushed
        provider_events: [push]
    template:
      title: "GitHub: {event_label}"
      suggested_agent: friday
      starter_prompt: >-
        A GitHub webhook just fired: {event_label}. Look at the payload, figure
        out what changed in the repository, and take the appropriate next step
        (e.g. review the change, triage the issue, or brief the team).

# Bucket B variant — REMOTE, OAuth-protected MCP server. Attio hosts its own MCP
# at an HTTPS endpoint behind OAuth. A headless container owner can't run
# OpenClaw's interactive `openclaw mcp login`, so we drive the OAuth dance from
# the backend (Dynamic Client Registration mints a public PKCE-only client — no
# secret to safeguard) and the mcp_oauth materializer writes the MCP SDK's OAuth
# token file onto EFS + publishes the live mcp.servers.attio block. refresh_owner:
# actor because OpenClaw's in-container OAuthClientProvider auto-refreshes from
# that file. The server key/url/transport live under `mcp_remote` (not the
# mcp_server wiring rail) so the declared rail stays the materializer and the
# exactly-one-of-three wiring invariant holds.
attio:
  display_name: Attio
  acquisition: direct_oauth
  actor: mcp
  refresh_owner: actor
  oauth:
    authorization_url: "https://app.attio.com/oidc/authorize"
    token_url: "https://app.attio.com/oidc/token"
    registration_url: "https://app.attio.com/oauth/register"
    scopes: ["openid", "offline_access", "mcp"]
    scope_separator: " "
    pkce: true
  mcp_remote:
    key: attio
    url: "https://mcp.attio.com/mcp"
    transport: streamable-http
  wiring:
    materializer: mcp_oauth
  # Automations trigger source. Attio's POST /v2/webhooks needs the
  # webhook:read-write scope, which the MCP OAuth grant doesn't carry, so
  # registration is guided: the owner adds the webhook in their workspace
  # settings. Attio signs HMAC-SHA256 over the raw body, hex, no prefix, in
  # Attio-Signature — verified by Paperclip's github_hmac mode via the proxy's
  # header copy. The secret comes from the webhook's settings page.
  inbound:
    webhook_registration: guided_paste
    signing_mode: github_hmac
    signature_header: Attio-Signature
    instructions: >-
      In Attio, open Workspace Settings → Developers → Webhooks and add a
      webhook. Set its target URL to {proxy_url} and subscribe it to
      '{event_id}'. Then copy the webhook's signing secret and paste it back
      here to finish arming this automation.
    secret_hint: "Signing secret from the webhook"
    events:
      - id: record.created
        label: Record created
      - id: record.updated
        label: Record updated
      - id: task.created
        label: Task created
    template:
      title: "Attio: {event_label}"
      suggested_agent: friday
      starter_prompt: >-
        An Attio webhook just fired: {event_label}. Look at the payload, figure
        out which record or task changed, and take the appropriate next step
        (e.g. enrich the record, follow up with the contact, or notify the
        team).

