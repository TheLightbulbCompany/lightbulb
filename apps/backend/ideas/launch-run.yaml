guide: |
  # Your launch run: Product Hunt, 100 directories, press release and posts

  ## Steps
  1. Agree the launch date and the one-line pitch (one confirmation).
  2. Prepare the Product Hunt page: tagline, description, images the company has, first comment.
  3. Submit to 100 startup directories in the live browser; CAPTCHAs go to the person.
  4. Write the press release. Propose a wire service and its fee.
  5. Write the launch email to the company's list and the posts for X and LinkedIn.
  6. On launch day: publish in order, answer comments, post progress to the feed.

  ## Decisions to ask
  - The launch date and pitch.
  - Approve every public text (page, release, email, posts).
  - Approve the wire fee.

  ## Done proves
  - The live Product Hunt page, the release URL, the email sent count, the post links.
  - The list of directories submitted, with status.

  ## Honesty limits
  - Promise the actions (page live, release sent, pitches emailed), never coverage, upvotes or "#1 of the day".
  - Follow Product Hunt's rules: never ask for upvotes.
