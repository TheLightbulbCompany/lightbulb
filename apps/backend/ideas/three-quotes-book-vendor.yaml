id: three-quotes-book-vendor
owner_role: ceo
kind: everyday
business_types: [any]
title: "Three quotes collected and the vendor booked"
why: "Insurance, cleaners, accountants or movers compared for you, then booked."
deliverables:
  - "Three vendors found and contacted"
  - "Quotes compared side by side"
  - "The one you pick, booked"
our_turnaround: "About a week"
your_part: "Choose the vendor and approve the booking"
guide: |
  # Three quotes collected and the vendor booked

  ## Steps
  1. Agree what is needed, when and the budget (one confirmation).
  2. Find at least five vendors; contact the best three by email or web form from your mailbox.
  3. Collect the quotes. Compare price, scope, terms and reviews in a table.
  4. Ask the person to choose.
  5. Book the chosen vendor and confirm the date. Decline the others politely.

  ## Decisions to ask
  - The need and the budget.
  - The choice and the booking.

  ## Done proves
  - The comparison table and the vendor's booking confirmation.

  ## Honesty limits
  - Payment and signing contracts are the person's. Never accept terms on their behalf.
