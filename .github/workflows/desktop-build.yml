# Standalone desktop (Tauri DMG) build — dev + prod, signed & notarized.
#
# Runs on a SELF-HOSTED macOS runner (label `macos-desktop`) instead of
# GitHub-hosted `macos-15`. The runner must be registered to the Isol8AI/isol8
# repo ONLY — never to public forks — since it executes the Apple signing cert
# and secrets on a physical Mac. Fall back to GitHub-hosted by changing the two
# `runs-on:` lines to `macos-15`.
#
# Previously these two jobs were prod-stage post-steps inside the CDK pipeline
# (deploy.yml, generated by apps/infra/lib/app.ts). Split out so a queued or
# failed desktop build no longer marks a deploy run failed, and so an offline
# self-hosted runner never wedges the deploy pipeline.
#
# Version is 0.4.${{ github.run_number }}. The minor was bumped 0.3 -> 0.4
# because github.run_number resets to 1 for this new workflow; 0.4.1 still
# semver-beats the last pipeline-published 0.3.914 so the Tauri auto-updater
# keeps offering forward upgrades. Bump the minor again only on a real change.
#
# Native on.push.paths gating replaces the old dorny/paths-filter + per-step
# `if:` hack (which existed only because the CDK pipeline can't express
# per-job paths). build-desktop-prod `needs` build-desktop-dev so it reuses
# the warm Rust cache (shared-key: desktop).

name: desktop-build
'on':
  push:
    branches:
    - main
    paths:
    - apps/desktop/**
    - pnpm-lock.yaml
    - .github/workflows/desktop-build.yml
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: desktop-build
  cancel-in-progress: false
jobs:
  build-desktop-dev:
    name: BuildDesktopDev
    runs-on:
    - self-hosted
    - macos-desktop
    timeout-minutes: 90
    steps:
    - name: Checkout
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
    - name: Setup pnpm
      uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 22
        cache: pnpm
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      with:
        targets: aarch64-apple-darwin
    - name: Cache Rust target dir
      uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      with:
        workspaces: apps/desktop/src-tauri -> target
        key: aarch64-apple-darwin
        shared-key: desktop
    - name: Install dependencies
      run: pnpm install
    - name: Patch tauri.conf.json for dev
      run: |-
        TAURI_CFG=apps/desktop/src-tauri/tauri.conf.json
        jq --arg url "https://dev.isol8.co/chat" \
           --arg updateUrl "https://dev.isol8.co/api/desktop/update/{{target}}/{{current_version}}?x-vercel-protection-bypass=${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}&x-vercel-set-bypass-cookie=true" \
           --arg version "0.4.${{ github.run_number }}" '
          .version = $version |
          .bundle.targets = ["app"] |
          .build.devUrl = $url |
          .build.frontendDist = $url |
          .app.windows[0].url = $url |
          .plugins.updater.endpoints = [$updateUrl]
        ' "$TAURI_CFG" > "$TAURI_CFG.new"
        mv "$TAURI_CFG.new" "$TAURI_CFG"
        echo "Patched tauri.conf.json:"
        jq '{version, devUrl: .build.devUrl, frontendDist: .build.frontendDist, windowUrl: .app.windows[0].url, signingIdentity: .bundle.macOS.signingIdentity, updaterEndpoints: .plugins.updater.endpoints}' "$TAURI_CFG"
    - name: Vendor browser sidecar (aarch64-apple-darwin)
      run: bash apps/desktop/src-tauri/scripts/vendor-sidecars.sh aarch64-apple-darwin
    - name: Set up signing keychain
      run: |-
        set -euo pipefail
        KEYCHAIN_PATH="$RUNNER_TEMP/isol8-build.keychain-db"
        KEYCHAIN_PASSWORD="$(uuidgen)"
        CERT_PATH="$RUNNER_TEMP/cert.p12"

        echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"
        # Self-hosted runner: $RUNNER_TEMP survives a mid-job runner crash, so a
        # stale keychain can linger and make create-keychain fail. Pre-delete it.
        security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" \
          -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
        security list-keychain -d user -s "$KEYCHAIN_PATH" \
          $(security list-keychain -d user | tr -d '" \t')
        security set-key-partition-list -S apple-tool:,apple:,codesign: \
          -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
        rm -f "$CERT_PATH"

        echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
        echo "Identity in keychain:"
        security find-identity -v -p codesigning "$KEYCHAIN_PATH"
      env:
        APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
    - name: Pre-sign embedded native modules
      run: |-
        set -euo pipefail
        export SIGN_ID="Developer ID Application: Prasiddha Parthsarthy (WZX4U3C22Y)"
        export NODE_ENTITLEMENTS="$PWD/apps/desktop/src-tauri/entitlements-node.plist"
        BIN_ROOT="apps/desktop/src-tauri/bin"

        CANDIDATES=$(mktemp)
        MACHO_LIST=$(mktemp)
        find "$BIN_ROOT" \( \
          -name '*.node' -o \
          -name '*.dylib' -o \
          -name '*.so' -o \
          -name 'spawn-helper' -o \
          -name 'node-*-apple-darwin' \
        \) -type f -print0 > "$CANDIDATES"
        while IFS= read -r -d '' f; do
          if file -b "$f" | grep -q "Mach-O"; then
            printf '%s\0' "$f" >> "$MACHO_LIST"
          fi
        done < "$CANDIDATES"
        rm -f "$CANDIDATES"
        MACHO_COUNT=$(tr -dc '\0' < "$MACHO_LIST" | wc -c | tr -d ' ')
        echo "Found $MACHO_COUNT Mach-O binaries to sign under $BIN_ROOT."

        SIGN_SCRIPT="$RUNNER_TEMP/sign-one.sh"
        cat > "$SIGN_SCRIPT" <<'WORKER'
        #!/usr/bin/env bash
        set -euo pipefail
        f="$1"
        ENT_ARGS=()
        case "$(basename "$f")" in
          node-*-apple-darwin)
            ENT_ARGS=(--entitlements "$NODE_ENTITLEMENTS")
            ;;
        esac
        codesign --force --options runtime --timestamp \
          ${ENT_ARGS[@]+"${ENT_ARGS[@]}"} \
          --sign "$SIGN_ID" --keychain "$KEYCHAIN_PATH" "$f"
        WORKER
        chmod +x "$SIGN_SCRIPT"

        xargs -0 -P 8 -n 1 "$SIGN_SCRIPT" < "$MACHO_LIST"
        rm -f "$MACHO_LIST" "$SIGN_SCRIPT"
    - name: Build desktop app (aarch64-apple-darwin)
      uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
      with:
        projectPath: apps/desktop
        tagName: desktop-dev-v0.4.${{ github.run_number }}
        releaseName: Isol8 Desktop [DEV] v0.4.${{ github.run_number }}
        releaseDraft: true
        prerelease: true
        args: --target aarch64-apple-darwin
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        ISOL8_CALLBACK_URL: https://dev.isol8.co/auth/desktop-callback
    - name: Build, sign + notarize DMG (headless makehybrid)
      run: |-
        set -euo pipefail
        APP="apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Isol8.app"
        SIGN_ID="Developer ID Application: Prasiddha Parthsarthy (WZX4U3C22Y)"
        VERSION="0.4.${{ github.run_number }}"
        DMG="Isol8_${VERSION}_aarch64.dmg"
        TAG="desktop-dev-v${VERSION}"
        # Stage the .app plus an Applications symlink so the DMG is drag-to-install.
        STAGE="$(mktemp -d)"
        ditto "$APP" "$STAGE/Isol8.app"
        ln -s /Applications "$STAGE/Applications"
        # Build the DMG WITHOUT mounting a scratch volume. Tauri's bundle_dmg.sh
        # mounts under /Volumes and copies via Finder, which needs Full Disk Access
        # the self-hosted runner doesn't have. makehybrid writes the image tree
        # directly and convert reads blocks — neither touches /Volumes.
        RAW="$RUNNER_TEMP/Isol8_raw.dmg"
        rm -f "$RAW" "$DMG"
        hdiutil makehybrid -hfs -hfs-volume-name "Isol8" -o "$RAW" "$STAGE"
        hdiutil convert "$RAW" -format UDZO -o "$DMG"
        rm -f "$RAW"; rm -rf "$STAGE"
        # Sign, notarize, staple the DMG (the .app inside is already notarized+stapled).
        codesign --force --timestamp --keychain "$KEYCHAIN_PATH" --sign "$SIGN_ID" "$DMG"
        xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
        xcrun stapler staple "$DMG"
        # Upload to the release tauri-action created (still a draft at this point).
        gh release upload "$TAG" "$DMG" --repo Isol8AI/isol8 --clobber
        echo "Published $DMG to $TAG"
      env:
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Publish draft release
      run: gh release edit "desktop-dev-v0.4.${{ github.run_number }}" --repo Isol8AI/isol8 --draft=false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    # Persistent runner: never leave the Apple signing key on disk between runs.
    - name: Clean up signing keychain
      if: always()
      run: security delete-keychain "$RUNNER_TEMP/isol8-build.keychain-db" || true
  build-desktop-prod:
    name: BuildDesktopProd
    runs-on:
    - self-hosted
    - macos-desktop
    timeout-minutes: 90
    needs:
    - build-desktop-dev
    steps:
