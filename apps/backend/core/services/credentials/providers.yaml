# Bucket B variant — REMOTE, OAuth-protected hosted MCP. Sentry recommends its
# hosted MCP over the local npx server. Its auth server exposes one read scope
# (org:read); the others are write-only (project/team/event:write), so a
# read-focused integration requests just org:read.
sentry:
  display_name: Sentry
  acquisition: direct_oauth
  actor: mcp
  refresh_owner: backend
  environments: [dev, prod]
  oauth:
    authorization_url: "https://mcp.sentry.dev/oauth/authorize"
    token_url: "https://mcp.sentry.dev/oauth/token"
    registration_url: "https://mcp.sentry.dev/oauth/register"
    scopes: ["org:read"]
    scope_separator: " "
    pkce: true
  mcp_remote:
    key: sentry
    url: "https://mcp.sentry.dev/mcp"
    transport: streamable-http
  wiring:
    materializer: mcp_oauth
  # Automations trigger source. Sentry webhooks belong to an INTERNAL
  # INTEGRATION the owner creates in their own org (Settings → Developer
  # Settings) — creating one via API needs org:write/org:admin, which the MCP
  # OAuth grant doesn't carry, so registration is guided. Sentry signs with
  # HMAC-SHA256 over the raw body, hex, no prefix, in Sentry-Hook-Signature —
  # Paperclip's github_hmac mode verifies that as-is (its sha256= strip is
  # optional); the proxy just copies the header to X-Paperclip-Signature.
  # The secret is the integration's Client Secret.
  inbound:
    webhook_registration: guided_paste
    signing_mode: github_hmac
    signature_header: Sentry-Hook-Signature
    instructions: >-
      In Sentry, open Settings → Developer Settings → Custom Integrations and
      create a New Internal Integration. Set its Webhook URL to {proxy_url},
      enable the webhooks for {event_labels} ({event_ids}), and save. Then copy
      the integration's Client Secret and paste it back here to finish arming
      this automation.
    secret_hint: "Client Secret from the integration"
    # Full catalog: the fixed Sentry-Hook-Resource list at
    # https://docs.sentry.io/organization/integrations/integration-platform/webhooks/,
    # fetched 2026-08-13.
    events:
      - id: issue
        label: Issue created or changed
      - id: event_alert
        label: Issue alert fired
      - id: metric_alert
        label: Metric alert fired
      - id: comment
        label: Comment
      - id: error
        label: Error
      - id: installation
        label: Installation
      - id: preprod_artifact
        label: Preprod artifact
      - id: seer
        label: Seer
    template:
      title: "Sentry: {event_label}"
      suggested_agent: friday
      starter_prompt: >-
        A Sentry webhook just fired: {event_label}. Look at the payload, figure
        out what broke or changed, and take the appropriate next step (e.g.
        triage the issue, flag it to the team, or open a task for the fix).

