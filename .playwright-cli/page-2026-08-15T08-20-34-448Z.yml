                                                        - heading [level=1]: Nightly CEO progress
                                                        - paragraph: "[NIGHTLY-CEO-LOOP] Scheduled nightly wake — you are explicitly authorized ON THIS ISSUE to review the company backlog and self-assign ONE task you can complete now, execute it, then exit. Owner: Friday (CEO). Trigger: schedule `0 8 * * *` UTC. Output artifact: a comment on this run issue naming the ONE task picked, what you did, and a link to whatever you produced (issue, document, PR, file). If you produced nothing, say so plainly. KPI / evaluation metric: one completed task per wake with a linked artifact; zero invented work; zero tasks claimed complete without an artifact. Escalation path: if the task needs an owner decision, comment the decision needed and assign an issue to the owner. Do not decide it yourself. Recovery: if the run fails, record the blocker and what would unblock it. Do not retry the same task the next night without noting why. Stop condition: ONE task per wake. Do not invent new work. If nothing is doable, do nothing and exit. Close this run by commenting: OUTCOME: ok|failed|escalated + one line of evidence."
