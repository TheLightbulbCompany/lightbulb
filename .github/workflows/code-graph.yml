name: Code graph

# Rebuilds the graphify code graph after every merge to main and publishes it
# as the assets of one fixed pre-release, `code-graph`, overwritten each time.
# Anyone (a person, Forge, Codex, another session) gets the current graph with:
#   gh release download code-graph -R TheLightbulbCompany/lightbulb -p graph.json.gz
#
# Why a release asset and not a commit: every push to main runs a dev deploy,
# so a bot commit after each merge would double the deploys.
#
# Why the desktop updater is safe: it picks releases by tag prefix
# (`desktop-v` / `desktop-dev-v`, apps/frontend/src/lib/githubReleases.ts), and
# this release is a pre-release that is never marked latest.
#
# Code only: AST extraction, no LLM, no API key. Doc semantics stay local.

on:
  push:
    branches: [main]
  workflow_dispatch:

# A newer merge supersedes an older rebuild.
concurrency:
  group: code-graph
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ vars.CI_RUNNER }}
    # ~90 s measured locally; the cap bounds a hang on the shared runner.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4

      - name: Build the code graph
        run: |
          mkdir -p graphify-out
          uvx --from graphifyy==0.9.46 graphify update . --no-cluster
          test -s graphify-out/graph.json

      - name: Package
        run: |
          python3 scripts/export-architecture-graph.py graphify-out/graph.json code-graph.json.gz
          gzip -9 -c graphify-out/graph.json > graph.json.gz
          printf '{"commit":"%s","built_at":"%s"}\n' "$GITHUB_SHA" "$(date -u +%FT%TZ)" > graph-meta.json
          ls -la graph.json.gz code-graph.json.gz graph-meta.json

      - name: Publish to the code-graph release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const tag = 'code-graph';
            const body = `Code graph for ${context.sha}. Rebuilt on every merge to main by .github/workflows/code-graph.yml.`;
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({ owner, repo, tag })).data;
              release = (await github.rest.repos.updateRelease({
                owner, repo, release_id: release.id, body, prerelease: true, make_latest: 'false',
              })).data;
            } catch (e) {
              if (e.status !== 404) throw e;
              release = (await github.rest.repos.createRelease({
                owner, repo, tag_name: tag, target_commitish: context.sha, name: 'Code graph',
                body, prerelease: true, make_latest: 'false',
              })).data;
            }
            const types = { 'graph.json.gz': 'application/gzip', 'code-graph.json.gz': 'application/gzip', 'graph-meta.json': 'application/json' };
            for (const name of Object.keys(types)) {
              for (const a of release.assets.filter(a => a.name === name)) {
                await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: a.id });
              }
              await github.rest.repos.uploadReleaseAsset({
                owner, repo, release_id: release.id, name,
                data: fs.readFileSync(name),
                headers: { 'content-type': types[name], 'content-length': fs.statSync(name).size },
              });
            }
