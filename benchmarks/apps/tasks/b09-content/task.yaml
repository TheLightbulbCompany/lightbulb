id: b09-content
kind: content-site
type: build
prompt: |
  Please build a small blog for our company with a simple editor role. Anyone, signed in or not, can read the blog at `/blog`: a list of published posts, newest first, and a page for each post at `/blog/[slug]` with its title and body. People can also sign up (name, email, password; signed in straight away) and sign in and out, but readers do not need an account.

  Editing: a signed-up person is a plain `reader` unless their email address starts with `editor+` (for example `editor+jo@example.test`), in which case they become an `editor` at sign-up. Nobody can change their own role. The header shows the signed-in person's role as exactly `reader` or `editor`. Editors manage posts at `/admin/posts` (all posts, including drafts) and `/admin/posts/new`: a title, a unique slug, a body, and a published checkbox. A post without the published box ticked is a draft: it never appears on `/blog`, and opening its slug shows a not-found page to the public. Saving with a blank title, blank slug or a slug already used shows an error and saves nothing.

  Everything about editing is enforced on the server. A signed-out visitor to `/admin/posts` goes to sign-in; a signed-in reader gets a page showing a `forbidden-message` element and none of the posts. `POST /api/posts` (body `{ title, slug, body, published }`) creates a post for editors only: 401 signed out, 403 for a reader.

  Names the checks rely on. Please use these exactly, because an automatic check drives the app by them.

  Pages: `/auth/sign-up`, `/auth/sign-in`, `/blog`, `/blog/[slug]`, `/admin/posts`, `/admin/posts/new`, `/api/posts`.

  Elements: give each of these a `data-testid` attribute with exactly this value: `signup-name`, `signup-email`, `signup-password`, `signup-submit`, `signup-error`, `signin-email`, `signin-password`, `signin-submit`, `signin-error`, `user-menu`, `sign-out-button`, `blog-list`, `blog-post-card`, `blog-post-link`, `post-title`, `post-body`, `forbidden-message`, `post-form-title`, `post-form-slug`, `post-form-body`, `post-form-published`, `post-form-submit`, `post-form-error`, `admin-post-row`, `role-badge`.
fixture: blank
journeys: journeys.spec.ts
probes:
  - id: unauth-admin-posts
    kind: unauthenticated-route
    target: /admin/posts
  - id: sqli-admin-posts-new
    kind: sql-injection
    target: /admin/posts/new
    as: editor+probe # a plain reader is forbidden from this page, so the probe needs the editor role the app grants by email
timeoutMin: 45
