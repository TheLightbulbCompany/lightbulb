# Bucket B variant — `gh` CLI + github/gh-issues skills are baked into the OpenClaw
# image, so GitHub rides the materializer rail (gh's own hosts.yml on EFS), not
# mcp_server. A bad PAT answers 401, so status-based validate suffices; the pinned
# API-version header rides every call. refresh_owner: none — the PAT is a paste key
# retained in Secrets Manager.
github:
  display_name: GitHub
  acquisition: paste_token
  actor: cli
  refresh_owner: none
  requires: { bins: [gh] }
  validate: { method: GET, url: "https://api.github.com/user", auth_header: Authorization, headers: { X-GitHub-Api-Version: "2022-11-28" } }
  wiring:
    materializer: gh_cli

# Bucket B variant — REMOTE, OAuth-protected MCP server. Attio hosts its own MCP
# at an HTTPS endpoint behind OAuth. A headless container owner can't run
# OpenClaw's interactive `openclaw mcp login`, so we drive the OAuth dance from
# the backend (Dynamic Client Registration mints a public PKCE-only client — no
# secret to safeguard) and the mcp_oauth materializer writes the MCP SDK's OAuth
# token file onto EFS + publishes the live mcp.servers.attio block. refresh_owner:
# actor because OpenClaw's in-container OAuthClientProvider auto-refreshes from
# that file. The server key/url/transport live under `mcp_remote` (not the
# mcp_server wiring rail) so the declared rail stays the materializer and the
# exactly-one-of-three wiring invariant holds.
attio:
  display_name: Attio
  acquisition: direct_oauth
  actor: mcp
  refresh_owner: actor
  oauth:
    authorization_url: "https://app.attio.com/oidc/authorize"
    token_url: "https://app.attio.com/oidc/token"
    registration_url: "https://app.attio.com/oauth/register"
    scopes: ["openid", "offline_access", "mcp"]
    scope_separator: " "
    pkce: true
  mcp_remote:
    key: attio
    url: "https://mcp.attio.com/mcp"
    transport: streamable-http
  wiring:
    materializer: mcp_oauth

# Bucket B variant — REMOTE, OAuth-protected hosted MCP (see Attio above for the
# mcp_oauth rail mechanics). Intercom's auth server advertises no granular scopes
# and exposes no resource-metadata document, so the only scope requested is
# offline_access (to obtain a refresh token). Note: Intercom's DCR endpoint
# enforces a redirect-URI allowlist, so the Isol8 callback URL must be registered
# with Intercom before the first connection succeeds.
intercom:
  display_name: Intercom
  acquisition: direct_oauth
  actor: mcp
  refresh_owner: actor
  oauth:
    authorization_url: "https://mcp.intercom.com/authorize"
    token_url: "https://mcp.intercom.com/token"
    registration_url: "https://mcp.intercom.com/register"
    scopes: ["offline_access"]
    scope_separator: " "
    pkce: true
  mcp_remote:
    key: intercom
    url: "https://mcp.intercom.com/mcp"
    transport: streamable-http
  wiring:
    materializer: mcp_oauth

# Bucket A variant — bundled web-search PROVIDER plugin (not an MCP, not a CLI).
# The `parallel` provider ships in the OpenClaw image and exposes a free tier; the
# owner pastes a free Parallel key (par-...) once. The openclaw_paths rail selects
# the provider and writes the key to the path the bundled provider reads
# (tools.web.search.parallel.apiKey). Selecting tools.web.search.provider
# auto-enables the bundled `parallel` plugin (plugin-auto-enable), so no explicit
# enable flag is needed. No validate endpoint: Parallel only exposes /v1/search, so
# the key is checked at first search rather than risk false-rejecting a valid key
# against a guessed request body.
parallel:
  display_name: Parallel (Web Search)
  acquisition: paste_token
  actor: skill
  refresh_owner: none
  wiring:
    openclaw_paths:
      - { path: "tools.web.search.provider", source: "literal:parallel-free" }
      - { path: "tools.web.search.parallel.apiKey", source: "input.token" }
