guide: |
  # Your top 50 product listings rewritten and updated

  ## Steps
  1. Ask in the DM to connect the store or sign in to Seller Central in the live browser.
  2. Pick the top 50 products by sales (or ask which ones).
  3. For each, read the current listing, reviews and competitor listings. Note the buyer questions.
  4. Rewrite title, bullets, description and backend search terms within the marketplace's rules.
  5. Ask for approval of the first 5. Apply feedback, then ask for approval of the batch.
  6. Update the listings. Keep the old text in a document so any change can be undone.

  ## Decisions to ask
  - Which products, if sales data is not available.
  - Approve the first 5, then the batch.

  ## Done proves
  - Every updated listing URL, with old and new text in a document on the task.

  ## Honesty limits
  - Never promise a sales or rank increase.
  - No claims the product does not support. Photography is not included.
