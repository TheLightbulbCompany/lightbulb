guide: |
  # Every new lead answered within minutes and the call booked

  ## Steps
  1. Ask in the DM to connect the inbox (Gmail or Outlook) and the calendar, and where leads arrive (form, email, CRM).
  2. Draft the reply template and the questions to qualify a lead.
  3. Set up a routine that checks for new leads often.
  4. Reply to each new lead; offer times from the calendar and book the call.
  5. Log each lead and its status on the task board or the CRM.

  ## Decisions to ask
  - Approve the template and qualifying questions.
  - Each reply, until the person says replies can go without approval.

  ## Done proves
  - Reply times for the first leads, and booked calls on the calendar.

  ## Honesty limits
  - Never promise prices, dates or terms the company has not approved.
