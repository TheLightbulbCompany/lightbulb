# Bucket B variant — platform OAuth app into the baked gh CLI (the github /
# gh-issues skills are baked into the OpenClaw image, so GitHub rides the
# materializer rail — gh's own hosts.yml on EFS — not mcp_server). One Isol8-owned
# GitHub OAuth App per env (an OAuth App takes a single callback URL, and ours
# is env-specific), stored at platform-oauth/github. The minted token rides the
# same gh_cli materializer a pasted PAT did; OAuth App tokens don't expire, so
# refresh stays `none`. GitHub ignores PKCE params — the client_secret carried
# by the platform app is what authenticates the exchange.
github:
  display_name: GitHub
  browser_domains: [github.com]
  acquisition: direct_oauth
  actor: cli
  refresh_owner: none
  requires: { bins: [gh] }
  oauth:
    authorization_url: "https://github.com/login/oauth/authorize"
    token_url: "https://github.com/login/oauth/access_token"
    # gh's own login requests repo/read:org/gist; workflow on top so agents can
    # push .github/workflows changes without a refused push.
    scopes: ["repo", "read:org", "gist", "workflow"]
    scope_separator: " "
    platform_app: github
  validate: { method: GET, url: "https://api.github.com/user", auth_header: Authorization, headers: { X-GitHub-Api-Version: "2022-11-28" } }
  wiring:
    materializer: gh_cli
  # Automations trigger source — the first AUTO-registering one. The connected
  # gh token carries `repo` scope, which is enough to create repo webhooks, so
  # the seed registers the hook itself: the trigger's one-time secretMaterial
  # secret becomes the hook's HMAC secret, and GitHub's X-Hub-Signature-256 is
  # read natively by Paperclip's github_hmac mode — no signature_header copy,
  # no guided paste, no instructions. provider_events maps our curated event
  # id to the GitHub hook `events` array to subscribe.
  inbound:
    webhook_registration: auto_github
    signing_mode: github_hmac
    # Full catalog: every event whose availability includes "repository" in
    # GitHub's own docs data (github/docs src/webhooks/data/fpt/*.json),
