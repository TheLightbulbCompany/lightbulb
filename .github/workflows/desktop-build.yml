# Standalone desktop (Tauri DMG) build — prod only, signed & notarized, on a manual dispatch.
#
# No dev build (owner decision 2026-10-04): desktop testing happens on prod; for dev, build
# and run the app locally against the dev API. Pull requests still run the Rust tests.
#
# Runs on a SELF-HOSTED macOS runner (label `macos-desktop`) instead of
# GitHub-hosted `macos-15`. The runner must be registered to the TheLightbulbCompany/lightbulb
# repo ONLY — never to public forks — since it executes the Apple signing cert
# and secrets on a physical Mac. Fall back to GitHub-hosted by changing the two
# `runs-on:` lines to `macos-15`.
#
# Previously these two jobs were prod-stage post-steps inside the CDK pipeline
# (deploy.yml, generated by apps/infra/lib/app.ts). Split out so a queued or
# failed desktop build no longer marks a deploy run failed, and so an offline
# self-hosted runner never wedges the deploy pipeline.
#
# Version is 0.4.${{ github.run_number }}. The minor was bumped 0.3 -> 0.4
# because github.run_number resets to 1 for this new workflow; 0.4.1 still
# semver-beats the last pipeline-published 0.3.914 so the Tauri auto-updater
# keeps offering forward upgrades. Bump the minor again only on a real change.
#
# Native on.push.paths gating replaces the old dorny/paths-filter + per-step
# `if:` hack (which existed only because the CDK pipeline can't express
# per-job paths). Only a manual dispatch builds (prod). Prod used
# to `need` dev to inherit a warm Rust cache; the cache is now local (below).
#
# This Mac sits on a slow, unstable home uplink. So: nothing is saved to
# GitHub's cache (each save cost ~18 min of upload). checkout cleans the
# workspace, so cargo builds into a persistent CARGO_TARGET_DIR under
# ~/.cache/lightbulb-desktop, and pnpm uses its default store
# (~/Library/pnpm/store), both on local disk. Every network step (tauri-action,
# notarytool, stapler, gh release) gets three tries.

# Disk budget (.github/scripts/mac-runner-disk.sh): this Mac hit 0 bytes mid-link twice
# (ENOSPC in `ld`) with a 16 GB Rust cache plus ~6 GB of _work. Every Mac job (here and in
# mobile-release.yml) starts with a pre-flight (under 10 GB free: prune; still under 6 GB: fail
# with a clear message) and ends with an `if: always()` prune: the Rust target dirs lose
# incremental/ and bundle/ and are wiped if still over budget (prod 6 GB, test 4 GB), and the
# workspace's node_modules, vendored sidecars, .next/.expo and RUNNER_TEMP dmg/ipa leftovers go.
# The pnpm store stays. It only touches ~/.cache/lightbulb-desktop, $GITHUB_WORKSPACE and
# $RUNNER_TEMP.
#
name: desktop-build
'on':
  pull_request:
    paths:
    - apps/desktop/**
    # The app compiles in the Claude plugin's files (local_sessions/plugin.rs, enrollment.rs).
    - packages/claude-plugin/**
  workflow_dispatch:
    inputs:
      hosted_runner:
        description: Use GitHub-hosted macOS when the signing Mac is unavailable
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: desktop-build
  cancel-in-progress: false
  # A pending run is otherwise evicted by the next arrival (a queued prod dispatch lost to a
  # push build, 2026-09-28); queue them FIFO, as deploy.yml does.
  queue: max
env:
  # Existing App Store Connect key used by the iOS release; IDs are public metadata.
  APPLE_API_KEY: SZ68D5WBR2
  APPLE_API_ISSUER: 7c5f3df2-6cda-46fb-b3d5-2ebbceb1dd0e
jobs:
  # The Rust unit tests ran nowhere in CI. Not a required check: the self-hosted
  # runner can be offline, and a check nobody can turn green blocks every PR.
  test-desktop:
    name: TestDesktop
    if: github.event_name == 'pull_request' || inputs.hosted_runner == true
    # Pull-request code runs on the persistent signing Mac; drop the workflow's
    # `contents: write` token, which only the build/publish jobs need.
    permissions:
      contents: read
    runs-on: ${{ fromJSON(inputs.hosted_runner == true && '["macos-15"]' || '["self-hosted","macos-desktop"]') }}
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Disk pre-flight
      run: bash .github/scripts/mac-runner-disk.sh preflight
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
    # Its own dir: pull-request code never writes into the signed builds' target dir.
    - name: Use the persistent Rust target dir
      run: |-
        DIR="$HOME/.cache/lightbulb-desktop/target-test"
        echo "CARGO_TARGET_DIR=$DIR" >> "$GITHUB_ENV"
    # TAURI_CONFIG stubs the sidecar bundle so tauri-build does not demand binaries
    # that only the signed build jobs vendor.
    - name: Cargo test (lib)
      run: TAURI_CONFIG='{"bundle":{"externalBin":[],"resources":[]}}' cargo test --manifest-path
        apps/desktop/src-tauri/Cargo.toml --lib
    # The holder and the `lightbulb` command end to end: real binary, real pty.
    - name: Cargo test (held sessions)
      run: TAURI_CONFIG='{"bundle":{"externalBin":[],"resources":[]}}' cargo test --manifest-path
        apps/desktop/src-tauri/Cargo.toml --test cli
    # The holder lives in lightbulb-core; its macOS-only tests run here, not on Linux.
    - name: Cargo test (lightbulb-core)
      run: cargo test --manifest-path apps/desktop/Cargo.toml -p lightbulb-core
    # Run separately and unfiltered: a shared name filter matches none of the example's tests.
    - name: Cargo test (probe example)
      run: TAURI_CONFIG='{"bundle":{"externalBin":[],"resources":[]}}' cargo test --manifest-path
        apps/desktop/src-tauri/Cargo.toml --example local_session_probe
    - name: Prune runner disk
      if: always()
      run: bash .github/scripts/mac-runner-disk.sh prune
  build-desktop-prod:
    name: BuildDesktopProd
    needs: test-desktop
    if: always() && github.event_name == 'workflow_dispatch' && (needs.test-desktop.result == 'success' || needs.test-desktop.result == 'skipped')
    runs-on: ${{ fromJSON(inputs.hosted_runner == true && '["macos-15"]' || '["self-hosted","macos-desktop"]') }}
    timeout-minutes: 150
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Disk pre-flight
      run: bash .github/scripts/mac-runner-disk.sh preflight
    - name: Setup pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      with:
        dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
    # No `cache: pnpm`: pnpm's default store (~/Library/pnpm/store) already lives on this Mac.
    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      with:
        targets: aarch64-apple-darwin
    - name: Use the persistent Rust target dir
      run: |-
        DIR="$HOME/.cache/lightbulb-desktop/target"
        echo "CARGO_TARGET_DIR=$DIR" >> "$GITHUB_ENV"
    - name: Install dependencies
      run: pnpm install
    # tauri.conf.json and capabilities/default.json ARE the prod flavor (dev is the
    # tauri.dev.conf.json overlay + capabilities/dev.json, opt-in), so only the version and
    # targets are patched here.
    - name: Patch tauri.conf.json for prod
      run: |-
        TAURI_CFG=apps/desktop/src-tauri/tauri.conf.json
        jq --arg version "0.4.${{ github.run_number }}" '
          .version = $version |
          .bundle.targets = ["app"]
        ' "$TAURI_CFG" > "$TAURI_CFG.new"
        mv "$TAURI_CFG.new" "$TAURI_CFG"
        echo "Patched tauri.conf.json:"
        jq '{version, devUrl: .build.devUrl, frontendDist: .build.frontendDist, windowUrl: .app.windows[0].url, signingIdentity: .bundle.macOS.signingIdentity, updaterEndpoints: .plugins.updater.endpoints, capabilities: .app.security.capabilities}' "$TAURI_CFG"
    # The hosted page can call every local command its origin is granted. Refuse to build
    # a prod app that loads, or grants IPC to, anything but the prod origin.
    - name: Check the prod build is prod-only
      run: |-
        set -euo pipefail
        D=apps/desktop/src-tauri
        jq -e '.app.security.capabilities == ["default"]' "$D/tauri.conf.json"
        jq -e '.remote.urls == ["https://thelightbulb.company/*"]' "$D/capabilities/default.json"
        jq -e '[.build.devUrl, .build.frontendDist, .app.windows[].url, .plugins.updater.endpoints[]]
          | all(startswith("https://thelightbulb.company/"))' "$D/tauri.conf.json"
    - name: Vendor browser sidecar (aarch64-apple-darwin)
      run: bash apps/desktop/src-tauri/scripts/vendor-sidecars.sh aarch64-apple-darwin
    - name: Set up signing keychain
      run: |-
        set -euo pipefail
        KEYCHAIN_PATH="$RUNNER_TEMP/lightbulb-build.keychain-db"
        KEYCHAIN_PASSWORD="$(uuidgen)"
        CERT_PATH="$RUNNER_TEMP/cert.p12"

        echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"
        # Self-hosted runner: $RUNNER_TEMP survives a mid-job runner crash, so a
        # stale keychain can linger and make create-keychain fail. Pre-delete it.
        security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        # No -l: the runner is a laptop, and a lid close mid-build would lock this
        # keychain and fail codesign with errSecInternalComponent.
        security set-keychain-settings -ut 21600 "$KEYCHAIN_PATH"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" \
          -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
        security list-keychain -d user -s "$KEYCHAIN_PATH" \
          $(security list-keychain -d user | tr -d '" \t')
        security set-key-partition-list -S apple-tool:,apple:,codesign: \
          -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
        rm -f "$CERT_PATH"

        echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
        echo "Identity in keychain:"
        security find-identity -v -p codesigning "$KEYCHAIN_PATH"
      env:
        APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
    - name: Prepare notarization API key
      run: |-
        set -euo pipefail
        KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
        rm -f "$KEY_PATH"
        umask 077
        printf '%s' "$EXPO_ASC_API_KEY_BASE64" | base64 --decode > "$KEY_PATH"
        echo "APPLE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
      env:
        EXPO_ASC_API_KEY_BASE64: ${{ secrets.EXPO_ASC_API_KEY_BASE64 }}
    - name: Pre-sign embedded native modules
      run: |-
        set -euo pipefail
        export SIGN_ID="Developer ID Application: Prasiddha Parthsarthy (WZX4U3C22Y)"
        export NODE_ENTITLEMENTS="$PWD/apps/desktop/src-tauri/entitlements-node.plist"
        BIN_ROOT="apps/desktop/src-tauri/bin"

        CANDIDATES=$(mktemp)
        MACHO_LIST=$(mktemp)
        find "$BIN_ROOT" \( \
          -name '*.node' -o \
          -name '*.dylib' -o \
          -name '*.so' -o \
          -name 'spawn-helper' -o \
          -name 'node-*-apple-darwin' -o \
          -name 'lightbulb' \
        \) -type f -print0 > "$CANDIDATES"
        while IFS= read -r -d '' f; do
          if file -b "$f" | grep -q "Mach-O"; then
            printf '%s\0' "$f" >> "$MACHO_LIST"
          fi
        done < "$CANDIDATES"
        rm -f "$CANDIDATES"
        MACHO_COUNT=$(tr -dc '\0' < "$MACHO_LIST" | wc -c | tr -d ' ')
        echo "Found $MACHO_COUNT Mach-O binaries to sign under $BIN_ROOT."

        SIGN_SCRIPT="$RUNNER_TEMP/sign-one.sh"
        cat > "$SIGN_SCRIPT" <<'WORKER'
        #!/usr/bin/env bash
        set -euo pipefail
        f="$1"
        ENT_ARGS=()
        case "$(basename "$f")" in
          node-*-apple-darwin)
            ENT_ARGS=(--entitlements "$NODE_ENTITLEMENTS")
            ;;
        esac
        codesign --force --options runtime --timestamp \
          ${ENT_ARGS[@]+"${ENT_ARGS[@]}"} \
          --sign "$SIGN_ID" --keychain "$KEYCHAIN_PATH" "$f"
        WORKER
        chmod +x "$SIGN_SCRIPT"

        xargs -0 -P 8 -n 1 "$SIGN_SCRIPT" < "$MACHO_LIST"
        rm -f "$MACHO_LIST" "$SIGN_SCRIPT"
    # Three tries: the notarization upload inside `tauri build` and the asset uploads die on
    # this Mac's uplink. A retry finds the draft release by tag, deletes and re-uploads any
    # asset already there, and merges latest.json (tauri-action v0.6.2 source). Only a failed
    # third try fails the job.
    - name: Build desktop app (aarch64-apple-darwin)
      id: build1
      continue-on-error: true
      uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
      with:
        projectPath: apps/desktop
        tagName: desktop-v0.4.${{ github.run_number }}
        releaseName: Lightbulb Desktop v0.4.${{ github.run_number }}
        releaseDraft: true
        prerelease: false
        args: --target aarch64-apple-darwin
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        LIGHTBULB_CALLBACK_URL: https://thelightbulb.company/auth/desktop-callback
        # PROD, explicitly. These match lib.rs's compile-time defaults (prod since the
        # open-source release); set here so a default change can never silently
        # point the shipped app's pairing half somewhere else.
        LIGHTBULB_API_BASE: https://api.thelightbulb.company
        LIGHTBULB_WS_URL: wss://bv.thelightbulb.company/api/v1/gateway/ws
    - name: Build desktop app (aarch64-apple-darwin, try 2)
      id: build2
      if: steps.build1.outcome == 'failure'
      continue-on-error: true
      uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
      with:
        projectPath: apps/desktop
        tagName: desktop-v0.4.${{ github.run_number }}
        releaseName: Lightbulb Desktop v0.4.${{ github.run_number }}
        releaseDraft: true
        prerelease: false
        args: --target aarch64-apple-darwin
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        LIGHTBULB_CALLBACK_URL: https://thelightbulb.company/auth/desktop-callback
        # PROD, explicitly. These match lib.rs's compile-time defaults (prod since the
        # open-source release); set here so a default change can never silently
        # point the shipped app's pairing half somewhere else.
        LIGHTBULB_API_BASE: https://api.thelightbulb.company
        LIGHTBULB_WS_URL: wss://bv.thelightbulb.company/api/v1/gateway/ws
    - name: Build desktop app (aarch64-apple-darwin, try 3)
      if: steps.build2.outcome == 'failure'
      uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
      with:
        projectPath: apps/desktop
        tagName: desktop-v0.4.${{ github.run_number }}
        releaseName: Lightbulb Desktop v0.4.${{ github.run_number }}
        releaseDraft: true
        prerelease: false
        args: --target aarch64-apple-darwin
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        LIGHTBULB_CALLBACK_URL: https://thelightbulb.company/auth/desktop-callback
        # PROD, explicitly. These match lib.rs's compile-time defaults (prod since the
        # open-source release); set here so a default change can never silently
        # point the shipped app's pairing half somewhere else.
        LIGHTBULB_API_BASE: https://api.thelightbulb.company
        LIGHTBULB_WS_URL: wss://bv.thelightbulb.company/api/v1/gateway/ws
    - name: Build, sign + notarize DMG (headless)
      run: |-
        set -euo pipefail
        APP="$CARGO_TARGET_DIR/aarch64-apple-darwin/release/bundle/macos/Lightbulb.app"
        SIGN_ID="Developer ID Application: Prasiddha Parthsarthy (WZX4U3C22Y)"
        codesign --verify --deep --strict --verbose=2 "$APP"
        VERSION="0.4.${{ github.run_number }}"
        DMG="Lightbulb_${VERSION}_aarch64.dmg"
        TAG="desktop-v${VERSION}"
        if [ "$HOSTED_RUNNER" = true ]; then
          # Apple's folder-to-image method on hosted Macs. Avoid the explicit
          # scratch-volume detach that timed out twice on macos-15.
          # https://developer.apple.com/documentation/xcode/packaging-mac-software-for-distribution
          STAGING="$RUNNER_TEMP/lightbulb-dmg-source"
          mkdir -p "$STAGING"
          ditto "$APP" "$STAGING/Lightbulb.app"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create -srcfolder "$STAGING" -volname Lightbulb -format UDZO -ov "$DMG"
        else
        # Build the DMG by mounting a scratch image under $RUNNER_TEMP, NOT under
        # /Volumes. Tauri's bundle_dmg.sh (and a plain `hdiutil create -srcfolder`)
        # mount at /Volumes/<name>, which a self-hosted runner can't write to
        # without Full Disk Access. Mounting at an explicit path under $RUNNER_TEMP
        # sidesteps that TCC wall. ditto (not makehybrid) is required because a
        # shell-script binary's code signature lives in extended attributes, which
        # makehybrid drops -> notarization rejects the DMG as "not signed".
        RW="$RUNNER_TEMP/lightbulb_rw.dmg"
        MNT="$RUNNER_TEMP/lightbulb_dmgmnt"
        rm -f "$RW" "$DMG"; rm -rf "$MNT"; mkdir -p "$MNT"
        SIZE_MB=$(( $(du -sm "$APP" | cut -f1) + 200 ))
        hdiutil create -size "${SIZE_MB}m" -fs HFS+ -volname "Lightbulb" "$RW"
        hdiutil attach "$RW" -nobrowse -mountpoint "$MNT"
        ditto "$APP" "$MNT/Lightbulb.app"
        ln -s /Applications "$MNT/Applications"
        hdiutil detach "$MNT" -force
        hdiutil convert "$RW" -format UDZO -o "$DMG"
        rm -f "$RW"; rm -rf "$MNT"
        fi
        # Sign, notarize, staple the DMG (the .app inside is already notarized+stapled).
        codesign --force --timestamp --keychain "$KEYCHAIN_PATH" --sign "$SIGN_ID" "$DMG"
        # The Mac's uplink drops long uploads; retry each network call, 3 attempts.
        retry() { for i in 1 2 3; do "$@" && return 0; [ "$i" = 3 ] && return 1; echo "Attempt $i failed; retrying"; sleep $((i * 10)); done; }
        retry xcrun notarytool submit "$DMG" --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait
        retry xcrun stapler staple "$DMG"
        # Upload to the release tauri-action created (still a draft at this point).
        retry gh release upload "$TAG" "$DMG" --repo TheLightbulbCompany/lightbulb --clobber
        echo "Published $DMG to $TAG"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        HOSTED_RUNNER: ${{ inputs.hosted_runner }}
    - name: Publish draft release
      run: |-
        for i in 1 2 3; do
          gh release edit "desktop-v0.4.${{ github.run_number }}" --repo TheLightbulbCompany/lightbulb --draft=false && exit 0
          [ "$i" = 3 ] && exit 1
          echo "Attempt $i failed; retrying"; sleep $((i * 10))
        done
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    # `brew install --cask thelightbulbcompany/tap/lightbulb`: write this release's version and
    # the archive's sha256 (GitHub's own asset digest, so the bytes that were uploaded) into the
    # tap. The cask's source is packaging/homebrew-tap/Casks/lightbulb.rb. The tap is pushed with
    # a deploy key (write access to TheLightbulbCompany/homebrew-tap only); skipped while
    # HOMEBREW_TAP_DEPLOY_KEY is unset.
    - name: Bump the Homebrew tap
      run: |-
        set -euo pipefail
        if [ -z "${HOMEBREW_TAP_DEPLOY_KEY:-}" ]; then
          echo "::notice::HOMEBREW_TAP_DEPLOY_KEY is not set; skipping the Homebrew tap bump."
          exit 0
        fi
        VERSION="0.4.${{ github.run_number }}"
        SHA=$(gh api "repos/TheLightbulbCompany/lightbulb/releases/tags/desktop-v${VERSION}" \
          --jq '.assets[] | select(.name | endswith("_aarch64.app.tar.gz")) | .digest' | sed 's/^sha256://')
        echo "$SHA" | grep -Eqx '[0-9a-f]{64}'
        TAP="$RUNNER_TEMP/homebrew-tap"
        KEY="$RUNNER_TEMP/homebrew-tap-key"
        rm -rf "$TAP"
        # This Mac is persistent and runs pull-request code: the key lives in RUNNER_TEMP for this
        # step only (removed by the cleanup step below, whatever happens), never in ~/.ssh.
        ( umask 077; printf '%s\n' "$HOMEBREW_TAP_DEPLOY_KEY" > "$KEY" )
        export GIT_SSH_COMMAND="ssh -i $KEY -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=$RUNNER_TEMP/homebrew-tap-known-hosts"
        git clone --depth 1 git@github.com:TheLightbulbCompany/homebrew-tap.git "$TAP"
        mkdir -p "$TAP/Casks"
        sed -e "s/^  version \".*\"/  version \"${VERSION}\"/" -e "s/^  sha256 \".*\"/  sha256 \"${SHA}\"/" \
          packaging/homebrew-tap/Casks/lightbulb.rb > "$TAP/Casks/lightbulb.rb"
        cd "$TAP"
        git add Casks/lightbulb.rb
        git diff --cached --quiet && { echo "Tap already at $VERSION"; exit 0; }
        git -c user.name="lightbulb-release" -c user.email="hello@thelightbulb.company" commit -m "lightbulb ${VERSION}"
        for i in 1 2 3; do git push origin HEAD && exit 0; [ "$i" = 3 ] && exit 1; sleep $((i * 10)); done
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
    # Persistent runner: never leave the Apple signing key on disk between runs.
    - name: Clean up signing keychain
      if: always()
      run: |-
        rm -f "$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
        rm -rf "$RUNNER_TEMP/homebrew-tap" "$RUNNER_TEMP/homebrew-tap-key" "$RUNNER_TEMP/homebrew-tap-known-hosts"
        security delete-keychain "$RUNNER_TEMP/lightbulb-build.keychain-db" || true
    - name: Prune runner disk
      if: always()
      run: bash .github/scripts/mac-runner-disk.sh prune
