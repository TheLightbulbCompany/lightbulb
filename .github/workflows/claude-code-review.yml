name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    runs-on: ${{ vars.CI_RUNNER }}
    permissions:
      contents: read
      # write (was read) so the review can actually post inline comments +
      # a summary. The previous config could not post even if it had run.
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # full history (was depth 1) so the PR's merge-base resolves for the diff
          fetch-depth: 0

      - name: Run Claude Code Review
        id: claude_review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Direct review prompt instead of the `/code-review` plugin: the plugin
          # crashed on turn 1 with "Internal error: directory mismatch for
          # tsconfig.json" on every PR (monorepo with many tsconfig.json files),
          # spent $0, reviewed nothing, and the step still reported success —
          # a green check that never looked at a line of the diff.
          prompt: |
            You are reviewing pull request #${{ github.event.pull_request.number }}
            of ${{ github.repository }} as a rigorous senior reviewer.

            Review the changes in this pull request — the diff is provided to you;
            open the changed files for surrounding context as needed. Then WRITE
            your review as your response — it is posted automatically as the PR
            comment. Do NOT use any tool to post a comment yourself.

            Review for, in priority order:
            - Correctness: data-shape mismatches (a component reading fields the
              BFF/API or TS types do not actually provide, so it renders
              `undefined`), unguarded array access, missing null/error handling,
              and broken request/response contracts (e.g. a request body whose
              keys the server's schema silently strips).
            - Theme discipline: this app uses a cream/forest editorial theme on
              CSS variables (`--cream --ink --ink-soft --mute --edge --forest
              --danger --warn`). Flag raw hex / `rgba()` literals, shadcn semantic
              classes (`text-muted-foreground`, `bg-accent`, `bg-primary`,
              `border-border`), and ESPECIALLY raw shadcn `Dialog`/`DialogContent`
              used without theme overrides — its default is `bg-black`/white text,
              i.e. a black modal on a cream surface.
            - Missing states: data surfaces lacking loading / empty / error states.
            - Security and obvious performance problems.

            Be concrete: every finding cites `file:line` and the specific fix. If
            there are genuinely no issues, say so in one line — never stay silent.
          # POST the review as the PR comment. The action only creates the comment
          # (and wires CLAUDE_COMMENT_ID so posting works) when it is NOT in
          # prompt-only "agent mode" — i.e. track_progress MUST be true. With the
          # default track_progress:false + a prompt, the review runs but is never
          # posted (claude-code-action issue #1108) — which is why earlier runs
          # reviewed cleanly yet left zero comments on the PR.
          track_progress: true
          use_sticky_comment: true
          # Do NOT set `claude_args: --allowedTools ...` here: that REPLACES the
          # action's default tool set, which would drop the built-in
          # comment-posting tool that track_progress relies on — and the agent
          # gets the diff from track_progress mode, so it needs no extra tools.

      # Fail-loud guard: the action reports `success` even when the agent
      # crashes on turn 1 (is_error=true, $0 spent, nothing reviewed) — a green
      # check that never read the diff. Read the execution output and fail the
      # job when the review did not actually complete, so a broken reviewer is
      # visibly red instead of silently passing.
      - name: Verify the review actually ran
        if: always()
        env:
          REVIEW_OUTCOME: ${{ steps.claude_review.outcome }}
          EXECUTION_FILE: ${{ steps.claude_review.outputs.execution_file }}
        run: |
          set -uo pipefail
          # A genuine step failure is a hard fail.
          if [ "${REVIEW_OUTCOME}" != "success" ]; then
            echo "::error::Claude review step outcome was '${REVIEW_OUTCOME}', not success."
            exit 1
          fi
          # The action does not always set execution_file: on a PR that edits
          # this workflow it skips entirely (it requires the file to match the
          # default branch — "works once you merge"), and on some clean runs the
          # output is hidden for security. Treat a missing file as a WARNING, not
          # a red check — failing here would false-red those PRs. The hard signal
          # below is the one the action emits reliably when the agent crashes.
          if [ -z "${EXECUTION_FILE:-}" ] || [ ! -f "${EXECUTION_FILE}" ]; then
            echo "::warning::Claude review produced no execution output file — could not confirm a completed review (the action skips PRs that edit this workflow until merged, and hides output on some runs). If reviews seem dead on normal PRs, check the run duration (a real review takes minutes) and the CLAUDE_CODE_OAUTH_TOKEN secret."
            exit 0
          fi
          # Whitespace-strip so the key match is tolerant of pretty-printing.
          compact="$(tr -d ' \n\t\r' < "${EXECUTION_FILE}")"
          if printf '%s' "$compact" | grep -q '"is_error":true'; then
            echo "::error::Claude review ended with is_error=true — it crashed before reviewing the diff (the action still reports the step 'success'). Most likely an expired CLAUDE_CODE_OAUTH_TOKEN secret or a Claude usage cap. Rotate the token (claude setup-token → gh secret set CLAUDE_CODE_OAUTH_TOKEN) and re-run."
            exit 1
          fi
          echo "Claude review completed without error."
