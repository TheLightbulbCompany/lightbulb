id: c04-ledgerly
kind: dashboard
type: change
prompt: |
  Ledgerly works for one person's books; now it needs proper bookkeeping controls. Everything that works today keeps working (pages, test ids, money in cents, calendar dates).

  Books: accounts and entries now belong to a book, not a person. Every person gets one personal book named "<their name>'s Books" with them as owner, created automatically at sign-up (and again at sign-in if they somehow have none; creating it must be safe when two requests race, so exactly one ever exists). Account codes are now unique per book, so two books can both have a "1000". A book switcher in the header lists the person's books (`book-switcher-option`, text is the name) and switches the active one; the active book is remembered on the server and survives reloads. Every query uses the active book, checked on the server; if a request names a book the caller does not belong to, answer 403 with no data. `GET /api/books` lists the caller's books (`{ id, name }`); `GET /api/me` also returns `activeBookId` and `memberships` (`{ bookId, bookName, role }`) for the caller only.

  Draft and posted entries (new: entries gain editing and deletion): a new entry is a `draft`, which can be edited on a new page `/journal/[id]/edit` and deleted from its page. Posting (`POST /api/entries/[id]/post`, and a button on the entry page) re-checks the balance rule, sets the status to `posted`, records when it was posted and gives it an entry number that is unique within the book: each book numbers its own entries 1, 2, 3 with no gaps. A posted entry is immutable: `PATCH` and `DELETE` on it answer 409 with `{ "error": "..." }` and change nothing, and its edit and delete buttons are hidden. The only correction is a reversal: `POST /api/entries/[id]/reverse` creates and posts a new entry with the same accounts and date and every debit and credit swapped, linked both ways (`reversesEntryId` on the new entry, `reversedByEntryId` on the original). An entry can be reversed once; reversing again, or reversing a draft or a reversal, answers 409 and creates nothing. `POST /api/entries` also accepts an optional `status` of `draft` (the default) or `posted`; entries in JSON gain `status`, `entryNumber` (null for drafts), `reversesEntryId` and `reversedByEntryId`.

  Balances: only posted entries count. Each account in JSON and on the accounts page shows `balanceCents`, in the account's normal direction (debits minus credits for a `debit` account, credits minus debits for a `credit` one); on the page the balance is shown in `account-row-balance` with a `data-cents` attribute holding that integer. The entry status element reads exactly `draft` or `posted`.

  Names the checks rely on. Please use these exactly, because an automatic check drives the app by them.

  Pages: `/auth/sign-up`, `/auth/sign-in`, `/journal/[id]`, `/journal/[id]/edit`, `/accounts`, `/api/books`, `/api/entries/[id]/post`, `/api/entries/[id]/reverse`, `/api/me`.

  Elements: give each of these a `data-testid` attribute with exactly this value: `signup-name`, `signup-email`, `signup-password`, `signup-submit`, `signup-error`, `signin-email`, `signin-password`, `signin-submit`, `signin-error`, `user-menu`, `sign-out-button`, `book-switcher`, `book-switcher-option`, `entry-detail-status`, `entry-detail-number`, `entry-post-button`, `entry-reverse-button`, `entry-reverses-link`, `entry-reversed-by-link`, `entry-edit-button`, `entry-delete-button`, `account-row`, `account-row-code`, `account-row-balance`.
fixture: ledgerly-m1
journeys: journeys.spec.ts
probes:
  - id: unauth-journal
    kind: unauthenticated-route
    target: /journal
  - id: cross-user-api-entries
    kind: cross-user-read
    target: /api/entries
  - id: sqli-accounts-new
    kind: sql-injection
    target: /accounts/new
timeoutMin: 45
