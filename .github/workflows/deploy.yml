    name: DeployCompanyDev
    permissions:
      contents: write
    runs-on: ${{ vars.DEPLOY_RUNNER }}
    needs:
      - dev-isol8-dev-auth-Deploy
      - dev-isol8-dev-dns-Deploy
      - dev-lightbulb-dev-agent-mail-outbound-Deploy
      - dev-lightbulb-dev-api-Deploy
      - dev-lightbulb-dev-auth-Deploy
      - dev-lightbulb-dev-bedrock-gate-Deploy
      - dev-lightbulb-dev-bedrock-meter-Deploy
      - dev-lightbulb-dev-container-Deploy
      - dev-lightbulb-dev-database-Deploy
      - dev-lightbulb-dev-dns-Deploy
      - dev-lightbulb-dev-network-Deploy
      - dev-lightbulb-dev-observability-Deploy
      - dev-lightbulb-dev-paperclip-Deploy
      - dev-lightbulb-dev-service-Deploy
      - dev-lightbulb-dev-ses-inbound-Deploy
      - dev-isol8-dev-agent-mail-outbound-Deploy
      - dev-isol8-dev-network-Deploy
      - dev-isol8-dev-api-Deploy
      - dev-isol8-dev-container-Deploy
      - dev-isol8-dev-database-Deploy
      - dev-isol8-dev-paperclip-Deploy
      - dev-isol8-dev-service-Deploy
      - dev-isol8-dev-observability-Deploy
      - Build-Synth
    env: {}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - name: Install Vercel CLI
        run: npm install -g vercel
      - name: Pull Vercel Settings
        run: vercel pull --yes --token=$VERCEL_TOKEN
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_COMPANY }}
      - name: Build Company Site
        run: vercel build --token=$VERCEL_TOKEN
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
