# Litestream config for the local-sqlite container layout.
#
# $LITESTREAM_S3_BUCKET comes from the task definition; $OWNER_ID and
# $ISOL8_STATE_ROOT are exported
# by isol8-local-sqlite-boot.sh (per-user env, facts-file fallback) — litestream's
# config parser env-expands both at load time. There is NO top-level replica
# key in litestream's schema (and its YAML parsing is non-strict — an
# unrecognized key would be silently ignored), so every entry carries its own
# replica block explicitly.
#
# The dir-form entry replicates the dynamic per-agent DB set: watch (fsnotify,
# recursive) registers DBs created mid-run — a marketplace hire's fresh
# openclaw-agent.sqlite starts replicating within the debounce window, no
# restart needed. Its replica path derives as
#   $OWNER_ID/agents/<relative-path-under-dir>
# which matches the boot script's restore enumeration exactly.
#
# Metrics (+ /debug/pprof, same mux) stay loopback-only.
addr: "127.0.0.1:9090"

#
# openclaw-quarantine.sqlite is DELIBERATELY NOT LISTED. Upstream hardcodes that
# database to `PRAGMA journal_mode = DELETE` (openclaw-quarantine-store.ts) --
# it records corrupted databases, so it must not depend on WAL's -shm sidecar.
# Litestream replicates by shipping WAL frames and cannot replicate a
# rollback-journal database at all. Listing it did not half-work; it never
# worked: across the whole prod fleet the quarantine replica prefix holds ZERO
# objects, while the state DB beside it holds thousands. What the entry DID do
# was make every compaction monitor (levels 1/2/3/9) block on a database that
# never initialises, each burning a 30s timeout, on every container, forever.
# If quarantine state ever needs to survive task replacement it needs a
# different transport -- not this one.
dbs:
  - path: $ISOL8_STATE_ROOT/state/openclaw.sqlite
    replica:
      type: s3
      bucket: $LITESTREAM_S3_BUCKET
      path: $OWNER_ID/state/openclaw.sqlite
      region: us-east-1
  - dir: $ISOL8_STATE_ROOT/agents
    pattern: "openclaw-agent.sqlite"
    recursive: true
    watch: true
    replica:
      type: s3
      bucket: $LITESTREAM_S3_BUCKET
      path: $OWNER_ID/agents
      region: us-east-1
