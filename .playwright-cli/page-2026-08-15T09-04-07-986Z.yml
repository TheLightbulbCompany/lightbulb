                  - heading [level=3]: Re-apply standard sizing
                  - paragraph: Forces the ECS service to roll its task definition back to the owner's plan-sized profile (standard 1 vCPU / 4 GB; Ultra Pro 2 vCPU / 8 GB). Use as a recovery action when a container is wedged on a stale task def.
                  - button: Re-apply sizing
                - generic:
                  - heading [level=3]: Regenerate config
                  - paragraph:
                    - text: "Re-renders openclaw.json from the current config generator via the provisioning write path — clears stale keys a deep-merge patch would preserve — then restores the runtime-appended subtrees the regen drops (channel pairings, route bindings, identity). Config-only: no restart, EFS workspace/agent state untouched. Pair with"
                    - strong: Apply now
                    - text: below when the change needs a gateway restart to activate (e.g. plugin enablement).
                  - button: Regenerate config
                - generic:
                  - heading [level=3]: Queue image update
                  - paragraph:
                    - strong: Queue
                    - text: creates a pending Track 2 update — the owner sees a banner in chat and chooses when to apply (Update now / Tonight / Remind later); the container keeps running on the current image until they accept.
                    - strong: Apply now
                    - text: force-rolls the container onto the selected image immediately (no banner wait). Both reuse the container's existing on-disk config and preserve EFS workspace/agent state — Apply now briefly restarts the container.
