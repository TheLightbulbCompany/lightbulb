# Web-search backend key (not an MCP, not a CLI). The owner pastes a Parallel key once.
# Under Hermes the openclaw_paths entries below are NOT written anywhere: apply_connection's
# HERMES_OPENCLAW_PATHS_PROVIDERS maps parallel to PARALLEL_API_KEY in each profile's .env plus
# `web.backend: parallel` in config.yaml (Hermes tools/web_tools.py reads both). The paths stay
# only because the wiring invariant needs exactly one rail set.
parallel:
  display_name: Parallel (Web Search)
  acquisition: paste_token
  actor: skill
  refresh_owner: none
  token_setup_url: "https://platform.parallel.ai/settings/api-keys"
  # Parallel documents no authenticated GET, so the check is one minimal real search
  # (1 query, 1 result; ~$0.005 per connect). A bad key answers 401 (verified 2026-09-23).
  validate:
    method: POST
    url: "https://api.parallel.ai/v1/search"
    auth_header: x-api-key
    auth_scheme: ""
    body: { search_queries: ["lightbulb connection check"], advanced_settings: { max_results: 1 } }
  wiring:
    openclaw_paths:
      - { path: "tools.web.search.provider", source: "literal:parallel-free" }
      - { path: "tools.web.search.parallel.apiKey", source: "input.token" }

posthog:
  display_name: PostHog
  acquisition: direct_oauth
  actor: mcp
  refresh_owner: actor
  brokered_environments: [dev, prod]
  # Backend keeps a copy of the token in Secrets Manager for its own HogQL
  # reads (owner-day visitor rollups). The container's MCP copy is unaffected.
  retain_secret: true
  oauth:
    authorization_url: "https://oauth.posthog.com/oauth/authorize/"
    token_url: "https://oauth.posthog.com/oauth/token/"
    registration_url: "https://oauth.posthog.com/oauth/register/"
    # Full PostHog OAuth scope set: openid + every read and write scope the hosted
    # MCP exposes, so all of its tools work and we never re-mint to cover a missing
    # one. The MCP gates each tool's scope dynamically at call time, and its startup
    # identity probe (GET /api/users/@me/) requires user:read — a narrower list 403s.
    # Sourced verbatim from the authorize server's published scopes_supported
    # (oauth.posthog.com/.well-known/oauth-authorization-server); a single scope
    # the server no longer recognizes fails the WHOLE authorize with
    # invalid_scope (bit us 2026-08 when PostHog dropped the agents:* scopes).
    # Re-sync: curl -s https://oauth.posthog.com/.well-known/oauth-authorization-server | jq -r '.scopes_supported[]' | sort
    scopes:
