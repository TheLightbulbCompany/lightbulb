                                                      - generic: Daily company control
                                                    - generic:
                                                      - generic:
                                                        - heading [level=1]: Daily company control
                                                        - paragraph: "Outcome: Advance the single current company constraint. Variables: GTM_GOAL_ID; MONTHLY_SPEND_CAP_USD=2000. Inputs: active goal and projects; authorized decision queues and triage; open work; latest Gauge, Tally, and Vera artifacts; failures; unresolved child work. Search company first. Choose one executable priority, set issue priority and status, assign at most one bounded todo child with this run as parent, close stale duplicates, and cite why-now evidence. Reversible within-policy work proceeds autonomously. Authority edge only: legal commitment, new spend, pricing or terms change, founder-positioning choice, or two genuinely conflicting top constraints. Create a decision with ruleKey=company-control.authority-edge. Work product: URL of the priority issue advanced plus its cited source artifact. Named null outcome: no-executable-priority, with blocker and owner. KPI proof: signup_started -> chat_completed, paying customers, known spend and headroom, and customer exceptions. Stop after one constraint advanced or one authority decision. Never execute specialist implementation work. Cite source queries and observation times; let a genuine source failure fail."
