name: build-openclaw-image

# One image build at a time. Never cancel: each build publishes a distinct
# tag that a promotion may already point at, so a superseded run must still
# finish. (This group was added when builds shared one self-hosted VM and
# raced it into buildkit OOM; on hosted runners each build gets its own VM,
# but the no-cancel tag guarantee stands on its own.)
concurrency:
  group: build-openclaw-image
  cancel-in-progress: false

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-openclaw-image.yml"
      - "apps/infra/openclaw/Dockerfile"
      # The Dockerfile bakes apps/infra/openclaw/skills/** into the image, so a
      # change to the bundled skill (e.g. SKILL.md, a reference, or a helper
      # script) must rebuild + republish — otherwise promoted tags keep shipping
      # stale skill content.
      - "apps/infra/openclaw/skills/**"
      # Same staleness class: Chrome extensions are baked as pre-packed .crx +
      # external-install JSON (see chrome-extensions/README.md), so an
      # extension-only change must rebuild + republish too.
      - "apps/infra/openclaw/chrome-extensions/**"
      # Same staleness class: the Dockerfile bakes the local-sqlite boot chain
      # (isol8-local-sqlite-boot.sh / isol8-local-sqlite-app.sh / isol8-litestream.yml).
      - "apps/infra/openclaw/local-sqlite/**"
      # The Dockerfile also bakes apps/infra/openclaw/plugins/** (the in-repo
      # aws-exec-profile plugin) into /app/dist/extensions, so a change there
      # must rebuild + republish too.
      - "apps/infra/openclaw/plugins/**"
      # Fleet-wide Gen Sage policy (~/.sage/config.json) is baked by Layer 13c;
      # tuning it (sensitivity, disabled_threats) only ships via a rebuild.
      - "apps/infra/openclaw/sage/**"
      # Same staleness class: Layer 9c bakes the WARP browser-egress boot
      # script, which container-stack.ts invokes by absolute path.
      - "apps/infra/openclaw/warp/**"
      - "apps/backend/core/containers/config.py"
      - "apps/backend/tests/chaos/invariants/test_config_schema.py"
      - "openclaw-version.json"
      - "scripts/openclaw-image-proof*.mjs"
  # The boot chain can destroy an owner's data, so its smoke suite must gate
  # the image rather than run after it ships. Same paths as the push trigger.
  pull_request:
    paths:
      - ".github/workflows/build-openclaw-image.yml"
      - "apps/infra/openclaw/Dockerfile"
      - "apps/infra/openclaw/local-sqlite/**"
      - "apps/infra/openclaw/plugins/**"
      - "apps/backend/core/containers/config.py"
      - "apps/backend/tests/chaos/invariants/test_config_schema.py"
      - "openclaw-version.json"
      - "scripts/openclaw-image-proof*.mjs"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  image-proof-tests:
    name: image and plugin proof tests
    runs-on: ${{ vars.CI_RUNNER }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup uv
        uses: astral-sh/setup-uv@v4
      - name: Install backend dependencies
        run: uv sync --frozen
        working-directory: apps/backend
      - name: Emit production-shape qualification configs
        env:
          AWS_ACCESS_KEY_ID: testing
          AWS_DEFAULT_REGION: us-east-1
          AWS_SECRET_ACCESS_KEY: testing
          BEDROCK_GATE_URL: https://bedrock-gate.example.invalid/
          CLERK_ISSUER: https://test.clerk.accounts.dev
          DYNAMODB_TABLE_PREFIX: isol8-test-
          HUGGINGFACE_TOKEN: test_token
        run: |
          uv run python tests/chaos/invariants/test_config_schema.py \
            "${RUNNER_TEMP}/openclaw-image-qualification-configs"
        working-directory: apps/backend
      - name: Upload qualification configs
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-image-qualification-configs
          path: ${{ runner.temp }}/openclaw-image-qualification-configs
          retention-days: 1
      - name: Run proof suite
        run: |
          node --test scripts/openclaw-image-proof.test.mjs
          node --test apps/infra/openclaw/plugins/aws-exec-profile/index.test.mjs
          node --test apps/infra/openclaw/plugins/paperclip-exec-creds/index.test.mjs

  # 400+ lines of POSIX sh that migrates and can delete an owner's SQLite state.
  # It had a real smoke harness and nothing ran it — a case was asserting
  # nothing for weeks, undetected.
  boot-chain-smoke:
    name: local-sqlite boot chain smoke tests
    # `needs: boot-chain-smoke` below makes this the gate for the whole image
    # pipeline, so when hosted runners went unavailable this 7-second job took
    # the image build down with it. It follows CI_RUNNER; the build itself
    # does not (see below).
    runs-on: ${{ vars.CI_RUNNER }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # The boot script under test shells out to `sqlite3` and `jq`, and the
      # harness drives it through `sqlite3` directly. Both are preinstalled on
      # GitHub's Ubuntu image and neither is guaranteed on a self-hosted box,
      # so the suite would fail on a missing binary rather than on a real
      # regression. `command -v` makes this a no-op wherever they already
      # exist — including every hosted run and every box run after the first.
      - name: Ensure sqlite3 and jq
        run: |
          set -eu
          missing=""
          command -v sqlite3 >/dev/null 2>&1 || missing="$missing sqlite3"
          command -v jq      >/dev/null 2>&1 || missing="$missing jq"
          if [ -n "$missing" ]; then
            echo "installing:$missing"
            sudo apt-get update -qq
            # shellcheck disable=SC2086
            sudo apt-get install -y -qq $missing
          fi
          sqlite3 --version
          jq --version

      - name: Run smoke suite
        run: |
          sh apps/infra/openclaw/local-sqlite/smoke-test.sh \
             apps/infra/openclaw/local-sqlite/isol8-local-sqlite-boot.sh

  build-and-push:
    name: Build and push extended OpenClaw image
    permissions:
      contents: read
      id-token: write
      packages: read
    # A boot chain that fails its own suite must never reach ECR.
    needs: [boot-chain-smoke, image-proof-tests]
    if: github.event_name != 'pull_request'
    # Pinned to the box, deliberately NOT `vars.CI_RUNNER`. Every build on a
    # standard hosted runner since the `doctor` compile-cache bake was restored
    # OOM-killed the 7 GB VM — the annotation reads "the hosted runner lost
    # communication with the server", with no failed step and no uploaded logs.
    # The box has the memory, the disk, and a warm layer cache. CI_RUNNER is a
    # two-way switch and this job has only one working value, so it must not
    # follow the switch: flipping CI_RUNNER back to hosted to escape a box
    # outage would silently reintroduce the OOM here.
    runs-on: [self-hosted, isol8-wsl]
    # A hang bound, not a runtime budget: the box finishes in ~3m warm, while
    # a cold from-scratch rebuild of this ~7.8 GB image (bake included) ran
    # past 25m on a hosted runner.
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download qualification configs
        uses: actions/download-artifact@v4
        with:
          name: openclaw-image-qualification-configs
          path: ${{ runner.temp }}/openclaw-image-qualification-configs

      - name: Read version metadata
        id: meta
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          node scripts/openclaw-image-proof.mjs metadata "${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Authenticate Via OIDC Role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          role-duration-seconds: 1800
          role-skip-session-tagging: true
          role-to-assume: arn:aws:iam::877352799272:role/lightbulb-openclaw-image-builder

      - name: Prove candidate tag is absent
        env:
          REGISTRY_ID: "877352799272"
          REPOSITORY: "lightbulb/openclaw-extended"
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          if [ "${ACCOUNT_ID}" != "${REGISTRY_ID}" ]; then
            echo "OIDC account mismatch" >&2
            exit 1
          fi
          RESPONSE_FILE="${RUNNER_TEMP}/openclaw-ecr-preflight.json"
          aws ecr batch-get-image \
            --registry-id "${REGISTRY_ID}" \
            --repository-name "${REPOSITORY}" \
            --image-ids imageTag="${TAG}" \
            --region us-east-1 > "${RESPONSE_FILE}"
          node scripts/openclaw-image-proof.mjs \
            preflight "${REGISTRY_ID}" "${REPOSITORY}" "${TAG}" < "${RESPONSE_FILE}"

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      # The base image (openclaw-version.json#upstream) is the Isol8 OpenClaw
      # fork on GHCR, a private package this repo has been granted read access
      # to. The build below pulls it via FROM, so authenticate to GHCR first.
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify base image digest
        env:
          BASE_IMAGE: ${{ steps.meta.outputs.base_image }}
          BASE_DIGEST: ${{ steps.meta.outputs.base_digest }}
        run: |
          set -euo pipefail
          RESOLVED_DIGEST=$(docker buildx imagetools inspect \
            "${BASE_IMAGE}" --format '{{.Manifest.Digest}}')
          printf '%s\n' "${RESOLVED_DIGEST}" \
            | node scripts/openclaw-image-proof.mjs digest "${BASE_DIGEST}"

      - name: Build image
        run: |
          docker build \
            -t "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}" \
            apps/infra/openclaw/

      - name: Qualify built image and baked plugins
        env:
          IMAGE_REF: "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}"
        run: |
          set -euo pipefail
          ARCHITECTURE=$(docker image inspect "${IMAGE_REF}" --format '{{.Architecture}}')
          [ "${ARCHITECTURE}" = amd64 ] || {
            echo "Expected amd64 image, found ${ARCHITECTURE}" >&2
            exit 1
          }

          PROOF_DIR=$(mktemp -d)
          trap 'rm -rf "${PROOF_DIR}"' EXIT

          docker run --rm -i --entrypoint node "${IMAGE_REF}" --input-type=module - \
            > "${PROOF_DIR}/versions.json" <<'NODE'
          import { readFileSync } from "node:fs";
          const expected = {
            openclaw: ["/app/package.json", "2026.9.3-isol8.2"],
            slack: ["/app/dist/extensions/slack/package.json", "2026.9.3"],
            discord: ["/app/dist/extensions/discord/package.json", "2026.9.3"],
            "amazon-bedrock": ["/app/dist/extensions/amazon-bedrock/package.json", "2026.9.3"],
            lobster: ["/app/dist/extensions/lobster/package.json", "2026.9.3"],
            parallel: ["/app/dist/extensions/parallel/package.json", "2026.9.3"],
            firecrawl: ["/app/dist/extensions/firecrawl/package.json", "2026.9.3"],
            acpx: ["/app/dist/extensions/acpx/package.json", "2026.9.3"],
            tokenjuice: ["/app/dist/extensions/tokenjuice/package.json", "2026.9.3"],
            "sage-openclaw": ["/app/dist/extensions/sage-openclaw/package.json", "0.11.0"],
            "lightbulb-marketplace": ["/app/dist/extensions/lightbulb-marketplace/package.json", "0.1.0"],
            "aws-exec-profile": ["/app/dist/extensions/aws-exec-profile/package.json", "0.0.1"],
            "paperclip-exec-creds": ["/app/dist/extensions/paperclip-exec-creds/package.json", "0.0.1"],
          };
          const versions = {};
          for (const [id, [path, want]] of Object.entries(expected)) {
            const version = JSON.parse(readFileSync(path, "utf8")).version;
            if (version !== want) throw new Error(`${id}: expected ${want}, found ${version}`);
            versions[id] = version;
          }
          process.stdout.write(JSON.stringify(versions, null, 2) + "\n");
          NODE

          docker run --rm \
            -v "${RUNNER_TEMP}/openclaw-image-qualification-configs:/qualification/configs:ro" \
            -v "${GITHUB_WORKSPACE}/scripts/openclaw-image-proof-runtime.mjs:/qualification/qualify.mjs:ro" \
            --entrypoint node "${IMAGE_REF}" \
            /qualification/qualify.mjs /qualification/configs \
            > "${PROOF_DIR}/runtime.json"

          docker run --rm --entrypoint node "${IMAGE_REF}" \
            --test /app/dist/extensions/aws-exec-profile/index.test.mjs
          docker run --rm --entrypoint node "${IMAGE_REF}" \
            --test /app/dist/extensions/paperclip-exec-creds/index.test.mjs

          {
            echo "## Built-image qualification"
            echo ""
            echo "- Architecture: \`${ARCHITECTURE}\`"
            echo "- Runtime: generated Bedrock, BYOK, and ChatGPT configs validated and loaded"
            echo "- Contracts: configured plugins/providers/tools plus Lobster → LLM Task dispatch verified"
            echo ""
            echo '```json'
            cat "${PROOF_DIR}/versions.json"
            cat "${PROOF_DIR}/runtime.json"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      # NOTE: we deliberately do NOT `docker push` here. The ECR repository is
      # mutable, but this workflow's contract is one push of the converted OCI
      # target after proving the candidate tag absent, followed by an exact
      # digest read-back. The SOCI step imports the docker-built image into
      # containerd via `docker save | nerdctl image load` and pushes from there.

      - name: Set up containerd
        uses: crazy-max/ghaction-setup-containerd@v3

      - name: Convert image to SOCI v2 and push
        env:
          SOCI_VERSION: "0.13.0"
          NERDCTL_VERSION: "2.2.2"
          IMAGE_REF: "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}"
        # Fargate refuses SOCI Index Manifest v1 for accounts that didn't
        # already use SOCI before 2025-07-03 (per AWS containers blog
        # "improving-amazon-ecs-deployment-consistency-with-soci-index-manifest-v2").
        # We're a new customer, so v1 silently falls back to a full pull.
        # `soci convert` produces a v2 SOCI-enabled image (single OCI artifact
        # with the index attached). We push it under the deploy tag — the
        # only push to ECR for this tag (no docker push first).
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/awslabs/soci-snapshotter/releases/download/v${SOCI_VERSION}/soci-snapshotter-${SOCI_VERSION}-linux-amd64-static.tar.gz" \
            | sudo tar -xz -C /usr/local/bin/ soci
          sudo chmod +x /usr/local/bin/soci

          # `crazy-max/ghaction-setup-containerd@v3` installs containerd + ctr,
          # but not nerdctl. Pull the static binary from upstream releases.
          # nerdctl is required (per upstream cli-usage.md) for v2 push —
          # it uploads child blobs before committing the index manifest,
          # which is what ECR's strict validation expects.
          curl -sSL "https://github.com/containerd/nerdctl/releases/download/v${NERDCTL_VERSION}/nerdctl-${NERDCTL_VERSION}-linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin/ nerdctl
          sudo chmod +x /usr/local/bin/nerdctl

          # Authenticate nerdctl to ECR.
          ECR_PASSWORD=$(aws ecr get-login-password --region us-east-1)
          REGISTRY="$(echo "${IMAGE_REF}" | cut -d/ -f1)"
          echo "${ECR_PASSWORD}" | sudo nerdctl login --username AWS --password-stdin "${REGISTRY}"

          # Import the docker-built image into containerd's content store.
          # `docker save` streams the image; `nerdctl image load` ingests it.
          # Both use the same containerd backend so soci convert sees it next.
          docker save "${IMAGE_REF}" | sudo nerdctl image load

          # Convert to a SOCI v2 image. Requires src != dst, so we stage
          # under a -soci-staging suffix and re-tag onto the deploy ref.
          #
          # TMPDIR is load-bearing. `soci convert` spills one ztoc temp file
          # per layer, and on this box /tmp is a small separate filesystem
          # while / has ~690 GB free. A ~16 GB image exhausted /tmp mid-convert
          # and killed the run with a wall of "write /tmp/tmp.NNNN: no space
          # left on device" while `df /` reported 28% used (2026-08-18, sha
          # 8dad643). The disk graph looks healthy, so this failure does NOT
          # present as a space problem — check the filesystem /tmp is on, not /.
          #
          # sudo resets the environment (env_reset), so exporting TMPDIR in the
          # step `env:` block does NOT reach soci. It must ride the sudo
          # command line, as below.
          SOCI_TMPDIR=/var/tmp/soci-build
          sudo rm -rf "${SOCI_TMPDIR}"
          sudo mkdir -p "${SOCI_TMPDIR}"
          sudo TMPDIR="${SOCI_TMPDIR}" soci convert --platform linux/amd64 "${IMAGE_REF}" "${IMAGE_REF}-soci-staging"
          sudo nerdctl rmi "${IMAGE_REF}" || true
          sudo nerdctl tag "${IMAGE_REF}-soci-staging" "${IMAGE_REF}"

          # Read the converted OCI target from containerd immediately before
          # the workflow's single push. This is the digest ECR must retain for
          # the deploy tag; a child manifest or the pre-conversion Docker
          # digest is not sufficient. Native inspect returns both local names
          # for one target, so collapse identical values while preserving a
          # fail-closed error if distinct digests ever appear.
          EXPECTED_DIGEST=$(sudo nerdctl image inspect --mode=native "${IMAGE_REF}" \
            --format '{{.Image.Target.Digest}}' | sort -u)
          EXPECTED_DIGEST=$(printf '%s\n' "${EXPECTED_DIGEST}" \
            | node scripts/openclaw-image-proof.mjs canonical-digest)

          # Push the SOCI v2 image once, then prove the exact tag resolves to
          # the converted OCI target digest.
          sudo nerdctl push --platform linux/amd64 "${IMAGE_REF}"
          REGISTRY_ID="877352799272"
          REPOSITORY="lightbulb/openclaw-extended"
          TAG="${IMAGE_REF##*:}"
          RESPONSE_FILE="${RUNNER_TEMP}/openclaw-ecr-post-push.json"
          aws ecr batch-get-image \
            --registry-id "${REGISTRY_ID}" \
            --repository-name "${REPOSITORY}" \
            --image-ids imageTag="${TAG}" \
            --region us-east-1 > "${RESPONSE_FILE}"
          node scripts/openclaw-image-proof.mjs post-push \
            "${REGISTRY_ID}" "${REPOSITORY}" "${TAG}" "${EXPECTED_DIGEST}" \
            < "${RESPONSE_FILE}"

          {
            echo "## Verified image identity"
            echo ""
            echo "- Converted OCI target: \`${EXPECTED_DIGEST}\`"
            echo "- Base digest: \`${{ steps.meta.outputs.base_digest }}\`"
            echo "- Source commit: \`${GITHUB_SHA}\`"
            echo "- Workflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "${GITHUB_STEP_SUMMARY}"

      # On a SELF-HOSTED runner the container stores are not thrown away with
      # the VM, so anything this job leaves behind is permanent. The SOCI step
      # above leaves THREE copies of a ~16 GB image per run: the docker-built
      # one in containerd's `moby` namespace, plus `IMAGE_REF` and
      # `IMAGE_REF-soci-staging` in `default` (nerdctl's namespace). Nothing
      # collected them, and critically `docker system prune` cannot — it only
      # knows about `moby`. Roughly 200 builds accumulated 614 images and grew
      # /var/lib/containerd to 732 GB, filling the runner box's disk until
      # builds began failing (run #196 attempt 2, 2026-08-11).
      #
      # `if: always()` because a build that fails partway through the convert
      # is exactly the case that used to strand the most bytes.
      - name: Reclaim container storage
        if: always()
        env:
          IMAGE_REF: "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}"
        run: |
          set -uo pipefail
          # nerdctl's `default` namespace — both tags the convert produced.
          sudo nerdctl rmi -f "${IMAGE_REF}" "${IMAGE_REF}-soci-staging" 2>/dev/null || true
          # Docker's own copy plus the layer cache this build populated.
          docker image rm -f "${IMAGE_REF}" 2>/dev/null || true
          docker builder prune -af --filter until=168h 2>&1 | tail -2 || true
          # The ztoc spill dir. Nothing else collects it, and a convert that
          # dies partway leaves the most behind — which would then eat the
          # headroom the NEXT run needs, making one failure sticky.
          sudo rm -rf /var/tmp/soci-build || true
          echo "disk after reclaim:"
          # / alone hid the 2026-08-18 failure: it read 28% used while /tmp was
          # full. Print every filesystem the convert actually writes to.
          df -h / /tmp /var/tmp 2>/dev/null | tail -4

      - name: Summary
        run: |
          echo "## Built image" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Bump \`openclaw-version.json#dev.tag\` to \`${{ steps.meta.outputs.tag }}\` in a PR to deploy to dev." >> "$GITHUB_STEP_SUMMARY"
