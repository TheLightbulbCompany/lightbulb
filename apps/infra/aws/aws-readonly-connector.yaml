AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Isol8 connector — grants Isol8's per-owner agent container scoped
  AssumeRole access to this account at the access tier you selected.

Parameters:
  ExternalId:
    Type: String
    NoEcho: true
    Description: >-
      The high-entropy STS ExternalId Isol8 generated for this connection.
      Required on every AssumeRole call; without it the role cannot be assumed.

  TrustedPrincipalArn:
    Type: String
    Description: >-
      ARN of the Isol8 per-owner container task role that is allowed to assume
      this role (e.g. arn:aws:iam::877352799272:role/isol8-<env>-owner-bedrock-<owner>).

  ManagedPolicyArn:
    Type: String
    Description: >-
      The AWS managed policy to attach (ViewOnly, ReadOnly, or PowerUser).
    AllowedValues:
      - "arn:aws:iam::aws:policy/job-function/ViewOnlyAccess"
      - "arn:aws:iam::aws:policy/ReadOnlyAccess"
      - "arn:aws:iam::aws:policy/PowerUserAccess"

Resources:
  Isol8ReadOnlyRole:
    Type: AWS::IAM::Role
    Properties:
      # Canonical name = backend bedrock_aip.CONNECTOR_ROLE_NAME. Must stay in
      # lockstep with that constant and the service-stack iam:GetRole resource;
      # a rename here silently breaks the self-account trust-pin check.
      RoleName: isol8-connector
      Description: >-
        Read-only role assumed by Isol8's per-owner agent container. Trust is
        pinned to a single Isol8 principal and gated by an STS ExternalId.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Ref TrustedPrincipalArn
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalId
      ManagedPolicyArns:
        - !Ref ManagedPolicyArn
      Tags:
        - Key: ManagedBy
          Value: isol8

Outputs:
  RoleArn:
    Description: >-
      ARN of the created read-only role — paste this back into Isol8 to complete
      the AWS connection (aws-complete).
    Value: !GetAtt Isol8ReadOnlyRole.Arn
