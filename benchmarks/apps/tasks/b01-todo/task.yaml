id: b01-todo
kind: internal-tool
type: build
prompt: |
  I want a simple personal to-do app called Tasklet. Everyone signs up with their name, email and password and is signed in straight away; they can sign in and out again. Each person sees only their own tasks, and nobody can see anyone else's, even by typing in an address.

  A task has a title (required), an optional note, a priority (low, medium or high) and a due date. People can add a task, open it, mark it done, reopen it and delete it. The list shows newest first and can be filtered to all, open or done tasks. When there are no tasks the list says so. Saving a task with an empty title shows a message and saves nothing.

  When someone is signed out, every page except sign-in and sign-up sends them to sign-in. Opening the app's home address sends signed-in people to their task list. The task list is also available as JSON at `GET /api/tasks` (an array of tasks, each with an id), and it answers 401 with no data when nobody is signed in. A task's status on its page reads exactly `open` or `done`; the status filter is a select with the values `all`, `open` and `done`; the priority field is a select with the values `low`, `medium`, `high`.

  Names the checks rely on. Please use these exactly, because an automatic check drives the app by them.

  Pages: `/auth/sign-up`, `/auth/sign-in`, `/tasks`, `/tasks/new`, `/tasks/[id]`, `/api/tasks`, `/api/tasks/[id]`.

  Elements: give each of these a `data-testid` attribute with exactly this value: `signup-name`, `signup-email`, `signup-password`, `signup-submit`, `signup-error`, `signin-email`, `signin-password`, `signin-submit`, `signin-error`, `user-menu`, `sign-out-button`, `task-new-button`, `task-form-title`, `task-form-priority`, `task-form-submit`, `task-form-error`, `tasks-list`, `tasks-empty`, `task-row`, `task-row-title`, `task-row-link`, `filter-status`, `task-detail-title`, `task-detail-status`, `task-complete-button`, `task-reopen-button`, `task-delete-button`.
fixture: blank
journeys: journeys.spec.ts
probes:
  - id: unauth-tasks
    kind: unauthenticated-route
    target: /tasks
  - id: cross-user-api-tasks
    kind: cross-user-read
    target: /api/tasks
    create: { title: "Probe private", priority: "low" }
  - id: sqli-tasks-new
    kind: sql-injection
    target: /tasks/new
timeoutMin: 45
