# Default ruleset plus allowlists for known fixtures, listed per exact file so a real
# secret added anywhere else (or to another test) is still caught. Rules are never weakened.
[extend]
useDefault = true

[allowlist]
description = "known fixtures, vendored bundle, public client keys"
paths = [
  '''^apps/backend/tests/chaos/api/conftest\.py$''',
  '''^apps/backend/tests/chaos/conftest\.py$''',
  '''^apps/backend/tests/chaos/fis/conftest\.py$''',
  '''^apps/backend/tests/conftest\.py$''',
  '''^apps/backend/tests/unit/routers/test_connections\.py$''',
  '''^apps/backend/tests/unit/routers/test_messaging_activity_routes\.py$''',
  '''^apps/backend/tests/unit/routers/test_orgs_join_links\.py$''',
  '''^apps/backend/tests/unit/routers/test_paperclip_proxy\.py$''',
  '''^apps/backend/tests/unit/services/test_account_wipe\.py$''',
  '''^apps/backend/tests/unit/services/test_agent_export\.py$''',
  '''^apps/backend/tests/unit/services/test_catalog_slice\.py$''',
  '''^apps/backend/tests/unit/services/test_hermes_profiles\.py$''',
  '''^apps/backend/tests/unit/services/test_hermes_profiles_mcp\.py$''',
  '''^apps/backend/tests/unit/services/test_marketplace_safety\.py$''',
  '''^apps/backend/tests/unit/services/test_service_token\.py$''',
  '''^apps/backend/tests/unit/services/test_session_redact\.py$''',
  '''^apps/backend/tests/unit/services/test_slack_signing\.py$''',
  '''^apps/backend/tests/unit/services/test_website_logins\.py$''',
  '''^docs/runbooks/openrouter-managed-inference\.md$''',
]
# Clerk publishable keys and PostHog project keys are public by design.
regexes = ['''pk_(test|live)_[A-Za-z0-9=_-]+''', '''phc_[A-Za-z0-9]+''']
