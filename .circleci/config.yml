# =============================================================================
# CircleCI (free tier) setup pipeline. GitHub-hosted Actions minutes ran out and
# the self-hosted runner box is offline (2026-11-05), so:
#
#   branch push  -> .circleci/pr-checks.yml   a mirror of the pull_request
#                                             workflows in .github/workflows/
#   main push    -> .circleci/deploy-dev.yml  the dev stage of the generated
#                                             .github/workflows/deploy.yml
#
# Prod promotion stays on GitHub Actions (workflow_dispatch of deploy.yml).
#
# Branches: the path-filtering job diffs the branch against main and continues
# with pr-checks.yml, switching on only the areas whose paths changed. The
# mapping below is the same set of `paths:` filters the GitHub workflows
# declare (one regex per line, anchored, grep -P). The secret scan has no
# switch: it runs on every PR.
#
# Main: the same job with no mapping, so it only continues into deploy-dev.yml
# (one orb, one job type; nothing to filter on a deploy).
#
# Project settings to pair with this (CircleCI UI): trigger on all pushes (main
# must trigger, so "Only build pull requests" stays OFF), no forked PRs. Each
# branch push without a PR costs the pr-checks run; keep branches on PRs.
# =============================================================================
version: 2.1
setup: true

orbs:
  path-filtering: circleci/path-filtering@3.0.0

workflows:
  main-setup:
    jobs:
      - path-filtering/filter:
          name: continue-to-deploy-dev
          filters:
            branches:
              only: main
          base-revision: main
          config-path: .circleci/deploy-dev.yml
          resource_class: small

  pr-setup:
    jobs:
      - path-filtering/filter:
          name: changed-paths
          filters:
            branches:
              ignore: main
          base-revision: main
          config-path: .circleci/pr-checks.yml
          resource_class: small
          mapping: |
            apps/backend/.* run-backend true
            apps/infra/lambda/(ses-inbound|ws-connect|pub-authorizer|messaging-projector|messaging-search-indexer|openrouter-settlement)/.* run-backend true
            apps/frontend/.* run-frontend true
            packages/.* run-frontend true
            pnpm-lock.yaml run-frontend true
            apps/mobile/.* run-mobile true
            packages/shared/.* run-mobile true
            pnpm-lock.yaml run-mobile true
            apps/infra/.* run-infra true
            .github/workflows/(deploy|desktop-build).yml run-infra true
            (paperclip-version|hermes-version|openrouter-pricing).json run-infra true
            pnpm-lock.yaml run-infra true
            apps/company/.* run-company true
            pnpm-lock.yaml run-company true
            tla/.* run-tla true
            apps/huddle-agent/.* run-huddle true
            apps/backend/core/services/(messaging|jev|voice_calls).py run-huddle true
            .circleci/.* run-backend true
            .circleci/.* run-frontend true
            .circleci/.* run-mobile true
            .circleci/.* run-infra true
            .circleci/.* run-company true
            .circleci/.* run-tla true
            .circleci/.* run-huddle true
