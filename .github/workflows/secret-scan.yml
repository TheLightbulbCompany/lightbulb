# =============================================================================
# Secret scan (gitleaks) over the commits a PR/push adds
# =============================================================================
# Runs the gitleaks binary, not gitleaks/gitleaks-action: the action demands a
# GITLEAKS_LICENSE secret for organization-owned repos. The tarball is pinned by
# sha256 (from the release's checksums file), so it is as fixed as a SHA-pinned
# action. Bump VERSION and both hashes together.
name: Secret scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# PRs supersede themselves. A push to main gets a group of its own (its SHA): a shared
# group keeps only one pending run, so a burst of pushes would drop the middle scans
# and their commit ranges would never be inspected.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    # Self-hosted (vars.CI_RUNNER) again 2026-11-05: GitHub-hosted runs used up the free Actions minutes.
    runs-on: ${{ vars.CI_RUNNER }}
    timeout-minutes: 10
    env:
      VERSION: 8.30.1
      SHA_X64: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      SHA_ARM64: e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          case "$(uname -m)" in
            x86_64) arch=x64; sha="$SHA_X64" ;;
            aarch64|arm64) arch=arm64; sha="$SHA_ARM64" ;;
            *) echo "unsupported arch"; exit 1 ;;
          esac
          f="gitleaks_${VERSION}_linux_${arch}.tar.gz"
          # Retry transient release-download failures; every download still must match the pinned checksum.
          curl -fsSL --retry 3 --retry-all-errors --retry-max-time 120 --connect-timeout 10 --max-time 60 \
            -o "$RUNNER_TEMP/$f" "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/$f"
          echo "$sha  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP" gitleaks
      - name: Scan new commits
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
        run: |
          # A new branch has an all-zero "before"; a force push leaves "before" naming
          # a tip this checkout cannot reach, and gitleaks would then scan nothing and
          # pass. If the range base is not a commit we hold, scan the whole history.
          base="${RANGE%%..*}"
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            RANGE="${GITHUB_SHA}"
          fi
          "$RUNNER_TEMP/gitleaks" git --redact -v --log-opts="--diff-merges=first-parent $RANGE" .
