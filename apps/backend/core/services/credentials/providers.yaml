# Bucket B variant — X/Twitter via direct OAuth into the baked xurl CLI. X does
# not provide dynamic client registration for this flow, so v1 is BYO-app: the
# owner creates an X developer app, registers Isol8's callback, and grants OAuth2
# user-context scopes. xurl owns refresh from ~/.xurl in the owner container.
x:
  display_name: X
  acquisition: direct_oauth
  actor: cli
  refresh_owner: actor
  custody_migratable: true
  refresh_window_s: 600
  byo_required: true
  byo_setup_url: "https://developer.x.com/en/portal/dashboard"
  requires: { bins: [xurl] }
  oauth:
    authorization_url: "https://x.com/i/oauth2/authorize"
    token_url: "https://api.x.com/2/oauth2/token"
    scopes:
      - tweet.read
      - tweet.write
      - users.read
      - offline.access
      - dm.read
      - dm.write
      - follows.read
      - follows.write
      - like.read
      - like.write
      - media.write
    scope_separator: " "
    pkce: true
    # X treats a Web App / Automated App or Bot as a CONFIDENTIAL client: the code
    # exchange must carry `Authorization: Basic base64(client_id:client_secret)`.
    # A posted client_secret is rejected, which is what made every BYO connect fail.
    token_endpoint_auth_method: client_secret_basic
  wiring:
    materializer: xurl_cli

# Bucket B variant — AWS via STS AssumeRole. The owner runs a one-time
# CloudFormation stack creating a connector role (trust = Isol8 account root +
# per-connection ExternalId) at a chosen tier (ViewOnly / ReadOnly /
# PowerUser). The aws_cli materializer writes a credential_process bundle onto
# EFS; the baked `aws` CLI pulls short-lived connector credentials from the
# backend's /connections/aws/credentials endpoint on demand. refresh_owner:
# none — the CLI-side helper refreshes by re-fetching; nothing is scheduled.
aws:
  display_name: AWS
  acquisition: aws_sts
  actor: cli
  refresh_owner: none
  requires: { bins: [aws] }
  aws_sts:
    view_only_policy_arn: "arn:aws:iam::aws:policy/job-function/ViewOnlyAccess"
    read_only_policy_arn: "arn:aws:iam::aws:policy/ReadOnlyAccess"
    power_user_policy_arn: "arn:aws:iam::aws:policy/PowerUserAccess"
    default_region: "us-east-1"
  wiring:
    materializer: aws_cli

# Platform-app OAuth + REMOTE MCP — Meta's own hosted ads MCP server. Meta
# maintains the ~29 ad tools; we only authenticate the owner and point the
# runtime at the endpoint, so there is no Marketing API integration to build.
#
# NOT the Notion/Sentry/Linear DCR shape, despite this server advertising a
# `registration_endpoint` in its discovery document
# (https://mcp.facebook.com/.well-known/oauth-authorization-server/ads). That
# endpoint answers 400 invalid_client_metadata "Dynamic registration is not
# available for this client" for every payload — Meta allowlists a handful of
# first-party MCP clients and rejects everyone else, Anthropic's own Claude Code
# included (anthropics/claude-code#55002, closed not-planned). The documented
# path is instead YOUR OWN Meta app id as the OAuth client, which is exactly what
# `platform_app` gives us: oauth_dance blanks the platform secret and synthesizes
# clientInformation = {"client_id": <app id>}, the public-client shape the MCP
# SDK's OAuthClientProvider wants and the same thing Meta's docs spell as
# `claude mcp add --client-id <META_APP_ID>`.
#
# The platform app here is `meta-ads`, NOT `meta-instagram`: that secret carries
# the INSTAGRAM app id (1049347507456011), a different id from the Meta app the
# ads MCP authenticates against (2080424579211211).
#
# All seven documented scopes are requested rather than a subset — Meta's Get
# Started lists them as the set to grant, and `ads_mcp_management` in particular
# is the one that gates the MCP endpoint at all.
#
# Env-gated until the meta-ads platform secret is seeded and the redirect URI is
# registered in the app's Facebook Login for Business settings. Advanced Access
# on ads_mcp_management (App Review) is what lets this serve OTHER businesses'
# ad accounts; until then only accounts holding a role on the Meta app can
# complete a connect. Drop both gate lines once that lands.
#
# refresh_owner: none, NOT actor. `actor` would claim the MCP SDK's
# OAuthClientProvider self-refreshes, and it cannot: Meta issues no
# refresh_token at any tier, so mcp_oauth writes a token store with no
# `refresh_token` key and the SDK has nothing to renew from. `none` is the
# honest declaration and, unlike `actor`, keeps the credential in Secrets
# Manager so a reprovision can re-materialize it instead of forcing a reconnect.
# long_lived_exchange is what makes the grant last: without it the code exchange
# leaves a token measured in HOURS and the MCP server starts 401ing the same
# afternoon. Even with it, ~60 days is Meta's ceiling for a user token — after
# that the owner reconnects. (A Business Manager System User token never
# expires, but each business mints its own, so it cannot ride this one-click
# flow.)
apollo:
  # See the note on `attio` — paired with `apollo_api` below.
  display_name: Apollo (for your agents)
  acquisition: direct_oauth
  actor: mcp
  refresh_owner: actor
  brokered_environments: [dev, prod]
  oauth:
    authorization_url: https://mcp.apollo.io/mcp/oauth_metadata/redirect_to_authorize
    token_url: https://mcp.apollo.io/api/v1/oauth/token
    registration_url: https://mcp.apollo.io/api/v1/oauth/applications/register_oauth_client
    scopes:
    - read_user_profile
    - app_scopes
    - mixed_people_api_search
    - organizations_search
    - mixed_companies_search
    - contacts_search
    - contact_read
    - organizations_enrich
    - people_match
    scope_separator: ' '
    pkce: true
  mcp_remote:
    key: apollo
    url: https://mcp.apollo.io/mcp
    transport: streamable-http
  wiring:
    materializer: mcp_oauth

cloudflare:
  display_name: Cloudflare
  acquisition: direct_oauth
  actor: mcp
  refresh_owner: actor
  brokered_environments: [dev, prod]
  oauth:
    authorization_url: https://mcp.cloudflare.com/authorize
    token_url: https://mcp.cloudflare.com/token
    registration_url: https://mcp.cloudflare.com/register
    scopes: []
    scope_separator: ' '
    pkce: true
  mcp_remote:
    key: cloudflare
    url: https://mcp.cloudflare.com/mcp
    transport: streamable-http
  wiring:
    materializer: mcp_oauth

meta_ads:
  display_name: Meta Ads
  acquisition: direct_oauth
  actor: mcp
  refresh_owner: none
  environments: [local, dev]
  # Second entry is the App Review workspace (externalreview@thelightbulb.company's
  # org). Meta's reviewer signs in with it and connects THEIR OWN Meta assets;
  # without it the reviewer sees no Connect button at all and rejects on
  # "cannot test". Remove alongside the env gate once Advanced Access lands.
  owner_allowlist:
    - "org_3H3viGAfq2SXc9dIdcatmGXg8Td"
    - "org_3Jshao85twVsEky1nB16fVWqFeW"
  oauth:
    authorization_url: "https://www.facebook.com/v25.0/dialog/oauth"
    token_url: "https://graph.facebook.com/v25.0/oauth/access_token"
    platform_app: meta-ads
    long_lived_exchange: fb_exchange_token
    scopes:
      - ads_mcp_management
      - ads_read
      - ads_management
      - business_management
      - pages_show_list
      # Required to bind a Page to our webhook. inbound_triggers._meta_pages
      # pulls each Page's own token from /me/accounts and then POSTs
      # {page-id}/subscribed_apps — Meta requires a Page token AND
      # pages_manage_metadata for that edge, so without this a Page trigger
      # fails at subscribe time. It fails loudly rather than silently (the
      # subscribe call raises), but it fails for every owner, every time.
      # pages_show_list only lists the Pages; it does not authorize binding one.
      # Instagram triggers are unaffected — their subscribed_apps call rides
      # instagram_business_manage_{comments,messages}, already requested.
      - pages_manage_metadata
    scope_separator: " "
  mcp_remote:
    key: meta_ads
    url: "https://mcp.facebook.com/ads"
    transport: streamable-http
  wiring:
    materializer: mcp_oauth
  # Automations trigger source — the FIRST app-level (fan-in) one. Meta does
  # not do per-owner endpoints: the whole app has ONE callback URL + one verify
  # token + one field subscription per object type, configured once in the app
  # dashboard, and EVERY owner's deliveries land there. Per-owner binding is
  # POST /{page-id}/subscribed_apps with that owner's token, recorded as an
  # asset↔trigger binding on their integrations row; the ingress route
  # (routers/meta_webhook.py) verifies Meta's app-secret signature and routes
  # by entry[].id. provider_events are Meta's own Page webhook field names.
  # Prod exposure waits on Meta App Review — the `environments` gate above is
  # the waitlist, and this block does not change that.
  inbound:
    webhook_registration: auto_meta
    signing_mode: bearer
    # A Meta delivery names each change's field in the body
    # (entry[].changes[].field), so several can share one subscription.
    event_in_body: true
    events:
      - id: leadgen
        label: New lead
        provider_events: [leadgen]
      - id: feed
        label: Page post activity
        provider_events: [feed]
      - id: messages
        label: New message
        provider_events: [messages]
    template:
      title: "Meta: {event_label}"
      suggested_agent: friday
      starter_prompt: >-
        A Meta webhook just fired: {event_label}. Look at the payload, figure
        out which Page and which lead, post, or conversation it concerns, and
        take the appropriate next step (e.g. follow up with the lead, reply to
        the comment, or brief the team).

# Platform-app OAuth — Instagram via Isol8's ONE reviewed Meta app (the
# Buffer/Hootsuite model). The owner OAuths through Business Login for
# Instagram and grants their own IG professional account; the client lives in
# Secrets Manager under platform-oauth/meta-instagram (seeded by
# scripts/set_platform_oauth_app.py), never per-owner. The dance upgrades the
# short-lived token to the ~60-day one (long_lived_exchange) and the
# instagram_cli materializer seeds SKILL.md + credentials.json + token.sh onto
# EFS for the agent.
# Scopes are COMMA-separated — Instagram rejects space-separated scope lists.
#
# refresh_owner: actor — the CONTAINER owns renewal. Instagram's refresh takes
# the TOKEN ALONE (no app secret), so skills/instagram/token.sh renews the
# 60-day token in place every time the agent reads it. Renewal therefore happens
# on use, which is the only moment it matters — no scheduler and no backend
# sweep. Consequence (identical to google/gog): routers.connections
# ._retains_secret skips Secrets Manager, so EFS is the sole custodian and an
# owner who reprovisions must reconnect Instagram.
instagram:
  display_name: Instagram
  acquisition: direct_oauth
  actor: cli
  refresh_owner: actor
  custody_migratable: true
  refresh_window_s: 2592000
  # Dev-only until the Meta app clears App Review + the platform secret is seeded
  # in prod. Remove this line to expose Instagram in every environment.
  environments: [local, dev]
  # ...plus named prod owners, so they can dogfood Instagram on prod
  # pre-App-Review (and record the App Review screencast) while every other prod
  # owner stays dark — they can't complete a connect pre-review anyway, since the
  # Meta app is in Development mode and only accounts holding an app role can
  # finish the OAuth. To add a tester: add their Instagram account as an
  # Instagram Tester on the Meta app AND add their Clerk id here. Drop the whole
  # gate once App Review lands and Instagram opens to all prod owners.
  # NOTE: owner ids do NOT survive a prod wipe — the previous entry
  # (org_3DBS8G83oPrMm49yN2b70EjoFpN) was orphaned by the 2026-07-25 wipe, which
  # silently hid Instagram from every prod owner including the founders.
  #
  # Second entry is the App Review workspace (externalreview@thelightbulb.company's
  # org). Meta's reviewer signs in with it and connects THEIR OWN Instagram
  # professional account (Meta asks for app credentials and forbids supplying
  # Instagram ones). Without it the reviewer sees no Connect button at all and
  # rejects on "cannot test" — the catch-22 of gating the very flow review has
  # to exercise.
  owner_allowlist:
    - "org_3H3viGAfq2SXc9dIdcatmGXg8Td"
    - "org_3Jshao85twVsEky1nB16fVWqFeW"
  oauth:
    authorization_url: "https://www.instagram.com/oauth/authorize"
    token_url: "https://api.instagram.com/oauth/access_token"
    scopes:
      - instagram_business_basic
      - instagram_business_content_publish
      - instagram_business_manage_comments
      - instagram_business_manage_messages
    scope_separator: ","
    platform_app: meta-instagram
    long_lived_exchange: ig_exchange_token
  wiring:
    materializer: instagram_cli
  # Automations trigger source — the same app-level (fan-in) shape as meta_ads
  # above: ONE app-wide callback URL, deliveries routed by entry[].id, and
  # per-owner binding via POST /{ig-user-id}/subscribed_apps. The difference is
  # WHICH Graph host and WHICH token: Business Login for Instagram issues a
  # graph.instagram.com token for exactly ONE professional account, and the
  # backend does not retain it (refresh_owner: actor) — it lives in the
  # materialized skills/instagram/credentials.json on EFS, which is where both
  # the resource lister and the subscribe call read it from.
  # Prod exposure waits on Meta App Review — the `environments` gate above is
  # the waitlist, and this block does not change that.
  inbound:
    webhook_registration: auto_meta
    signing_mode: bearer
    # A Meta delivery names each change's field in the body
    # (entry[].changes[].field), so several can share one subscription.
    event_in_body: true
    events:
      - id: comments
        label: New comment
        provider_events: [comments]
      - id: mentions
        label: Mentioned
        provider_events: [mentions]
      - id: messages
        label: New DM
        provider_events: [messages]
    template:
      title: "Instagram: {event_label}"
      suggested_agent: friday
      starter_prompt: >-
        An Instagram webhook just fired: {event_label}. Look at the payload,
        figure out which post or conversation it concerns, and take the
        appropriate next step (e.g. reply to the comment or DM, or flag it to
        the team).

# Shopify, on the paste rail again — as CLIENT CREDENTIALS, not a token. Shopify ended
# admin-created custom apps on 2026-01-01 (the permanent shpat_ token the first version of
# this row validated against), and the OpenClaw-era CLI login that replaced it cannot run on
# AgentCore (its OAuth redirect is loopback-bound to the CLI host). A new store's custom app
# now comes from the Dev Dashboard with only a Client ID + Client secret; an Admin API token
# is the client-credentials grant on the owner's own store, and it lives 24 h (expires_in
# 86399) — so nothing long-lived can be stored as "the token". Instead the owner fills three
# labelled inputs (paste_fields), the backend joins them into "<shop>|<client_id>:<secret>"
# (host_pattern splits it and pins the host), validation mints a token and runs
# `{ shop { name } }` with it, and the shopify_cli materializer lands the three values in
# the profile's skills/shopify/ where token.sh mints and caches a token per session.
# Deliberately NO inbound: block — Shopify signs webhooks with a BASE64 HMAC-SHA256 and
# every Paperclip signing mode compares a HEX digest.
shopify:
  display_name: Shopify
  acquisition: paste_token
  actor: skill
  refresh_owner: none
  token_setup_url: "https://shopify.dev/docs/apps/build/dev-dashboard/get-api-access-tokens"
  paste_fields:
    - { key: shop, label: "Store domain", placeholder: "mystore.myshopify.com", host: true }
    - { key: client_id, label: "Client ID" }
    - { key: client_secret, label: "Client secret", secret: true }
  paste_format: "{shop}|{client_id}:{client_secret}"
  validate:
    method: POST
    url: "https://{host}/admin/api/2026-07/graphql.json"
    host_pattern: '[a-z0-9][a-z0-9-]{0,59}\.myshopify\.com'
    token_grant_url: "https://{host}/admin/oauth/access_token"
    auth_header: X-Shopify-Access-Token
    auth_scheme: ""
    body: { query: "{ shop { name } }" }
    success_json_field: data.shop.name
  wiring:
    materializer: shopify_cli

# ── TIER 2: backend-readable REST keys ────────────────────────────────────
# `attio` and `apollo` above are MCP OAuth connections: the AGENT can reach
# them from inside the container, and a backend route cannot. That is not a
# storage decision we can reverse with `retain_secret`, because the grants are
# MCP-SCOPED — Attio's is `openid offline_access mcp`, while reading a record
# needs `record` + `object configuration`, which is why this file already
# records that the same grant cannot create webhooks. Retaining that token
# would retain something that 403s.
#
# So a REST-capable key is a SEPARATE credential, and the owner grants it
# separately (owner ruling 2026-09-01: usability and agent capability over
# least privilege; Apollo's workspace-scoped, unattributable key is accepted).
# `paste_token` + `refresh_owner: none` makes `_retains_secret()` true, so the
# credential lands in Secrets Manager where a backend route can read it.
#
# The wiring is `backend_only`: the key is deliberately NOT written into
# openclaw.json. An earlier version wired it to `env.vars.*` to hand the agent
# REST scopes its MCP grant lacks, but that is not durable — a reprovision
# rebuilds openclaw.json wholesale and re-injects only the MCP-server merge and
# the Projects-keyed `build_provisioned_env`, so the key would vanish on the
# next image roll while the integration row still read "connected". A
# credential that disappears without telling anyone is worse than one the agent
# never had.
#
# Naming follows the same rule as the Stripe rows: never let two entries share
# a bare provider name, or a status on one reads as a status on the other.

attio_api:
  display_name: Attio (dashboard access)
  acquisition: paste_token
  actor: skill
  refresh_owner: none
  # Workspace settings → Developers → Access tokens. The owner picks scopes at
  # generation time; a dashboard read needs `record` + `object configuration`.
  token_setup_url: "https://app.attio.com/settings/developers"
  # Without this the paste rail accepts anything: a typo or a token minted
  # WITHOUT the scopes a read needs is stored, wired, and shows a green
  # "Connected" — then 403s at read time with nothing surfacing to the owner.
  # `/v2/objects` needs `object_configuration:read`, so it catches a typo and a
  # token with no Attio scopes at all. It does NOT prove `record:read` — a token
  # granted object-configuration but not record still passes here and 403s on
  # the first actual record read. Half a check, stated as half rather than
  # implied as whole; a second probe against a record listing would close it.
  validate: { method: GET, url: "https://api.attio.com/v2/objects", auth_header: Authorization }
  wiring:
    backend_only: true

apollo_api:
  display_name: Apollo (dashboard access)
  acquisition: paste_token
  actor: skill
  refresh_owner: none
  # Settings → Integrations → API. NOTE: an Apollo API key identifies the
  # WORKSPACE, not a person — every request acts as the workspace's
  # longest-standing active admin, so Apollo cannot attribute actions to a
  # teammate. Accepted by the owner. Do NOT tick Apollo's "master key" box:
  # it grants every endpoint and search does not need it.
  token_setup_url: "https://app.apollo.io/#/settings/integrations/api"
  # Apollo authenticates with a bare `x-api-key` header, not a Bearer scheme,
  # and answers 200 with `is_logged_in: false` for a bad key rather than 401 —
  # so the JSON field is what actually decides validity here.
  validate:
    method: GET
    url: "https://api.apollo.io/v1/auth/health"
    auth_header: x-api-key
    auth_scheme: ""
    success_json_field: is_logged_in
  wiring:
    backend_only: true

# Bucket B variant — STDIO MCP behind a platform OAuth app. Intuit publishes no
# hosted MCP we can reach: `intuit/quickbooks-online-mcp-server` is stdio-only
# (src/index.ts constructs a StdioServerTransport and nothing else), unpublished
# on npm, so the extended image builds it from a pinned commit. The hosted
# endpoint that exists (ai-inc.quickbooks.intuit.com) is an Intuit×Anthropic
# partnership surface — Akamai 403s every caller we can be, and Claude registers
# it `isAuthless`, so there is no OAuth-protected resource for the mcp_oauth
# rail to ride.
#
# refresh_owner: actor is FORCED, not chosen. Intuit refresh tokens have a
# ROLLING 100-day expiry and rotate on every use ("Always store the latest
# refresh_token value from the most recent API server response"), so exactly one
# party may refresh. Their server refreshes itself on its 60-minute access-token
# cycle, which makes it the rotator; a backend that also refreshed would rotate
# the container's token out from under it and kill the connection. Consequence
# (same as google/gog/instagram): _retains_secret is False, EFS is the sole
# custodian, and an owner who wipes EFS must reconnect.
#
# The credential therefore does NOT ride the mcp_server wiring rail — that rail
# resolves env values from the retained Secrets Manager secret, and there isn't
# one. It rides the qbo_dotenv materializer, which writes the token store onto
# EFS; `mcp_stdio` below publishes the server block, which carries only the PATH
# to that store. No secret ever lands in openclaw.json, so a reprovision can
# rebuild the block from the registry alone (exactly why mcp_remote exists).
#
# QUICKBOOKS_TOKEN_STORE_PATH is read BEFORE dotenv loads (their
# quickbooks-client.ts:28), so it only takes effect from the host process env —
# i.e. this env block. Setting it inside the store file itself is inert.
quickbooks:
  display_name: QuickBooks
  acquisition: direct_oauth
  actor: mcp
  refresh_owner: actor
  custody_migratable: true
  refresh_window_s: 600
  environments: [local, dev, prod]
  oauth:
    authorization_url: "https://appcenter.intuit.com/connect/oauth2"
    token_url: "https://oauth.platform.intuit.com/oauth2/v1/tokens/bearer"
    # Intuit's token endpoint takes the client over HTTP Basic, not a posted
    # secret — every example in their OAuth doc is
    # `Authorization: Basic base64(client_id + ":" + client_secret)`.
    token_endpoint_auth_method: client_secret_basic
    platform_app: quickbooks
    scopes: ["com.intuit.quickbooks.accounting"]
    scope_separator: " "
    pkce: false
  mcp_stdio:
    key: quickbooks
    command: /usr/local/bin/lightbulb-quickbooks-mcp
    args: []
    token_store_env: QUICKBOOKS_TOKEN_STORE_PATH
  wiring:
    materializer: qbo_dotenv

# Microsoft 365 via Microsoft Graph — ONE Lightbulb-owned multi-tenant Entra app
# (platform-oauth/microsoft365), so any work/school account connects with no
# per-customer app. `common` admits work/school AND personal (Outlook.com)
# accounts; the app registration's signInAudience must match
# (AzureADandPersonalMicrosoftAccount). Personal accounts all carry tid
# 9188040d-6c67-4c5b-b112-36a304b66dad.
# Delegated, read-only scopes, none of which require tenant admin consent.
#
# refresh_owner: backend — Microsoft rotates the refresh token on every refresh,
# so exactly one party may hold it, and it is the backend (Secrets Manager). The
# runtime never sees the refresh grant: backend_only keeps it out of every
# profile, and the per-turn broker (routers/runtime_rpc.runtime_credentials)
# vends a fresh access token as MCP_MICROSOFT365_ACCESS_TOKEN for the agent's
# curl calls to graph.microsoft.com. Disconnect deletes the secret + row, which
# is also what stops the broker vending it.
microsoft365:
  display_name: Microsoft 365
  browser_domains: [microsoft.com, microsoftonline.com, office.com, live.com, outlook.com, sharepoint.com]
  acquisition: direct_oauth
  actor: skill
  refresh_owner: backend
  oauth:
    authorization_url: "https://login.microsoftonline.com/common/oauth2/v2.0/authorize"
    token_url: "https://login.microsoftonline.com/common/oauth2/v2.0/token"
    scopes: ["offline_access", "openid", "profile", "email", "User.Read", "Mail.Read", "Calendars.Read", "Files.Read.All"]
    scope_separator: " "
    platform_app: microsoft365
  validate: { method: GET, url: "https://graph.microsoft.com/v1.0/me" }
  wiring:
    backend_only: true
