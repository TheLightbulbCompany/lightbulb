        codesign -d --entitlements - "$AB" 2>/dev/null | grep -q "com.apple.security" \
          && { echo "agent-browser must carry no entitlements" >&2; exit 1; }
        codesign -d --verbose=2 "$AB" 2>&1 | grep -q "flags=.*runtime" \
          || { echo "agent-browser must use the hardened runtime" >&2; exit 1; }
        VERSION="0.4.${{ github.run_number }}"
        DMG="Lightbulb_${VERSION}_aarch64.dmg"
        TAG="desktop-v${VERSION}"
        # Build the DMG by mounting a scratch image under $RUNNER_TEMP, NOT under
        # /Volumes. Tauri's bundle_dmg.sh (and a plain `hdiutil create -srcfolder`)
        # mount at /Volumes/<name>, which a self-hosted runner can't write to
        # without Full Disk Access. Mounting at an explicit path under $RUNNER_TEMP
        # sidesteps that TCC wall. ditto (not makehybrid) is required because a
        # shell-script binary's code signature lives in extended attributes, which
        # makehybrid drops -> notarization rejects the DMG as "not signed".
        RW="$RUNNER_TEMP/lightbulb_rw.dmg"
        MNT="$RUNNER_TEMP/lightbulb_dmgmnt"
        rm -f "$RW" "$DMG"; rm -rf "$MNT"; mkdir -p "$MNT"
        SIZE_MB=$(( $(du -sm "$APP" | cut -f1) + 200 ))
        hdiutil create -size "${SIZE_MB}m" -fs HFS+ -volname "Lightbulb" "$RW"
        hdiutil attach "$RW" -nobrowse -mountpoint "$MNT"
        ditto "$APP" "$MNT/Lightbulb.app"
        ln -s /Applications "$MNT/Applications"
        hdiutil detach "$MNT" -force
        hdiutil convert "$RW" -format UDZO -o "$DMG"
        rm -f "$RW"; rm -rf "$MNT"
        # Sign, notarize, staple the DMG (the .app inside is already notarized+stapled).
        codesign --force --timestamp --keychain "$KEYCHAIN_PATH" --sign "$SIGN_ID" "$DMG"
        xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
        xcrun stapler staple "$DMG"
        # Upload to the release tauri-action created (still a draft at this point).
        gh release upload "$TAG" "$DMG" --repo TheLightbulbCompany/lightbulb --clobber
        echo "Published $DMG to $TAG"
      env:
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Publish draft release
      run: gh release edit "desktop-v0.4.${{ github.run_number }}" --repo TheLightbulbCompany/lightbulb --draft=false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    # Persistent runner: never leave the Apple signing key on disk between runs.
    - name: Clean up signing keychain
      if: always()
      run: security delete-keychain "$RUNNER_TEMP/lightbulb-build.keychain-db" || true
