name: Desktop App Build

# Two release tracks, one workflow:
#   desktop-dev-v*  → dev build (points at dev.isol8.co). Internal smoke testing.
#   desktop-v*      → prod build (points at isol8.co).    Public distribution.
# Both cut a draft GitHub release with DMGs attached; approve + publish
# manually to make it visible.
#
# Apple Silicon only. We dropped the x86_64 leg because:
#   - GitHub is deprecating macos-13 Intel runners; queues had hit 1h+ on
#     desktop-dev-v0.2.6 with no runner assignment.
#   - >90% of new Mac users are Apple Silicon.
# `matrix.include` is kept (single entry) so the per-arch step
# parameterization stays in place if we ever re-add a second arch
# (likely via cross-compile from macos-15 rather than a separate runner).
#
# macos-15 over macos-latest: actions/runner-images#12482 — macos-14's
# hdiutil bundler hangs ~10min then fails since the 2025-06-19 Provisioner
# bump. Universal DMG (--target universal-apple-darwin) is not a path:
# tauri-apps/tauri#12160 closed as not-planned.
on:
  push:
    tags:
      - 'desktop-v*'
      - 'desktop-dev-v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: macos-15
            rust-target: aarch64-apple-darwin

    runs-on: ${{ matrix.runs-on }}
    # tauri-action creates a draft release + uploads artifacts via the
    # GitHub REST API using GITHUB_TOKEN. Default token is read-only
    # for contents; grant write so create-release doesn't 403. Kept
    # idempotent on tagName so a future second matrix leg can attach
    # to the same draft release without reorganizing this job.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # pnpm version governed by the root package.json#packageManager field
      # (pnpm@9.15.0). Pinning a second time here triggers
      # ERR_PNPM_BAD_PM_VERSION when the two disagree.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      # Cache cargo registry/git + apps/desktop/src-tauri/target across
      # builds. Tauri pulls ~300 transitive crates; without this the
      # release compile rebuilds them every run (~15-20min of the
      # Tauri build step). With the cache, second+ builds on the same
      # Cargo.lock skip that work entirely.
      #
      # `workspaces:` matches Cargo.toml location so the action knows
      # which target/ to cache. `key:` includes the matrix rust-target
      # so arm64 and x64 builds don't collide.
      - name: Cache Rust target dir
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: ${{ matrix.rust-target }}
          shared-key: desktop

      - name: Install dependencies
        run: pnpm install

      # Tag prefix decides which environment endpoints the bundle
      # points at. Keeps one workflow, two outputs.
      - name: Resolve target environment
        id: env
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/desktop-dev-v* ]]; then
            echo "target_env=dev" >> "$GITHUB_OUTPUT"
            echo "frontend_url=https://dev.isol8.co/chat" >> "$GITHUB_OUTPUT"
            echo "callback_url=https://dev.isol8.co/auth/desktop-callback" >> "$GITHUB_OUTPUT"
            echo "release_name=Isol8 Desktop [DEV] ${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/tags/desktop-v* ]]; then
            echo "target_env=prod" >> "$GITHUB_OUTPUT"
            echo "frontend_url=https://isol8.co/chat" >> "$GITHUB_OUTPUT"
            echo "callback_url=https://isol8.co/auth/desktop-callback" >> "$GITHUB_OUTPUT"
            echo "release_name=Isol8 Desktop ${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            # workflow_dispatch or future branch push — default to dev
            # so we never accidentally ship a prod-pointing binary from
            # a non-tag trigger.
            echo "target_env=dev" >> "$GITHUB_OUTPUT"
            echo "frontend_url=https://dev.isol8.co/chat" >> "$GITHUB_OUTPUT"
            echo "callback_url=https://dev.isol8.co/auth/desktop-callback" >> "$GITHUB_OUTPUT"
            echo "release_name=Isol8 Desktop [DEV] dispatch" >> "$GITHUB_OUTPUT"
          fi

      - name: Patch tauri.conf.json for ${{ steps.env.outputs.target_env }}
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          TAURI_CFG="apps/desktop/src-tauri/tauri.conf.json"
          # Patch URLs for the target environment. Both dev and prod sign +
          # notarize with the same Developer ID Application cert (Team
          # WZX4U3C22Y) — tauri-action imports it from APPLE_CERTIFICATE
          # below. See apps/desktop/SIGNING.md for the one-time secret
          # setup.
          #
          # The updater endpoint is also env-specific: dev builds poll
          # dev.isol8.co/api/desktop/update; prod builds poll isol8.co.
          # Each endpoint queries GitHub Releases under the corresponding
          # tag prefix (`desktop-dev-v*` vs `desktop-v*`) and returns a
          # Tauri-compatible manifest. See apps/frontend/src/app/api/desktop/update/.
          #
          # dev.isol8.co is gated by Vercel deployment protection.
          # Tauri's updater is a plain HTTPS client and can't do the
          # interactive Vercel auth dance, so the GET 401s and the
          # update check fails. Append Vercel's documented bypass query
          # param so the request walks past protection. Leaking the
          # token from `strings` on the DMG is OK here because the
          # endpoint only returns public GitHub Release manifest data
          # (the same URLs github.com serves anonymously). Prod
          # (isol8.co) has no deployment protection — no bypass needed.
          UPDATE_HOST="${{ steps.env.outputs.frontend_url == 'https://dev.isol8.co/chat' && 'https://dev.isol8.co' || 'https://isol8.co' }}"
          UPDATE_URL="${UPDATE_HOST}/api/desktop/update/{{target}}/{{current_version}}"
          if [[ "$UPDATE_HOST" == "https://dev.isol8.co" ]]; then
            UPDATE_URL="${UPDATE_URL}?x-vercel-protection-bypass=${VERCEL_AUTOMATION_BYPASS_SECRET}&x-vercel-set-bypass-cookie=true"
          fi
          jq --arg url "${{ steps.env.outputs.frontend_url }}" \
             --arg updateUrl "$UPDATE_URL" '
            .build.devUrl = $url |
            .build.frontendDist = $url |
            .app.windows[0].url = $url |
            .plugins.updater.endpoints = [$updateUrl]
          ' "$TAURI_CFG" > "$TAURI_CFG.new"
          mv "$TAURI_CFG.new" "$TAURI_CFG"
          echo "Patched tauri.conf.json:"
          jq '{devUrl: .build.devUrl, frontendDist: .build.frontendDist, windowUrl: .app.windows[0].url, signingIdentity: .bundle.macOS.signingIdentity, updaterEndpoints: .plugins.updater.endpoints}' "$TAURI_CFG"

      # Vendor Node.js + pinned `openclaw` npm package for the matrix
      # arch only (single arch today; matrix scaffolding kept for later).
      - name: Vendor browser sidecar (${{ matrix.rust-target }})
        run: bash apps/desktop/src-tauri/scripts/vendor-sidecars.sh ${{ matrix.rust-target }}

      # We import the Developer ID Application cert ourselves (rather
      # than letting tauri-action do it) because we need the cert in
      # the keychain BEFORE tauri-action runs, so we can pre-sign the
      # vendored native modules under bin/openclaw-host-*/node_modules
      # in the next step. tauri-action then uses the same keychain
      # for its own signing of the outer .app + DMG.
      - name: Set up signing keychain
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/isol8-build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERT_PATH="$RUNNER_TEMP/cert.p12"

          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          # Prepend our keychain to the user search list (existing
          # keychains are preserved so codesign can still find system roots).
          security list-keychain -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychain -d user | tr -d '" \t')
          # Grant codesign/security tools access without an interactive
          # password prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          rm -f "$CERT_PATH"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "Identity in keychain:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      # Apple's notary rejects bundles containing any unsigned Mach-O.
      # Tauri signs the outer .app + the binaries it produces itself,
      # but the vendored openclaw npm package ships prebuilt-unsigned
      # native code under node_modules/ — both files with predictable
      # extensions (.node / .dylib / .so) AND bare-name executables
      # like @lydell/node-pty's `spawn-helper`. Detect every Mach-O
      # via `file` rather than extension-matching, then sign each one
      # with the same Developer ID + hardened runtime + secure timestamp.
      # Each `codesign --timestamp` round-trips Apple's RFC3161 timestamp
      # server (per-file network call). Running serially this took ~6min
      # for ~50 Mach-Os in the bundle. Running 8 in parallel via xargs
      # collapses that to ~1min because the timestamp RTT dominates.
      #
      # The bundled `node-*-apple-darwin` binary runs V8, which
      # allocates JIT pages via pthread_jit_write_protect_np().
      # Under hardened runtime, that call SIGTRAPs unless the
      # binary carries com.apple.security.cs.allow-jit. Other
      # Mach-Os in the bundle (helper executables, .node addons,
      # .dylibs) don't run V8 themselves — they get loaded INTO
      # node — so they inherit node's JIT permission and don't
      # need the entitlement on their own signatures.
      - name: Pre-sign embedded native modules
        run: |
          set -euo pipefail
          export SIGN_ID="Developer ID Application: Prasiddha Parthsarthy (WZX4U3C22Y)"
          export NODE_ENTITLEMENTS="$PWD/apps/desktop/src-tauri/entitlements-node.plist"
          BIN_ROOT="apps/desktop/src-tauri/bin"

          # Two-pass to find Mach-Os fast:
          # Pass 1 (filename pattern, ~1s): find native-binary
          #   candidates by extension/name. bin/ has ~50k post-npm
          #   files; running `file -b` per entry forks 50k
          #   subprocesses and dominated the original step's runtime.
          #   Pattern catches a superset (~30 files) including
          #   Linux/Windows binaries npm ships in cross-platform
          #   prebuilt addons (koffi/linux_ia32, @snazzah/davey-
          #   linux-x64-gnu, etc.).
          # Pass 2 (`file -b` on those ~30, ~30ms): keep only true
          #   Mach-O. Codesigning the non-Darwin ones would just
          #   error.
          # Patterns:
          #   *.node      — native NAPI/N-API addons
          #   *.dylib     — shared libs (sqlite-vec etc.)
          #   *.so        — fallback ext (rare on Darwin)
          #   spawn-helper — @lydell/node-pty's bare-name helper
          #   node-*-apple-darwin — our vendored Node runtime
          # If we ever add a new bundled bare-name Darwin binary
          # that notary rejects unsigned, add it to the Pass-1
          # pattern list.
          CANDIDATES=$(mktemp)
          MACHO_LIST=$(mktemp)
          find "$BIN_ROOT" \( \
            -name '*.node' -o \
            -name '*.dylib' -o \
            -name '*.so' -o \
            -name 'spawn-helper' -o \
            -name 'node-*-apple-darwin' \
          \) -type f -print0 > "$CANDIDATES"
          while IFS= read -r -d '' f; do
            if file -b "$f" | grep -q "Mach-O"; then
              printf '%s\0' "$f" >> "$MACHO_LIST"
            fi
          done < "$CANDIDATES"
          rm -f "$CANDIDATES"
          MACHO_COUNT=$(tr -dc '\0' < "$MACHO_LIST" | wc -c | tr -d ' ')
          echo "Found $MACHO_COUNT Mach-O binaries to sign under $BIN_ROOT."

          # Worker called once per Mach-O. Applies the JIT entitlement
          # plist only to the V8-running node binary; everything else
          # signs with no entitlements. ${ENT_ARGS[@]+...} guards the
          # empty-array expansion under bash 3.2 + set -u (default on
          # macOS runners).
          cat > /tmp/sign-one.sh <<'WORKER'
          #!/usr/bin/env bash
          set -euo pipefail
          f="$1"
          ENT_ARGS=()
          case "$(basename "$f")" in
            node-*-apple-darwin)
              ENT_ARGS=(--entitlements "$NODE_ENTITLEMENTS")
              ;;
          esac
          codesign --force --options runtime --timestamp \
            ${ENT_ARGS[@]+"${ENT_ARGS[@]}"} \
            --sign "$SIGN_ID" --keychain "$KEYCHAIN_PATH" "$f"
          WORKER
          chmod +x /tmp/sign-one.sh

          # -P 8 = 8 parallel codesigns. The bottleneck is Apple's
          # timestamp server RTT (~1-2s/file). Higher parallelism
          # risks rate limiting. -n 1 = one file per worker for clean
          # error attribution.
          xargs -0 -P 8 -n 1 /tmp/sign-one.sh < "$MACHO_LIST"
          rm -f "$MACHO_LIST"

      - name: Build desktop app (${{ matrix.rust-target }})
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: apps/desktop
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ steps.env.outputs.release_name }}
          releaseDraft: true
          prerelease: true
          args: --target ${{ matrix.rust-target }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD are
          # intentionally NOT passed here — we set up the keychain in
          # the earlier step so we could also pre-sign nested native
          # modules. tauri-action sees no APPLE_CERTIFICATE and skips
          # its own keychain setup; codesign then uses our keychain
          # via the user search list.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Tauri updater bundle signing (separate from Apple code
          # signing). When createUpdaterArtifacts:true is set in
          # tauri.conf.json and these env vars are present, tauri-action
          # emits Isol8_<ver>_<arch>.app.tar.gz + a matching .sig
          # signed with the minisign-format Ed25519 key. The .sig content
          # is what the updater endpoint embeds in its manifest; client-
          # side verification uses the pubkey baked into tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          ISOL8_CALLBACK_URL: ${{ steps.env.outputs.callback_url }}
