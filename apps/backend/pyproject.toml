[project]
name = "isol8-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2,<0.143.0",
    "starlette>=0.47.2",
    "uvicorn>=0.54.0,<1.0.0",
    "pydantic[email]>=2.13.5,<3.0.0",
    "pydantic-settings>=2.15.0",
    "python-dotenv==1.2.4",
    "python-multipart>=0.0.32",
    "cryptography>=46.0.5,<47.0.0",
    "httpx>=0.28.0,<0.29.0",
    # bedrock-agentcore-control CreateAgentRuntime.filesystemConfigurations (EFS per runtime) needs >= 1.43.95.
    "boto3>=1.43.108",
    "PyJWT[crypto]>=2.14.0",
    "stripe>=14.4.1",
    "websockets>=12.0",
    "python-ulid>=3.1.0",
    "pyyaml>=6.0.3",
    "posthog>=3.5.0,<6.0.0",
    # Enforces the vendored OpenClaw config JSON Schema on every openclaw.json
    # write (core/services/config_schema.py). Draft 2020-12 support is required
    # — that is what zod's toJSONSchema emits.
    "jsonschema>=4.21.0,<5.0.0",
    # Apple's own App Store Server library — StoreKit JWS verification (x5c
    # chain building + root pinning). See core/services/apple_iap.py for why
    # this is not hand-rolled on the PyJWT we already have.
    "app-store-server-library>=3.1.2,<4.0.0",
    "awslambdaric>=4.1.0",
    "metadata-parser>=2.0.0,<3",
    # Public Suffix List for website sign-ins (website_logins.site_of): bundled snapshot only.
    "tldextract>=5.4.0,<6",
    "pillow>=12.3.0",
    "livekit-api>=1.2.1",
    "mcp>=2.3.0,<3",
    # core/services/meeting_invites.py: recurring calendar series (RRULE/EXDATE).
    "python-dateutil>=2.9.0",
    "livekit>=1.1.20",
    "psycopg[binary]>=3.3.6",
    "a2a-sdk[signing]>=1.3.0",
    "temporalio>=1.11,<2",
]

[project.optional-dependencies]
# scripts/speak_gate_bench only: fetches the AMI split of ishiki-labs/multi-party-dialogue.
bench = ["huggingface_hub>=0.24,<1"]

[tool.uv]
dev-dependencies = [
    "pytest==8.0.2",
    "pytest-asyncio==0.23.5",
    "pytest-cov==4.1.0",
    "pytest-mock==3.12.0",
    "pytest-xdist==3.6.1",
    "factory-boy==3.3.0",
    "respx==0.20.2",
    "schemathesis>=3.28.0",
    "ruff>=0.8.0",
    "pre-commit>=3.0.0",
    "moto[dynamodb]>=5.1.22",
    "hypothesis>=6.100.0",
    # apps/infra/lambda/ses-inbound's tests run in this env (backend.yml).
    "dkimpy==1.1.8",
]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "real_background_workers: run the real lifespan sweepers (tests/conftest.py stubs them by default)",
]
