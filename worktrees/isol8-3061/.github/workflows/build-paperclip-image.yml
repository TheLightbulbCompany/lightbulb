name: build-paperclip-image
on:
  push:
    branches:
      - main
    paths:
      - "apps/infra/paperclip-extended/Dockerfile"
      - "paperclip-version.json"
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write
  packages: read

jobs:
  build-and-push:
    name: Build and push extended Paperclip image
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ vars.CI_RUNNER }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # `soci convert` builds its ztocs under /tmp on the root volume while
      # BOTH the docker overlay2 copy and the containerd copy of the image are
      # already resident, so peak usage is several times the 1.5 GB pushed
      # size. A hosted runner starts with ~14 GB free and that was not enough:
      # run 31560625232 failed with "no space left on device" mid-ztoc. The
      # `Reclaim container storage` step at the end of this job cannot help —
      # it runs AFTER the convert. Free the space up front instead.
      #
      # Hosted-only, and the guard is not cosmetic: these are paths of the
      # GitHub-hosted Ubuntu image. `rm -rf`-ing them on the self-hosted box
      # would delete real, persistent host toolchains rather than a VM that is
      # about to be discarded. The box has the disk this step exists to free.
      - name: Reclaim disk
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/.ghcup /usr/local/share/powershell \
                      /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Read version metadata
        id: meta
        run: |
          IMAGE=$(node -p "require('./paperclip-version.json').extendedImage")
          # The base digest is the SINGLE SOURCE in paperclip-version.json#upstream;
          # pass it to the Dockerfile as a build-arg so its FROM can't drift from
          # the digest we tag + deploy against. Otherwise a JSON-only bump would
          # publish an image labeled for the new upstream but built from the old.
          UPSTREAM_IMAGE=$(node -p "require('./paperclip-version.json').upstream")
          # Base is pinned by digest, so derive a human tag from the upstream
          # commit + our repo commit (the upstream `:tag` scheme used by
          # openclaw-version.json doesn't apply to a digest pin).
          UPSTREAM_COMMIT=$(node -p "require('./paperclip-version.json').upstreamCommit.slice(0,8)")
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          TAG="${UPSTREAM_COMMIT}-${SHORT_SHA}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "upstream_image=${UPSTREAM_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "Building ${IMAGE}:${TAG} FROM ${UPSTREAM_IMAGE}"

      - name: Authenticate Via OIDC Role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          role-duration-seconds: 1800
          role-skip-session-tagging: true
          role-to-assume: arn:aws:iam::877352799272:role/lightbulb-openclaw-image-builder

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      # The base (paperclip-version.json#upstream) is now the Isol8 Paperclip
      # fork on GHCR — a private package this repo must be granted read access to
      # (org Packages -> paperclip -> Manage Actions access -> add TheLightbulbCompany/lightbulb).
      # The build below pulls it via FROM, so authenticate to GHCR first.
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build \
            --build-arg UPSTREAM_IMAGE="${{ steps.meta.outputs.upstream_image }}" \
            -t "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}" \
            apps/infra/paperclip-extended/

      # We deliberately do NOT `docker push` here. The ECR repo has tag
      # immutability enabled and the SOCI v2 step below pushes the SOCI-enabled
      # manifest under the same tag — a single ECR push, no immutability conflict.

      - name: Set up containerd
        uses: crazy-max/ghaction-setup-containerd@v3

      - name: Convert image to SOCI v2 and push
        env:
          SOCI_VERSION: "0.13.0"
          NERDCTL_VERSION: "2.2.2"
          IMAGE_REF: "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}"
        # Fargate refuses SOCI Index Manifest v1 for accounts new to SOCI, so we
        # build a v2 SOCI-enabled image and push that as the only push for the tag.
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/awslabs/soci-snapshotter/releases/download/v${SOCI_VERSION}/soci-snapshotter-${SOCI_VERSION}-linux-amd64-static.tar.gz" \
            | sudo tar -xz -C /usr/local/bin/ soci
          sudo chmod +x /usr/local/bin/soci

          curl -sSL "https://github.com/containerd/nerdctl/releases/download/v${NERDCTL_VERSION}/nerdctl-${NERDCTL_VERSION}-linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin/ nerdctl
          sudo chmod +x /usr/local/bin/nerdctl

          ECR_PASSWORD=$(aws ecr get-login-password --region us-east-1)
          REGISTRY="$(echo "${IMAGE_REF}" | cut -d/ -f1)"
          echo "${ECR_PASSWORD}" | sudo nerdctl login --username AWS --password-stdin "${REGISTRY}"

          docker save "${IMAGE_REF}" | sudo nerdctl image load

          sudo soci convert --platform linux/amd64 "${IMAGE_REF}" "${IMAGE_REF}-soci-staging"
          sudo nerdctl rmi "${IMAGE_REF}" || true
          sudo nerdctl tag "${IMAGE_REF}-soci-staging" "${IMAGE_REF}"

          sudo nerdctl push --platform linux/amd64 "${IMAGE_REF}"

      # Load-bearing again now that this job runs on the self-hosted box: the
      # container stores there are NOT discarded at job end, so the three
      # copies the SOCI path leaves behind (docker's, plus IMAGE_REF and
      # IMAGE_REF-soci-staging in nerdctl's `default` namespace) accumulate
      # forever, which is what filled the box's disk once already. On hosted
      # runners it is merely harmless. It is still NOT what keeps the convert from running
      # out of space: that is `Reclaim disk` up top, which runs before
      # anything allocates.
      - name: Reclaim container storage
        if: always()
        env:
          IMAGE_REF: "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}"
        run: |
          set -uo pipefail
          sudo nerdctl rmi -f "${IMAGE_REF}" "${IMAGE_REF}-soci-staging" 2>/dev/null || true
          docker image rm -f "${IMAGE_REF}" 2>/dev/null || true
          docker builder prune -af --filter until=168h 2>&1 | tail -2 || true
          echo "disk after reclaim:"
          df -h / | tail -1

      - name: Summary
        run: |
          echo "## Built image" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Bump \`paperclip-version.json#dev.tag\` to \`${{ steps.meta.outputs.tag }}\` in a PR to deploy to dev." >> "$GITHUB_STEP_SUMMARY"
