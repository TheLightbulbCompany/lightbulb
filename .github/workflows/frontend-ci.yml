# =============================================================================
# Frontend CI (PRs only)
# =============================================================================
name: Frontend CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/frontend/**'
      # packages/shared resolves straight to ./src/index.ts with no build step,
      # and the frontend suite exercises it (useAgentChat, useGateway, the Teams
      # run-transcript modules). Without this, a shared-only PR could break the
      # frontend tests and merge with them never having run.
      - 'packages/**'
      - '.github/workflows/frontend-ci.yml'
      - 'pnpm-lock.yaml'

# Supersede in-flight runs for the same PR. `github.ref` is refs/pull/<n>/merge
# here (pull_request only), so the group is per-PR and PRs never cancel each
# other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # Per-job install dir. Kept from the self-hosted era, where jobs
          # shared one runner home and raced the default ~/setup-pnpm
          # (ENOTEMPTY on rmdir) when this and mobile-ci fired on the same
          # PR. Harmless on hosted runners; left in place, not load-bearing.
          dest: ${{ runner.temp }}/setup-pnpm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm --filter @isol8/frontend run lint

      - name: Type check
        run: pnpm --filter @isol8/frontend exec tsc --noEmit

      # ~380 jsdom files. vitest.config.ts caps the run at 2 worker threads,
      # which matches the core count of the ubuntu-latest runner a private repo
      # gets; measured peak RSS is well under a gigabyte, so the `test` script's
      # 8 GB heap ceiling never binds. Raising maxThreads means re-measuring.
      - name: Unit tests
        run: pnpm --filter @isol8/frontend run test

      - name: Build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_API_URL: https://api-dev.isol8.co/api/v1
        run: pnpm --filter @isol8/frontend run build
