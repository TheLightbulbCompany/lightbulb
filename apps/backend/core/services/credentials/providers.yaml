# Bucket A — paste-key (no OAuth, no refresh)
linear:
  display_name: Linear
  acquisition: paste_token
  actor: mcp
  refresh_owner: none
  # Linear personal API keys go in a BARE Authorization header (no "Bearer").
  # Linear's GraphQL endpoint requires a POST with a query body; a bare GET
  # rejects valid keys.
  validate: { method: POST, url: "https://api.linear.app/graphql", auth_header: Authorization, auth_scheme: "", body: { query: "{ viewer { id } }" } }
  wiring:
    openclaw_paths:
      - { path: "mcp.servers.linear.env.LINEAR_API_KEY", source: "input.token" }

stripe:
  display_name: Stripe
  acquisition: paste_token
  actor: mcp
  refresh_owner: none
  validate: { method: GET, url: "https://api.stripe.com/v1/account", auth_header: Authorization }
  wiring:
    openclaw_paths:
      - { path: "mcp.servers.stripe.env.STRIPE_SECRET_KEY", source: "input.token" }

# Bucket B — dedicated self-refreshing CLI
google:
  display_name: Google Workspace
  acquisition: direct_oauth
  actor: cli
  refresh_owner: actor
  requires: { bins: [gog] }
  oauth:
    authorization_url: "https://accounts.google.com/o/oauth2/v2/auth"
    token_url: "https://oauth2.googleapis.com/token"
    scopes: ["https://www.googleapis.com/auth/gmail.modify", "https://www.googleapis.com/auth/calendar", "https://www.googleapis.com/auth/drive"]
    scope_separator: " "
    pkce: true
    extra_authorize_params: { access_type: offline, prompt: consent }
  wiring:
    materializer: gog_keyring
