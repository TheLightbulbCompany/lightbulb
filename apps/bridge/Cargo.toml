[package]
name = "lightbulb-bridge"
version = "0.1.0"
edition = "2021"
rust-version = "1.91" # the engine's (iroh 1.4)
publish = false

[dependencies]
lightbulb-connect = { git = "https://github.com/TheLightbulbCompany/lightbulb-connect", rev = "eb1d39d" }
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-dynamodb = "1"
aws-sdk-s3 = "1"
aws-sdk-secretsmanager = "1"
axum = "0.8"
data-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
ulid = "3"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[dev-dependencies]
tempfile = "3"
