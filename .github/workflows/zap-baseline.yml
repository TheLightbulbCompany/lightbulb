# =============================================================================
# Weekly OWASP ZAP baseline against api-dev (observation only)
# =============================================================================
# A PASSIVE, unauthenticated scan: ZAP spiders briefly and only inspects the
# responses (headers, TLS, cookies, info leaks). It sends no attack payloads.
# Passive-only on purpose: people and real agents use dev, and the API Gateway
# stage throttles at 100 burst / 50 rps. An active scan is a separate owner
# decision.
#
# /api/v1/public/* is unauthenticated and everything else 401s, so expect the
# baseline to exercise mostly headers, TLS and the public routes.
#
# Never a red check (fail_action: false). Findings land in ONE GitHub issue the
# action files and updates. Known-noise alert ids are in .zap/rules.tsv.
name: ZAP Baseline

on:
  schedule:
    - cron: '17 7 * * 1' # Mondays 07:17 UTC = Sunday night US time
  workflow_dispatch:

concurrency:
  group: zap-baseline
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  baseline:
    runs-on: ${{ vars.CI_RUNNER }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: https://api-dev.thelightbulb.company
          rules_file_name: .zap/rules.tsv
          allow_issue_writing: true
          fail_action: false
