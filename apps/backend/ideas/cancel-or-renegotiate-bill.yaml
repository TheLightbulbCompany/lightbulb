guide: |
  # One recurring bill cancelled or renegotiated, saving reported

  ## Steps
  1. List recurring charges from the bank, card, Stripe or email receipts. Ask the person to connect one if none is.
  2. Pick the best candidate: unused, duplicated, or priced above the market.
  3. Find the vendor's cancel path or a cheaper plan. Draft the cancel or the negotiation email.
  4. Ask for approval, then act: send from your mailbox or cancel in the live browser (the person signs in).
  5. Confirm the change in writing from the vendor.

  ## Decisions to ask
  - Which bill to act on.
  - Approve the cancel or the new price.

  ## Done proves
  - The vendor's confirmation, and the saving per month or year posted to the feed.

  ## Honesty limits
  - Report the saving the vendor confirmed, not an estimate.
