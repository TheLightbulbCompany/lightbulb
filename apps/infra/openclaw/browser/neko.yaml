legacy: false

server:
  bind: "0.0.0.0:6081"
  static: "/var/www/neko"
  path_prefix: "/api/v1/browser-view/webrtc"
  proxy: true
  pprof: false
  metrics: false

member:
  provider: "noauth"

session:
  implicit_hosting: true
  merciful_reconnect: true
  cookie:
    enabled: true
    expiration: "15m"
    secure: true
    http_only: true
    path: "/api/v1/browser-view/webrtc"

desktop:
  display: ":1"
  input:
    enabled: false
  upload_drop: false
  file_chooser_dialog: false

capture:
  video:
    display: ":1"
    codec: "vp8"
    ids: ["browser"]
    pipelines:
      browser:
        fps: 24
        gst_encoder: "vp8enc"
        gst_params:
          target-bitrate: 1800000
          cpu-used: 4
          end-usage: "cbr"
          threads: 2
          deadline: 1
          keyframe-max-dist: 24
  audio:
    codec: "opus"
    device: "audio_output.monitor"
  screencast:
    enabled: false
  webcam:
    enabled: false
  microphone:
    enabled: false
  broadcast:
    url: ""
    autostart: false

webrtc:
  icelite: true
  icetrickle: true
  udpmux: 59000
  tcpmux: 59000
