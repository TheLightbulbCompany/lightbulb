# Bucket A — paste-key (no OAuth, no refresh)
stripe:
  display_name: Stripe
  acquisition: paste_token
  actor: mcp
  refresh_owner: none
  validate: { method: GET, url: "https://api.stripe.com/v1/account", auth_header: Authorization }
  # Exact-pinned package: an unversioned spec makes npx re-resolve `latest` from
  # the registry on every catalog rebuild, which is the bulk of the 13s+ cold
  # start that blew the default 30s MCP connect timeout on 0.5-vCPU containers.
  wiring:
    mcp_server: { key: stripe, command: npx, args: ["-y", "@stripe/mcp@0.3.3", "--tools=all"], env: { STRIPE_SECRET_KEY: input.token } }

# Bucket B — dedicated self-refreshing CLI
google:
  display_name: Google Workspace
  acquisition: direct_oauth
  actor: cli
  refresh_owner: actor
  # BYO-only: no Isol8-managed Google app. Every owner connects with their own
  # OAuth app and owns its Limited-Use compliance. Visible to all; the connect
  # path requires a stored app.
  byo_required: true
  byo_setup_url: "https://console.cloud.google.com/apis/credentials"
  requires: { bins: [gog] }
  oauth:
    authorization_url: "https://accounts.google.com/o/oauth2/v2/auth"
    token_url: "https://oauth2.googleapis.com/token"
    scopes: ["https://www.googleapis.com/auth/gmail.modify", "https://www.googleapis.com/auth/calendar", "https://www.googleapis.com/auth/drive"]
    scope_separator: " "
    pkce: true
    extra_authorize_params: { access_type: offline, prompt: consent }
  wiring:
    materializer: gog_cli

# Bucket A — paste-key mcp_server integrations (full access is the chosen default)
# Slack is NOT a paste-token MCP integration: agent Slack actions come from the
# OpenClaw bundled `slack` channel tool (react/pin/files/read/post), which reuses
# the Slack CHANNEL's bot token (set up in the Channels tab). The old
# slack-mcp-server integration (a separate `xoxp-` user token) was redundant with
# that tool and is removed; Slack lives in the Channels tab, not Integrations.

# Bucket B variant — REMOTE, OAuth-protected hosted MCP (see Attio below for the
# mcp_oauth rail mechanics). Notion hosts its own MCP and is deprecating the local
# `@notionhq/notion-mcp-server` npx server, so the integration rides the hosted
# endpoint instead of a stdio paste-token process. Notion's auth server advertises
# NO granular scopes — access is governed by which pages the owner shares with the
# integration on the consent screen — so the only scope requested is
# offline_access (to obtain a refresh token); the server round-trips it harmlessly.
notion:
  display_name: Notion
  acquisition: direct_oauth
  actor: mcp
  refresh_owner: actor
  oauth:
    authorization_url: "https://mcp.notion.com/authorize"
    token_url: "https://mcp.notion.com/token"
    registration_url: "https://mcp.notion.com/register"
    scopes: ["offline_access"]
    scope_separator: " "
    pkce: true
  mcp_remote:
    key: notion
    url: "https://mcp.notion.com/mcp"
    transport: streamable-http
  wiring:
    materializer: mcp_oauth

# Bucket B variant — REMOTE, OAuth-protected hosted MCP. Sentry recommends its
# hosted MCP over the local npx server. Its auth server exposes one read scope
# (org:read); the others are write-only (project/team/event:write), so a
# read-focused integration requests just org:read.
sentry:
  display_name: Sentry
  acquisition: direct_oauth
  actor: mcp
  refresh_owner: actor
  oauth:
    authorization_url: "https://mcp.sentry.dev/oauth/authorize"
    token_url: "https://mcp.sentry.dev/oauth/token"
    registration_url: "https://mcp.sentry.dev/oauth/register"
    scopes: ["org:read"]
    scope_separator: " "
    pkce: true
  mcp_remote:
    key: sentry
    url: "https://mcp.sentry.dev/mcp"
    transport: streamable-http
  wiring:
    materializer: mcp_oauth

# Bucket B variant — REMOTE, OAuth-protected hosted MCP. Linear recommends its
# hosted MCP over the local npx server. Its auth server exposes coarse read/write
# scopes; a read-focused integration requests just `read`.
linear:
  display_name: Linear
  acquisition: direct_oauth
  actor: mcp
  refresh_owner: actor
  oauth:
    authorization_url: "https://mcp.linear.app/authorize"
    token_url: "https://mcp.linear.app/token"
    registration_url: "https://mcp.linear.app/register"
    scopes: ["read"]
    scope_separator: " "
    pkce: true
  mcp_remote:
    key: linear
    url: "https://mcp.linear.app/mcp"
    transport: streamable-http
  wiring:
    materializer: mcp_oauth

# Bucket B variant — `gh` CLI + github/gh-issues skills are baked into the OpenClaw
# image, so GitHub rides the materializer rail (gh's own hosts.yml on EFS), not
# mcp_server. A bad PAT answers 401, so status-based validate suffices; the pinned
# API-version header rides every call. refresh_owner: none — the PAT is a paste key
# retained in Secrets Manager.
github:
  display_name: GitHub
  acquisition: paste_token
  actor: cli
  refresh_owner: none
  requires: { bins: [gh] }
  validate: { method: GET, url: "https://api.github.com/user", auth_header: Authorization, headers: { X-GitHub-Api-Version: "2022-11-28" } }
  wiring:
    materializer: gh_cli

# Bucket B variant — REMOTE, OAuth-protected MCP server. Attio hosts its own MCP
# at an HTTPS endpoint behind OAuth. A headless container owner can't run
# OpenClaw's interactive `openclaw mcp login`, so we drive the OAuth dance from
# the backend (Dynamic Client Registration mints a public PKCE-only client — no
# secret to safeguard) and the mcp_oauth materializer writes the MCP SDK's OAuth
# token file onto EFS + publishes the live mcp.servers.attio block. refresh_owner:
# actor because OpenClaw's in-container OAuthClientProvider auto-refreshes from
# that file. The server key/url/transport live under `mcp_remote` (not the
# mcp_server wiring rail) so the declared rail stays the materializer and the
# exactly-one-of-three wiring invariant holds.
attio:
  display_name: Attio
  acquisition: direct_oauth
  actor: mcp
  refresh_owner: actor
  oauth:
    authorization_url: "https://app.attio.com/oidc/authorize"
    token_url: "https://app.attio.com/oidc/token"
    registration_url: "https://app.attio.com/oauth/register"
    scopes: ["openid", "offline_access", "mcp"]
    scope_separator: " "
    pkce: true
  mcp_remote:
    key: attio
    url: "https://mcp.attio.com/mcp"
    transport: streamable-http
  wiring:
    materializer: mcp_oauth

# Bucket B variant — REMOTE, OAuth-protected hosted MCP (see Attio above for the
# mcp_oauth rail mechanics). Intercom's auth server advertises no granular scopes
# and exposes no resource-metadata document, so the only scope requested is
# offline_access (to obtain a refresh token). Note: Intercom's DCR endpoint
# enforces a redirect-URI allowlist, so the Isol8 callback URL must be registered
# with Intercom before the first connection succeeds.
intercom:
  display_name: Intercom
  acquisition: direct_oauth
  actor: mcp
  refresh_owner: actor
  oauth:
    authorization_url: "https://mcp.intercom.com/authorize"
    token_url: "https://mcp.intercom.com/token"
    registration_url: "https://mcp.intercom.com/register"
    scopes: ["offline_access"]
    scope_separator: " "
    pkce: true
  mcp_remote:
    key: intercom
    url: "https://mcp.intercom.com/mcp"
    transport: streamable-http
  wiring:
    materializer: mcp_oauth

# Bucket A variant — bundled web-search PROVIDER plugin (not an MCP, not a CLI).
# The `parallel` provider ships in the OpenClaw image and exposes a free tier; the
# owner pastes a free Parallel key (par-...) once. The openclaw_paths rail selects
# the provider and writes the key to the path the bundled provider reads
# (tools.web.search.parallel.apiKey). Selecting tools.web.search.provider
# auto-enables the bundled `parallel` plugin (plugin-auto-enable), so no explicit
# enable flag is needed. No validate endpoint: Parallel only exposes /v1/search, so
# the key is checked at first search rather than risk false-rejecting a valid key
# against a guessed request body.
parallel:
  display_name: Parallel (Web Search)
  acquisition: paste_token
  actor: skill
  refresh_owner: none
  wiring:
    openclaw_paths:
      - { path: "tools.web.search.provider", source: "literal:parallel-free" }
      - { path: "tools.web.search.parallel.apiKey", source: "input.token" }

posthog:
  display_name: PostHog
  acquisition: direct_oauth
  actor: mcp
  refresh_owner: actor
  oauth:
    authorization_url: "https://oauth.posthog.com/oauth/authorize/"
    token_url: "https://oauth.posthog.com/oauth/token/"
    registration_url: "https://oauth.posthog.com/oauth/register/"
    # Full PostHog OAuth scope set: openid + every read and write scope the hosted
    # MCP exposes, so all of its tools work and we never re-mint to cover a missing
    # one. The MCP gates each tool's scope dynamically at call time, and its startup
    # identity probe (GET /api/users/@me/) requires user:read — a narrower list 403s.
    # Sourced verbatim from PostHog's published scopes_supported (us.posthog.com
