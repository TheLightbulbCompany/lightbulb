# The bridge (apps/bridge): embedded Lightbulb Connect instances, one per connected workspace.
name: bridge
'on':
  pull_request:
    paths:
    - apps/bridge/**
    - .github/workflows/bridge.yml
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-bridge:
    name: TestBridge
    runs-on: ${{ vars.CI_RUNNER }}
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      with:
        components: rustfmt, clippy
    # The AWS SDK, iroh and aws-lc are minutes to build from cold.
    - name: Cargo cache
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        workspaces: apps/bridge
    - name: Format
      run: cargo fmt --manifest-path apps/bridge/Cargo.toml --check
    - name: Clippy
      run: cargo clippy --manifest-path apps/bridge/Cargo.toml --all-targets --locked -- -D warnings
    - name: Cargo test
      run: cargo test --manifest-path apps/bridge/Cargo.toml --locked
