id: sales-tax-registration
owner_role: finance
kind: agency
business_types: [store, software]
title: "Registered for sales tax where you likely owe it (you confirm)"
why: "Know where you likely have nexus and register before it becomes a penalty. Priced per state."
deliverables:
  - "A nexus check across states from your sales"
  - "Registration forms filled for each state you confirm"
  - "A list of registrations and filing dates"
agency_price_low: 299
agency_price_high: 403
price_unit: state
agency_turnaround: "1-4 weeks per state"
our_turnaround: "A few days per state"
your_part: "Sign each registration and complete the state's identity check"
guide: |
  # Registered for sales tax in each state where you owe it

  ## Steps
  1. Ask in the DM to connect Stripe, Shopify or QuickBooks so you can read sales by state.
  2. Compare sales and transaction counts per state to each state's published threshold. Write the result as a document.
  3. For each state over the threshold, fill the registration in the state portal in the live browser.
  4. Signatures, SSN or EIN entry and identity checks are the person's step.
  5. Record each registration number and its filing frequency and dates.

  ## Decisions to ask
  - Approve the nexus list before any registration.
  - Each registration's submission.

  ## Done proves
  - The registration confirmation per state.
  - A list of filing dates on the task.

  ## Honesty limits
  - Nexus is a tax judgement: the person (or their accountant) decides. Never say "compliant".
  - The price shown is per state.
