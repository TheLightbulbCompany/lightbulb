version: 2
# Weekly, one grouped PR per ecosystem for minor+patch; majors arrive one by one.
updates:
  - package-ecosystem: npm # pnpm workspaces use the npm key
    # Workspace root, the lockfile root outside pnpm-workspace.yaml, and
    # apps/infra, an npm project of its own (package-lock.json).
    directories:
      - /
      - /apps/infra
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: uv
    directories:
      - /apps/backend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    # Library majors are deliberate migrations, not bot merges.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
