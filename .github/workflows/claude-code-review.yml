name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    runs-on: ${{ vars.CI_RUNNER }}
    permissions:
      contents: read
      # write (was read) so the review can actually post inline comments +
      # a summary. The previous config could not post even if it had run.
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # full history (was depth 1) so the PR's merge-base resolves for the diff
          fetch-depth: 0

      - name: Run Claude Code Review
        id: claude_review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Direct review prompt instead of the `/code-review` plugin: the plugin
          # crashed on turn 1 with "Internal error: directory mismatch for
          # tsconfig.json" on every PR (monorepo with many tsconfig.json files),
          # spent $0, reviewed nothing, and the step still reported success —
          # a green check that never looked at a line of the diff.
          prompt: |
            You are reviewing pull request #${{ github.event.pull_request.number }}
            of ${{ github.repository }} as a rigorous senior reviewer.

            Steps:
            1. Run `gh pr diff ${{ github.event.pull_request.number }}` to read the
               full diff, and open the changed files for surrounding context.
            2. Post your findings as a GitHub PR review with inline comments
               anchored to specific lines (via `gh api`), plus ONE short summary
               comment. If there are genuinely no issues, post a one-line summary
               saying the review is clean — never stay silent.

            Review for, in priority order:
            - Correctness: data-shape mismatches (a component reading fields the
              BFF/API or TS types do not actually provide, so it renders
              `undefined`), unguarded array access, missing null/error handling,
              and broken request/response contracts (e.g. a request body whose
              keys the server's schema silently strips).
            - Theme discipline: this app uses a cream/forest editorial theme on
              CSS variables (`--cream --ink --ink-soft --mute --edge --forest
              --danger --warn`). Flag raw hex / `rgba()` literals, shadcn semantic
              classes (`text-muted-foreground`, `bg-accent`, `bg-primary`,
              `border-border`), and ESPECIALLY raw shadcn `Dialog`/`DialogContent`
              used without theme overrides — its default is `bg-black`/white text,
              i.e. a black modal on a cream surface.
            - Missing states: data surfaces lacking loading / empty / error states.
            - Security and obvious performance problems.

            Be concrete: every finding cites `file:line` and the specific fix.
            Do not approve silently — your summary must state what you reviewed.
          # Posts the review's summary as a PR comment so a clean review is
          # visibly confirmed, not a silent green check.
          display_report: true
          # Surface the full execution output so a startup failure (e.g. an
          # expired CLAUDE_CODE_OAUTH_TOKEN or a usage cap) prints its real
          # error instead of the suppressed one-line stub.
          show_full_output: true

      # Fail-loud guard: the action reports `success` even when the agent
      # crashes on turn 1 (is_error=true, $0 spent, nothing reviewed) — a green
      # check that never read the diff. Read the execution output and fail the
      # job when the review did not actually complete, so a broken reviewer is
      # visibly red instead of silently passing.
      - name: Verify the review actually ran
        if: always()
        env:
          REVIEW_OUTCOME: ${{ steps.claude_review.outcome }}
          EXECUTION_FILE: ${{ steps.claude_review.outputs.execution_file }}
        run: |
          set -uo pipefail
          if [ "${REVIEW_OUTCOME}" != "success" ]; then
            echo "::error::Claude review step outcome was '${REVIEW_OUTCOME}', not success."
            exit 1
          fi
          if [ -z "${EXECUTION_FILE:-}" ] || [ ! -f "${EXECUTION_FILE}" ]; then
            echo "::error::Claude review produced no execution output — the review did not run."
            exit 1
          fi
          # Whitespace-strip so the key match is tolerant of pretty-printing.
          compact="$(tr -d ' \n\t\r' < "${EXECUTION_FILE}")"
          if ! printf '%s' "$compact" | grep -q '"type":"result"'; then
            echo "::error::No result message in the execution output — the review never completed a turn."
            exit 1
          fi
          if printf '%s' "$compact" | grep -q '"is_error":true'; then
            echo "::error::Claude review ended with is_error=true — it crashed before reviewing the diff. Most likely an expired CLAUDE_CODE_OAUTH_TOKEN secret or a Claude usage cap. Rotate the token (claude setup-token → gh secret set CLAUDE_CODE_OAUTH_TOKEN) and re-run. See the 'Run Claude Code Review' step log (show_full_output) for the exact error."
            exit 1
          fi
          echo "Claude review completed without error."
