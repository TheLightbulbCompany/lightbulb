# Sign and notarize a published release of the public CLI (TheLightbulbCompany/cli).
#
# The public repo's release.yml ships an unsigned arm64 `lightbulb`. macOS treats every unsigned
# rebuild as a new program, so the Local Network permission is asked again after each update.
# A Developer ID signature with the hardened runtime, notarized, keeps that permission across
# updates. The signing secrets stay in this private repo, so this workflow signs the release
# AFTER it is published and replaces its two assets, then moves the Homebrew formula's sha256.
# It also signs the two Linux assets' `.sha256` with the release key, which exists only on this
# Mac (`~/Library/Application Support/lightbulb-release/release.key`), and uploads the `.sig`s.
#
# Runs by itself every hour: `find` picks the latest CLI release when it has all its assets but
# no Linux `.sig` yet (this workflow's last upload, so a missing one means it was never signed)
# and signs it. v0.9.8 and v0.9.9 shipped unsigned because this was
# a step someone had to remember. By hand: gh workflow run sign-cli-release.yml -f tag=vX.Y.Z
# Runbook: docs/runbooks/sign-cli-release.md.
#
# GitHub-hosted macos-latest on purpose: the self-hosted `macos-desktop` Mac is reserved for
# desktop-build.yml and mobile-release.yml. The keychain and notarization-key steps are
# desktop-build.yml's, verbatim apart from the self-hosted-only comments.
name: sign-cli-release
'on':
  workflow_dispatch:
    inputs:
      tag:
        description: Public CLI release tag to sign (e.g. v0.2.4)
        required: true
        type: string
  schedule:
  - cron: '23 * * * *'
permissions:
  contents: read
concurrency:
  group: sign-cli
  cancel-in-progress: false
env:
  # Same App Store Connect key as desktop-build.yml / the iOS release; IDs are public metadata.
  APPLE_API_KEY: SZ68D5WBR2
  APPLE_API_ISSUER: 7c5f3df2-6cda-46fb-b3d5-2ebbceb1dd0e
  SIGN_ID: 'Developer ID Application: Prasiddha Parthsarthy (WZX4U3C22Y)'
  TEAM_ID: WZX4U3C22Y
  ASSET: lightbulb-macos-arm64.tar.gz
jobs:
  find:
    runs-on: ubuntu-latest # keeps the signing Mac free for desktop builds when there is nothing to sign
    outputs:
      tags: ${{ steps.find.outputs.tags }}
    steps:
    - id: find
      run: |-
        set -euo pipefail
        if [ -n "$INPUT_TAG" ]; then
          jq -cn --arg t "$INPUT_TAG" '[$t]' > tags.json
        else
          # The latest release only: an older unsigned one is superseded, and the brew step fails
          # on purpose for a tag the formula no longer names. 15 minutes old at least, so the
          # public bump-brew has pointed the formula at it.
          UNTIL="$(date -u -d '15 minutes ago' +%Y-%m-%dT%H:%M:%SZ)"
          gh api 'repos/TheLightbulbCompany/cli/releases?per_page=5' | jq -c --arg until "$UNTIL" '
            [ [ .[] | select((.draft or .prerelease) | not) ][0] // empty
              | select(.created_at <= $until)
              | select([.assets[].name] as $a
                  | ($a | index("lightbulb-macos-arm64.tar.gz.sha256"))
                    and ($a | index("lightbulb-linux-arm64.tar.gz.sha256"))
                    and ($a | index("lightbulb-linux-x86_64.tar.gz.sha256"))
                    and (($a | index("lightbulb-linux-arm64.tar.gz.sha256.sig")) | not))
              | .tag_name ]' > tags.json
        fi
        cat tags.json
        echo "tags=$(cat tags.json)" >> "$GITHUB_OUTPUT"
      env:
        INPUT_TAG: ${{ inputs.tag }}
        GH_TOKEN: ${{ github.token }}
  sign:
    needs: find
    if: needs.find.outputs.tags != '[]'
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        tag: ${{ fromJSON(needs.find.outputs.tags) }}
    env:
      TAG: ${{ matrix.tag }}
    runs-on: [self-hosted, macos-desktop] # the native lane; GitHub-hosted macOS is paid for a private repo
    timeout-minutes: 30
    steps:
    - name: Preflight
      run: |-
        set -euo pipefail
        echo "$TAG" | grep -Eqx 'v[0-9]+\.[0-9]+\.[0-9]+' || { echo "::error::tag must look like v1.2.3, got '$TAG'"; exit 1; }
        [ -n "${CLI_RELEASE_TOKEN:-}" ] || { echo "::error::CLI_RELEASE_TOKEN is not set: add a fine-grained PAT with Contents read/write on TheLightbulbCompany/cli only."; exit 1; }
        [ -n "${HOMEBREW_TAP_DEPLOY_KEY:-}" ] || { echo "::error::HOMEBREW_TAP_DEPLOY_KEY is not set: the formula cannot be bumped."; exit 1; }
      env:
        CLI_RELEASE_TOKEN: ${{ secrets.CLI_RELEASE_TOKEN }}
        HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
    - name: Download and verify the release
      id: fetch
      run: |-
        set -euo pipefail
        mkdir -p work/bin && cd work
        rm -rf bin "$ASSET" "$ASSET.sha256" lightbulb.zip # the self-hosted runner keeps the last run's files
        mkdir -p bin
        gh release download "$TAG" -R TheLightbulbCompany/cli -p "$ASSET" -p "$ASSET.sha256" --clobber
        shasum -a 256 -c "$ASSET.sha256"
        OLD_SHA="$(cut -d' ' -f1 "$ASSET.sha256")"
        echo "old_sha=$OLD_SHA" >> "$GITHUB_OUTPUT"
        [ "$(tar -tzf "$ASSET")" = lightbulb ] || { echo "::error::$ASSET does not hold exactly one 'lightbulb' entry"; exit 1; }
        tar -xzf "$ASSET" -C bin lightbulb
        # Idempotent: a release already signed by our team is left alone (the brew step still
        # runs, so a run that uploaded but failed to bump the tap can be finished by a re-run).
        if codesign -dv bin/lightbulb 2>&1 | grep -q "TeamIdentifier=$TEAM_ID"; then
          echo "::notice::$TAG is already signed by $TEAM_ID; not re-signing."
          echo "already=true" >> "$GITHUB_OUTPUT"
        else
          echo "already=false" >> "$GITHUB_OUTPUT"
        fi
      env:
        GH_TOKEN: ${{ github.token }}
    - name: Set up signing keychain
      if: steps.fetch.outputs.already != 'true'
      run: |-
        set -euo pipefail
        KEYCHAIN_PATH="$RUNNER_TEMP/lightbulb-build.keychain-db"
        KEYCHAIN_PASSWORD="$(uuidgen)"
        CERT_PATH="$RUNNER_TEMP/cert.p12"

        echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"
        security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security set-keychain-settings -ut 21600 "$KEYCHAIN_PATH"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" \
          -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
        # shellcheck disable=SC2046 # the existing keychain list is split on purpose
        security list-keychain -d user -s "$KEYCHAIN_PATH" \
          $(security list-keychain -d user | tr -d '" \t')
        security set-key-partition-list -S apple-tool:,apple:,codesign: \
          -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
        rm -f "$CERT_PATH"

        echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
        echo "Identity in keychain:"
        security find-identity -v -p codesigning "$KEYCHAIN_PATH"
      env:
        APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
    - name: Prepare notarization API key
      if: steps.fetch.outputs.already != 'true'
      run: |-
        set -euo pipefail
        KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
        rm -f "$KEY_PATH"
        umask 077
        printf '%s' "$EXPO_ASC_API_KEY_BASE64" | base64 --decode > "$KEY_PATH"
        echo "APPLE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
      env:
        EXPO_ASC_API_KEY_BASE64: ${{ secrets.EXPO_ASC_API_KEY_BASE64 }}
    - name: Sign
      if: steps.fetch.outputs.already != 'true'
      working-directory: work/bin
      run: |-
        set -euo pipefail
        codesign --force --options runtime --timestamp --keychain "$KEYCHAIN_PATH" --sign "$SIGN_ID" lightbulb
        codesign --verify --strict --verbose=2 lightbulb
        codesign -dvv lightbulb
    - name: Notarize
      id: notarize
      if: steps.fetch.outputs.already != 'true'
      working-directory: work/bin
      run: |-
        set -euo pipefail
        ditto -c -k --keepParent lightbulb lightbulb.zip
        retry() { for i in 1 2 3; do "$@" && return 0; [ "$i" = 3 ] && return 1; echo "Attempt $i failed; retrying"; sleep $((i * 10)); done; }
        # A submit "succeeds" once Apple has answered with an id; Accepted/Invalid is judged below,
        # so an Invalid verdict is not resubmitted three times.
        submit() {
          xcrun notarytool submit lightbulb.zip --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" --wait --output-format json > notary.json || true
          cat notary.json
          jq -e '.id' notary.json >/dev/null
        }
        retry submit
        ID="$(jq -r '.id' notary.json)"
        STATUS="$(jq -r '.status // "unknown"' notary.json)"
        echo "status=$STATUS" >> "$GITHUB_OUTPUT"
        if [ "$STATUS" != Accepted ]; then
          echo "::error::Notarization $ID ended $STATUS"
          xcrun notarytool log "$ID" --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" || true
          exit 1
        fi
        # No staple: a bare Mach-O executable cannot carry a stapled ticket (stapler handles
        # bundles, dmg and pkg only). Gatekeeper looks the ticket up online by the code's hash.
        rm -f lightbulb.zip notary.json
    - name: Re-package
      id: package
      if: steps.fetch.outputs.already != 'true'
      working-directory: work
      env:
        # No AppleDouble `._lightbulb` entry if the runner ever adds an xattr to the binary.
        COPYFILE_DISABLE: '1'
      run: |-
        set -euo pipefail
        # Exactly as the public release.yml packages it: one `lightbulb` entry, and
        # "<sha256>  <asset>" written by shasum from the asset's own directory.
        tar -czf "$ASSET" -C bin lightbulb
        shasum -a 256 "$ASSET" > "$ASSET.sha256"
        [ "$(tar -tzf "$ASSET")" = lightbulb ]
        cat "$ASSET.sha256"
    - name: Replace the release assets
      if: steps.fetch.outputs.already != 'true'
      working-directory: work
      run: |-
        set -euo pipefail
        retry() { for i in 1 2 3; do "$@" && return 0; [ "$i" = 3 ] && return 1; echo "Attempt $i failed; retrying"; sleep $((i * 10)); done; }
        retry gh release upload "$TAG" "$ASSET" "$ASSET.sha256" --clobber -R TheLightbulbCompany/cli
      env:
        GH_TOKEN: ${{ secrets.CLI_RELEASE_TOKEN }}
    - name: Sign the Linux checksums
      # Linux and WSL `lightbulb update` installs only a release whose `.sha256` carries an
      # Ed25519 signature (`<asset>.sha256.sig`, raw 64 bytes over the file's exact bytes) under
      # the engine's compiled-in RELEASE_KEY. The private key lives only on this Mac; it is
      # never printed, copied or uploaded. Runs on every re-run (--clobber), signed or not.
      run: |-
        set -euo pipefail
        KEY="$HOME/Library/Application Support/lightbulb-release/release.key"
        [ -f "$KEY" ] || { echo "::error::The release key is missing on this runner; Linux updates cannot be signed."; exit 1; }
        # RELEASE_KEY in the engine's src/cli.rs, as an Ed25519 SubjectPublicKeyInfo. Checking
        # against it (not the key file's own public half) also catches a wrong key file.
        PUB_HEX=5f56f67cef035900bfae7bca33e1ee5612dab82fb8d9ae3e317682d09a6a78df
        DIR="$RUNNER_TEMP/linux-sums"
        rm -rf "$DIR" && mkdir -p "$DIR" && cd "$DIR"
        printf '302a300506032b6570032100%s' "$PUB_HEX" | xxd -r -p > pub.der
        openssl pkey -pubin -inform DER -in pub.der -out pub.pem
        for A in lightbulb-linux-arm64.tar.gz lightbulb-linux-x86_64.tar.gz; do
          gh release download "$TAG" -R TheLightbulbCompany/cli -p "$A" -p "$A.sha256" --clobber
          # Sign only a sidecar that matches its archive: a stale one would pass here and fail
          # every updater's checksum.
          shasum -a 256 -c "$A.sha256" || { echo "::error::$A does not match $A.sha256; not signing."; exit 1; }
          openssl pkeyutl -sign -rawin -inkey "$KEY" -in "$A.sha256" -out "$A.sha256.sig"
          [ "$(wc -c < "$A.sha256.sig" | tr -d ' ')" = 64 ] || { echo "::error::$A.sha256.sig is not 64 bytes"; exit 1; }
          openssl pkeyutl -verify -pubin -inkey pub.pem -rawin -in "$A.sha256" -sigfile "$A.sha256.sig" >/dev/null \
            || { echo "::error::$A.sha256.sig does not verify under RELEASE_KEY; not uploading."; exit 1; }
        done
        retry() { for i in 1 2 3; do "$@" && return 0; [ "$i" = 3 ] && return 1; echo "Attempt $i failed; retrying"; sleep $((i * 10)); done; }
        retry gh release upload "$TAG" -R TheLightbulbCompany/cli --clobber \
          lightbulb-linux-arm64.tar.gz.sha256.sig lightbulb-linux-x86_64.tar.gz.sha256.sig
      env:
        GH_TOKEN: ${{ secrets.CLI_RELEASE_TOKEN }}
    - name: Bump the Homebrew formula's sha256
      id: brew
      working-directory: work
      run: |-
        set -euo pipefail
        SHA="$(cut -d' ' -f1 "$ASSET.sha256")"
        echo "$SHA" | grep -Eqx '[0-9a-f]{64}'
        echo "new_sha=$SHA" >> "$GITHUB_OUTPUT"
        VERSION="${TAG#v}"
        TAP="$RUNNER_TEMP/homebrew-tap"
        KEY="$RUNNER_TEMP/homebrew-tap-key"
        rm -rf "$TAP"
        ( umask 077; printf '%s\n' "$HOMEBREW_TAP_DEPLOY_KEY" > "$KEY" )
        export GIT_SSH_COMMAND="ssh -i $KEY -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=$RUNNER_TEMP/homebrew-tap-known-hosts"
        git clone --depth 1 git@github.com:TheLightbulbCompany/homebrew-tap.git "$TAP"
        cd "$TAP"
        F=Formula/lightbulb.rb
        URL="https://github.com/TheLightbulbCompany/cli/releases/download/$TAG/$ASSET"
        grep -Fqx "  url \"$URL\"" "$F" || { echo "::error::$F's url does not name $TAG (the public bump-brew has not run for it); not touching the sha256."; exit 1; }
        sed -E "s|^(  sha256 )\"[0-9a-f]*\"|\1\"$SHA\"|" "$F" > "$F.new" && mv "$F.new" "$F"
        git diff
        if git diff --quiet; then echo "Formula already at the signed sha256"; exit 0; fi
        git -c user.name="lightbulb-release" -c user.email="hello@thelightbulb.company" commit -am "lightbulb ${VERSION}: signed"
        for i in 1 2 3; do git push origin HEAD && exit 0; [ "$i" = 3 ] && exit 1; sleep $((i * 10)); done
      env:
        HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
    - name: Summary
      if: always()
      run: |-
        {
          echo "### Signed CLI release $TAG"
          echo "| | |"
          echo "|---|---|"
          echo "| Identity | $SIGN_ID |"
          echo "| Already signed | ${{ steps.fetch.outputs.already }} |"
          echo "| Notarization | ${{ steps.notarize.outputs.status || 'not run' }} |"
          echo "| Old sha256 | \`${{ steps.fetch.outputs.old_sha }}\` |"
          echo "| New sha256 | \`${{ steps.brew.outputs.new_sha }}\` |"
        } >> "$GITHUB_STEP_SUMMARY"
    - name: Clean up signing keychain
      if: always()
      run: |-
        rm -f "$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8" "$RUNNER_TEMP/homebrew-tap-key"
        security delete-keychain "$RUNNER_TEMP/lightbulb-build.keychain-db" || true
