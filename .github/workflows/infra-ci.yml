# =============================================================================
# Infra CI (PRs only)
#
# apps/infra had NO test job. Its vitest suite (~250 assertions covering task
# definitions, boot commands, alarm/emitter contracts) ran only on a developer's
# machine, so a CDK change reached main having been checked by nobody.
#
# That is not theoretical: #1817 shipped three alarms built on a SEARCH()
# metric-math expression, which CloudWatch rejects on alarms outright. The stack
# rolled back on EVERY deploy, and because the prod stages depend on dev
# succeeding, prod deploys were silently skipped for hours. CloudFormation was
# the first thing in the pipeline to find out, because nothing before it looked.
#
# Synth is the point: `cdk synth` is what turns a type-correct stack into the
# template CloudFormation will actually reject, and the suite asserts against
# synthesized templates rather than construct objects.
# =============================================================================
name: Infra CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/infra/**'
      - '.github/workflows/infra-ci.yml'
      - '.github/workflows/deploy.yml'
      - 'openclaw-version.json'
      - 'paperclip-version.json'
      - 'pnpm-lock.yaml'

# Supersede in-flight runs for the same PR. `github.ref` is refs/pull/<n>/merge
# here (pull_request only), so the group is per-PR and PRs never cancel each
# other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

permissions:
  contents: read

jobs:
  test:
    name: Synth & Test
    runs-on: ${{ vars.CI_RUNNER }}
    # The suite synthesizes every stack; it runs in seconds locally, so a cap
    # this size only catches a hang. Left explicit because an uncapped job
    # bills GitHub's 6-hour default when a step stalls — and on the shared
    # self-hosted box it would hold a runner slot for those six hours too.
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No `tsc --noEmit` step. The package's tsconfig also covers
      # openclaw/plugins/**, which are OpenClaw plugin sources baked into the
      # container image, not CDK — they import the OpenClaw plugin SDK, which
      # is not a dependency here, so a whole-package type check fails on ~20
      # pre-existing errors that have nothing to do with infrastructure.
      # Narrowing that is its own change; this job exists to catch templates
      # CloudFormation would reject, and synth is what does that.
      - name: Run tests
        run: pnpm --filter @lightbulb/infra run test

      # `.github/workflows/deploy.yml` is GENERATED from the pipeline
      # definition in apps/infra/lib/app.ts. cdk-pipelines-github ships its own
      # drift guard, but the throw is gated on
      # `process.env.GITHUB_WORKFLOW === <the pipeline's own workflow name>`
      # (node_modules/cdk-pipelines-github/lib/pipeline.js), so it can only
      # fire from INSIDE deploy.yml — post-merge. Everywhere else, synth
      # silently REWRITES the file instead of complaining.
      #
      # So a PR that edits the pipeline without committing the regenerated YAML
      # is green, and then `Synthesize` — the first job in the pipeline — fails
      # on merge, skipping every dev and prod deploy job until someone lands a
      # regeneration commit. That has now happened four times (twice 2026-06,
      # #1176 in 2026-07, #1997 on 2026-08-23).
      #
      # Since the local synth rewrites in place, `git diff` IS the check. This
      # only touches the runner's working copy; nothing is committed or pushed.
      #
      # Docker is required: the WS authorizer and bedrock-gate Lambdas bundle
      # their Python deps in a container, and there is no supported way to skip
      # bundling. Both `isol8-wsl` (the self-hosted box, which already runs this
      # exact synth for DEPLOY_RUNNER) and `ubuntu-latest` have a daemon.
      - name: Check deploy.yml matches the pipeline definition
        working-directory: apps/infra
        run: |
          npx cdk synth --no-notices > /dev/null
          if git diff --quiet -- ../../.github/workflows/deploy.yml; then
            echo "deploy.yml is in sync with apps/infra/lib/app.ts"
            exit 0
          fi
          git diff -- ../../.github/workflows/deploy.yml
          cat >&2 <<'MSG'

          ============================================================
          .github/workflows/deploy.yml is OUT OF SYNC with the pipeline
          definition in apps/infra/lib/app.ts (diff above).

          deploy.yml is generated, not hand-written. Regenerate and commit it:

              cd apps/infra && npx cdk synth
              git add ../../.github/workflows/deploy.yml
              git commit

          (Requires a running Docker daemon — synth bundles Lambda deps.)

          Left unfixed, this PR merges green and then breaks the deploy
          pipeline: its Synthesize job re-runs this same comparison, throws,
          and every dev + prod deploy job is skipped until someone lands a
          regeneration commit.
          ============================================================
          MSG
          exit 1
