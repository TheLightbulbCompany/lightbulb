# AWS deploy: every CDK stack in apps/infra. Dev on a merge that touches the backend or infra;
# prod only when a person runs this workflow (it deploys dev first, in the same run).
# The website deploys separately: web-deploy.yml.
name: deploy

on:
  push:
    branches: [main]
    paths:
      - "apps/backend/**"
      - "apps/infra/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

# One run at a time touches CloudFormation. `queue: max` keeps every pending run (a group
# otherwise holds one pending run and a new push evicts a waiting prod dispatch).
concurrency:
  group: lightbulb-deploy
  cancel-in-progress: false
  queue: max

permissions:
  contents: read
  id-token: write

env:
  # Read by service-stack.ts at synth time. Empty is tolerated (Spark then offers no checkout).
  STRIPE_SPARK_PRICE_ID_DEV: ${{ secrets.STRIPE_SPARK_PRICE_ID_DEV }}
  STRIPE_SPARK_PRICE_ID_PROD: ${{ secrets.STRIPE_SPARK_PRICE_ID_PROD }}

jobs:
  dev:
    # Native arm64, so the linux/arm64 backend image builds without QEMU.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/infra/package-lock.json
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::877352799272:role/lightbulb-github-actions
          role-duration-seconds: 3600
      - run: npm ci
        working-directory: apps/infra
      # cdk assumes the bootstrap cdk-hnb659fds-* roles itself, and builds and pushes the
      # backend image (DockerImageAsset). Prod reuses it: the asset is skipped when its tag exists.
      - run: npx cdk deploy 'dev/*' --require-approval never --concurrency 4 --no-notices
        working-directory: apps/infra

  prod:
    needs: dev
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/infra/package-lock.json
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::877352799272:role/lightbulb-github-actions
          role-duration-seconds: 3600
      - run: npm ci
        working-directory: apps/infra
      - run: npx cdk deploy 'prod/*' --require-approval never --concurrency 4 --no-notices
        working-directory: apps/infra
