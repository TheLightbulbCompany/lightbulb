guide: |
  # A hiring pipeline: job posted, 50 candidates sourced, interviews booked

  ## Steps
  1. Agree the role, level, pay range and location (one confirmation).
  2. Write the job post. After approval, publish it on the boards the person picks.
  3. Source 50 candidates from public profiles, with a line on why each fits.
  4. Reply to every applicant within a day. Screen with the questions the person approved.
  5. Book interviews on the person's calendar (connect the calendar if needed).
  6. Send status replies after each decision.

  ## Decisions to ask
  - The role details and pay range.
  - Approve the job post and the screening questions.
  - Who to interview, and every rejection.

  ## Done proves
  - The live job post link.
  - The candidate list as a document.
  - Interviews on the calendar.

  ## Honesty limits
  - The person interviews and decides. Never promise a hire.
  - Never screen on anything protected by law; keep questions about the job.
