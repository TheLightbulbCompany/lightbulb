<title id="title">Lightbulb current architecture</title><desc id="desc">Messages pass through FastAPI, DynamoDB, a FIFO work queue, and a workspace Hermes runtime. S3 stores agent files, Step Functions handles provisioning, and AWS hosts the remote browser separately.</desc>
