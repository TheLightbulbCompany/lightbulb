name: Huddle Agent

# LiveKit Cloud Agents worker (apps/huddle-agent). Deploy jobs stay inert until
# the LiveKit account exists and LIVEKIT_{DEV,PROD}_ENABLED is set to 'true'.
on:
  pull_request:
    # The three backend files are the replay's router (tests/replay/router.py loads them by path), so a
    # change to them runs the replay gate. Pull requests only: on a push they would redeploy a worker
    # that did not change (deploy-dev runs on every push this workflow takes).
    paths:
      - "apps/huddle-agent/**"
      - ".github/workflows/huddle-agent.yml"
      - "apps/backend/core/services/messaging.py"
      - "apps/backend/core/services/jev.py"
      - "apps/backend/core/services/voice_calls.py"
  push:
    branches: [main]
    paths: ["apps/huddle-agent/**", ".github/workflows/huddle-agent.yml"]
  workflow_dispatch:

permissions:
  contents: read

# Supersede in-flight runs for the same PR; a push to main gets its own group (its SHA)
# so a deploy-dev run is never cancelled by the next merge's.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    # Self-hosted (vars.CI_RUNNER) again 2026-11-05: GitHub-hosted runs used up the free Actions minutes.
    runs-on: ${{ vars.CI_RUNNER }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/huddle-agent
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: apps/huddle-agent/uv.lock
      - run: uv sync
      - run: uv run pytest

  deploy-dev:
    needs: test
    if: github.event_name == 'push' && vars.LIVEKIT_DEV_ENABLED == 'true'
    runs-on: ${{ vars.CI_RUNNER }}
    steps:
      - uses: actions/checkout@v7
      # lk agent deploy needs the livekit.toml that `lk agent create` wrote for this project (README).
      - run: cp apps/huddle-agent/livekit.dev.toml apps/huddle-agent/livekit.toml
      - uses: livekit/deploy-action@v2.12.2
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL_DEV }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY_DEV }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET_DEV }}
        with:
          OPERATION: deploy
          WORKING_DIRECTORY: apps/huddle-agent

  deploy-prod:
    needs: test
    if: github.event_name == 'workflow_dispatch' && vars.LIVEKIT_PROD_ENABLED == 'true'
    runs-on: ${{ vars.CI_RUNNER }}
    steps:
      - uses: actions/checkout@v7
      # lk agent deploy needs the livekit.toml that `lk agent create` wrote for this project (README).
      - run: cp apps/huddle-agent/livekit.prod.toml apps/huddle-agent/livekit.toml
      - uses: livekit/deploy-action@v2.12.2
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL_PROD }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY_PROD }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET_PROD }}
        with:
          OPERATION: deploy
          WORKING_DIRECTORY: apps/huddle-agent
