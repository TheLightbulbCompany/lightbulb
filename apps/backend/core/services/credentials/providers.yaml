# Bucket B variant — REMOTE, OAuth-protected hosted MCP (see Attio below for the
# mcp_oauth rail mechanics). Stripe hosts its own MCP at mcp.stripe.com behind
# OAuth with DCR; this replaces the paste-key stdio @stripe/mcp server (and its
# npx cold-start). Stripe's register endpoint rejects any scope it doesn't know
# — including offline_access and the empty string — and self-assigns "mcp", so
# that is the one scope requested; the refresh_token grant is issued regardless.
# The mcp_remote url must stay exactly the advertised protected-resource value
# (no path, no trailing slash): it rides the RFC 8707 resource param and a
# mismatch breaks token audiencing.
stripe:
  display_name: Stripe
  acquisition: direct_oauth
  actor: mcp
  refresh_owner: actor
  brokered_environments: [dev, prod]
  oauth:
    authorization_url: "https://access.stripe.com/mcp/oauth2/authorize"
    token_url: "https://access.stripe.com/mcp/oauth2/token"
    registration_url: "https://access.stripe.com/mcp/oauth2/register"
    scopes: ["mcp"]
    scope_separator: " "
    pkce: true
  mcp_remote:
    key: stripe
    url: "https://mcp.stripe.com"
    transport: streamable-http
  wiring:
    materializer: mcp_oauth
  # 1-click Automations trigger source. Stripe has no webhook-registration API
  # reachable with an MCP OAuth token (creating an endpoint needs a restricted
  # API key), so registration is guided: the owner pastes the proxy URL into
  # their own Stripe Dashboard, then pastes the signing secret it hands back.
  # signing_mode: hmac_sha256 is a NATIVE Paperclip mode — its `{t}.{body}`
  # HMAC scheme is exactly Stripe's, so Paperclip verifies the Stripe-Signature
  # against the trigger's secret once the owner's whsec_ is armed. The Isol8
  # trigger proxy only splits Stripe's combined `Stripe-Signature` header into
  # the separate signature/timestamp headers Paperclip reads.
  inbound:
    webhook_registration: guided_paste
    signing_mode: hmac_sha256
    # Stripe names the event in the body (`type`), so one endpoint can carry
    # several events and the agent can still tell which fired.
    event_in_body: true
    instructions: >-
      In your Stripe Dashboard, open Developers → Webhooks and add ONE endpoint
      pointed at {proxy_url}, subscribed to {event_labels} ({event_ids}).
      Stripe then shows the endpoint's signing secret — paste it back here to
      finish arming this automation.
    secret_hint: "whsec_…"
    # Event ordering convention (every provider): the first entries are the
    # curated "popular" set — the frontend picker pins the first 3 as Popular —
    # and the remainder is alphabetized by id.
    # Full catalog: the `enabled_events` enum from Stripe's OpenAPI spec
    # (https://raw.githubusercontent.com/stripe/openapi/master/openapi/spec3.json,
    # webhook-endpoint create params; the literal "*" entry excluded),
    # fetched 2026-08-13.
    events:
      - id: invoice.payment_failed
        label: Invoice payment failed
      - id: charge.refunded
        label: Charge refunded
      - id: customer.subscription.deleted
        label: Subscription canceled
      - id: account.application.authorized
        label: Account application authorized
      - id: account.application.deauthorized
        label: Account application deauthorized
      - id: account.external_account.created
        label: Account external account created
      - id: account.external_account.deleted
        label: Account external account deleted
      - id: account.external_account.updated
        label: Account external account updated
      - id: account.updated
        label: Account updated
