# =============================================================================
# Mobile CI (PRs only) — typecheck / lint / iOS Metro bundle for apps/mobile
# and its @lightbulb/shared dependency. No EAS credentials needed: `expo export`
# runs the full Metro resolution+bundle on Linux, which catches the dominant
# failure class (RN-unresolvable imports) without a macOS builder.
# =============================================================================
name: Mobile CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/shared/**'
      - '.github/workflows/mobile-ci.yml'
      - 'pnpm-lock.yaml'
  # NOTE: the release lanes live in their own workflows, not here — native
  # build + TestFlight submit in mobile-release.yml (tag `mobile-v*` / dispatch,
  # self-hosted macOS runner), JS-only OTA in mobile-ota.yml (merge to main).

# Supersede in-flight runs for the same PR. `github.ref` is refs/pull/<n>/merge
# here (pull_request only), so the group is per-PR and PRs never cancel each
# other. The release lanes above keep their own serialized groups.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  check-and-bundle:
    name: Check & Bundle
    # Self-hosted (vars.CI_RUNNER) again 2026-11-05: GitHub-hosted runs used up the free Actions minutes.
    # Linux, not the self-hosted Mac: that one is kept for the native lanes
    # (desktop-build, mobile-release).
    # It once HUNG on ubuntu at `Mobile tests` (2026-07-29): importing
    # @clerk/expo leaves MessagePort handles open, so jest never exits.
    # `--forceExit` on that step is the fix; the cap stays so a stall fails fast.
    runs-on: ${{ vars.CI_RUNNER }}
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          # Per-job install dir: jobs sharing a self-hosted runner home race
          # the default ~/setup-pnpm (ENOTEMPTY on rmdir) when this and
          # mobile-ota land together.
          dest: ${{ runner.temp }}/setup-pnpm

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Reclaim runner workspace disk
        run: |
          rm -rf node_modules apps/*/node_modules packages/*/node_modules
          rm -rf "$HOME/.cache/pnpm" "$HOME/Library/Caches/pnpm"
          rm -rf "$HOME/Library/Caches/CocoaPods" "$HOME/Library/Developer/Xcode/DerivedData"
          pnpm store prune || true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Shared tests
        run: pnpm --filter @lightbulb/shared run test

      - name: Shared type check
        run: pnpm --filter @lightbulb/shared run typecheck

      - name: Shared lint
        run: pnpm --filter @lightbulb/shared run lint

      - name: Mobile type check
        run: pnpm --filter @lightbulb/mobile run typecheck

      - name: Mobile lint
        run: pnpm --filter @lightbulb/mobile run lint

      - name: Mobile tests
        # ponytail: --forceExit papers over @clerk/expo's MessagePort
        # handles (seen with --detectOpenHandles); mock Clerk in jest-setup to drop it.
        run: pnpm --filter @lightbulb/mobile run test --forceExit

      - name: Mobile iOS bundle (Metro export)
        env:
          CI: "1"
        run: pnpm --filter @lightbulb/mobile run export:ios
