# =============================================================================
# Backend CI Workflow (lint + test on PRs)
# Docker build & deploy handled by CDK Pipeline (deploy.yml)
# =============================================================================
name: Backend CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/backend/**'
      - 'apps/infra/lambda/bedrock-usage-meter/**'
      - '.github/workflows/backend.yml'

# Supersede in-flight runs for the same PR. Every push to a branch used to
# queue another full run while the previous ones kept their runner slots, so a
# branch pushed 7 times sat 7 runs deep with only the last one mattering.
# `github.ref` is refs/pull/<n>/merge here (pull_request only), so the group is
# per-PR and PRs never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

permissions:
  contents: read

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    # This job had NO cap, so a stalled `Run tests` step billed GitHub's
    # 6-hour default instead of failing — run 31562062289 sat in pytest for
    # 27+ minutes with no way to tell a slow suite from a hung one. The suite
    # is genuinely slow on hosted runners (no dependency cache), so the cap is
    # loose: it exists to bound a hang, not to police runtime.
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      # Node is needed by the chaos config-brick test's zod validator
      # (apps/backend/tests/chaos/_schema/validate.mjs). The test auto-skips
      # when the vendored schema bundle is absent, so this is a no-op until
      # scripts/vendor_openclaw_schema.sh has been run and the bundle committed.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: uv sync --frozen
        working-directory: apps/backend

      - name: Run linting
        run: |
          uv run ruff check .
          uv run ruff format --check .
        working-directory: apps/backend

      - name: Run tests
        env:
          CLERK_ISSUER: https://test.clerk.accounts.dev
          HUGGINGFACE_TOKEN: test_token
          DYNAMODB_TABLE_PREFIX: isol8-test-
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
          DEBUG: "false"
        run: uv run pytest tests/ -v --cov=. --cov-report=xml --cov-report=term-missing
        working-directory: apps/backend

      # The Bedrock meter Lambda is the free tier's counter and kill switch. Its
      # tests need the backend venv (moto, plus the lockstep test that imports
      # core.billing.bedrock_pricing), so they run here rather than in the infra
      # job. The lockstep test is the ONLY thing keeping the three copies of the
      # rate table — backend _RATES, containers/config.py cost blocks, and the
      # Lambda's own — from silently drifting apart.
      - name: Run Bedrock meter Lambda tests
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
        run: uv run pytest ../infra/lambda/bedrock-usage-meter -v
        working-directory: apps/backend

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: apps/backend/coverage.xml
          fail_ci_if_error: false
