# Service identification table — canonical key -> matchers.
#
# Names mined as DATA from the Gitleaks ruleset (MIT). No patterns copied from
# TruffleHog (AGPL). `hosts` are domain suffixes (matched exactly or as a
# `.suffix` tail); `env_prefixes` are env-var name prefixes. Keys that also
# appear in credentials/providers.yaml (e.g. `stripe`) reconcile to that
# provider during classification; the rest fall to bring-your-own.
#
# Extend this table as new agents surface new providers — it is the only place
# the long-tail service vocabulary lives.

stripe:
  display_name: Stripe
  hosts: [api.stripe.com]
  env_prefixes: [STRIPE_]

plaid:
  display_name: Plaid
  hosts: [plaid.com]
  env_prefixes: [PLAID_]

perplexity:
  display_name: Perplexity
  hosts: [api.perplexity.ai]
  env_prefixes: [PERPLEXITY_]

quickbooks:
  display_name: QuickBooks
  # API subdomains only — a bare ``intuit.com`` suffix matched marketing/docs
  # links (turbotax.intuit.com, quickbooks.intuit.com/pricing) as phantom deps.
  hosts: [quickbooks.api.intuit.com, sandbox-quickbooks.api.intuit.com]
  env_prefixes: [QBO_]

xero:
  display_name: Xero
  hosts: [api.xero.com]
  env_prefixes: [XERO_]

intercom:
  display_name: Intercom
  hosts: [api.intercom.io]
  env_prefixes: [INTERCOM_]

zendesk:
  display_name: Zendesk
  hosts: [zendesk.com]
  env_prefixes: [ZENDESK_]

twilio:
  display_name: Twilio
  hosts: [api.twilio.com]
  env_prefixes: [TWILIO_]
