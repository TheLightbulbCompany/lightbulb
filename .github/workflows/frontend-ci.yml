# =============================================================================
# Frontend CI (PRs only)
# =============================================================================
name: Frontend CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/frontend/**'
      - '.github/workflows/frontend-ci.yml'
      - 'pnpm-lock.yaml'

# Supersede in-flight runs for the same PR. `github.ref` is refs/pull/<n>/merge
# here (pull_request only), so the group is per-PR and PRs never cancel each
# other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ${{ vars.CI_RUNNER }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # Per-job install dir: concurrent jobs on the shared self-hosted
          # runner home race the default ~/setup-pnpm (ENOTEMPTY on rmdir)
          # when this workflow and mobile-ci fire on the same PR.
          dest: ${{ runner.temp }}/setup-pnpm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm --filter @isol8/frontend run lint

      - name: Type check
        run: pnpm --filter @isol8/frontend exec tsc --noEmit

      - name: Build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_API_URL: https://api-dev.isol8.co/api/v1
        run: pnpm --filter @isol8/frontend run build
