# Bucket A — paste-key (no OAuth, no refresh)
stripe:
  display_name: Stripe
  acquisition: paste_token
  actor: mcp
  refresh_owner: none
  validate: { method: GET, url: "https://api.stripe.com/v1/account", auth_header: Authorization }
  wiring:
    mcp_server: { key: stripe, command: npx, args: ["-y", "@stripe/mcp", "--tools=all"], env: { STRIPE_SECRET_KEY: input.token } }

# Bucket B — dedicated self-refreshing CLI
google:
  display_name: Google Workspace
  acquisition: direct_oauth
  actor: cli
  refresh_owner: actor
  requires: { bins: [gog] }
  oauth:
    authorization_url: "https://accounts.google.com/o/oauth2/v2/auth"
    token_url: "https://oauth2.googleapis.com/token"
    scopes: ["https://www.googleapis.com/auth/gmail.modify", "https://www.googleapis.com/auth/calendar", "https://www.googleapis.com/auth/drive"]
    scope_separator: " "
    pkce: true
    extra_authorize_params: { access_type: offline, prompt: consent }
  wiring:
    materializer: gog_cli

# Bucket A — paste-key mcp_server integrations (full access is the chosen default)
slack:
  display_name: Slack
  acquisition: paste_token
  actor: mcp
  refresh_owner: none
  # auth.test answers HTTP 200 even for a bad token and signals validity only in
  # the body, so `ok` is the truthy field that actually gates a valid token.
  validate: { method: POST, url: "https://slack.com/api/auth.test", auth_header: Authorization, success_json_field: "ok" }
  wiring:
    mcp_server:
      key: slack
      command: npx
      args: ["-y", "slack-mcp-server@latest", "--transport", "stdio"]
      # The three *_TOOL flags ship as literals so write tools (post/react/mark)
      # are enabled by default; the user-pasted token governs actual scope.
      env: { SLACK_MCP_XOXP_TOKEN: "input.token", SLACK_MCP_ADD_MESSAGE_TOOL: "literal:true", SLACK_MCP_REACTION_TOOL: "literal:true", SLACK_MCP_MARK_TOOL: "literal:true" }

notion:
  display_name: Notion
  acquisition: paste_token
  actor: mcp
  refresh_owner: none
  # Notion rejects any request missing the pinned API version header, even with a
  # valid token, so it must ride on every validate call.
  validate: { method: GET, url: "https://api.notion.com/v1/users/me", auth_header: Authorization, headers: { Notion-Version: "2022-06-28" } }
  wiring:
    mcp_server: { key: notion, command: npx, args: ["-y", "@notionhq/notion-mcp-server"], env: { NOTION_TOKEN: "input.token" } }

sentry:
  display_name: Sentry
  acquisition: paste_token
  actor: mcp
  refresh_owner: none
  validate: { method: GET, url: "https://sentry.io/api/0/organizations/", auth_header: Authorization }
  wiring:
    mcp_server: { key: sentry, command: npx, args: ["-y", "@sentry/mcp-server@latest"], env: { SENTRY_ACCESS_TOKEN: "input.token" } }

linear:
  display_name: Linear
  acquisition: paste_token
  actor: mcp
  refresh_owner: none
  # Linear's GraphQL endpoint wants the raw personal API key (no Bearer scheme)
  # and a POST query body; a truthy data.viewer.id is the real validity signal,
  # since a bad key still answers 200 with an `errors` payload.
  validate: { method: POST, url: "https://api.linear.app/graphql", auth_header: Authorization, auth_scheme: "", body: { query: "{ viewer { id } }" }, success_json_field: "data.viewer.id" }
  wiring:
    mcp_server: { key: linear, command: npx, args: ["-y", "@tacticlaunch/mcp-linear"], env: { LINEAR_API_TOKEN: "input.token" } }

# Bucket B variant — `gh` CLI + github/gh-issues skills are baked into the OpenClaw
# image, so GitHub rides the materializer rail (gh's own hosts.yml on EFS), not
# mcp_server. A bad PAT answers 401, so status-based validate suffices; the pinned
# API-version header rides every call. refresh_owner: none — the PAT is a paste key
# retained in Secrets Manager.
github:
  display_name: GitHub
  acquisition: paste_token
  actor: cli
  refresh_owner: none
  requires: { bins: [gh] }
  validate: { method: GET, url: "https://api.github.com/user", auth_header: Authorization, headers: { X-GitHub-Api-Version: "2022-11-28" } }
  wiring:
    materializer: gh_cli
