id: c03-deskhero
kind: internal-tool
type: change
prompt: |
  Deskhero needs real helpdesk roles and a ticket workflow. Everything that works today keeps working: requesters still see only their own tickets.

  Roles: `admin`, `agent` and `requester`; everyone has exactly one, stored on the server, and new sign-ups are `requester`. For local testing, anyone whose email starts with `admin+` (for example `admin+1@x.test`) becomes an `admin` at sign-up. Nobody can change their own role; only admins change roles, on the users page. The header shows a role badge with the role name; `GET /api/me` also returns `role`. After signing in (and when a signed-in person opens the home address) admins go to `/admin`, agents to `/agent`, requesters to `/tickets`. A page above your role (a requester on `/admin` or `/agent`, an agent on `/admin`) redirects away or shows a 403, and every API behind it enforces the same on the server.

  `/admin` shows ticket counts by status and a link to `/admin/users`: a table of every user (name, email, role) with a select per row to change the role immediately (`PATCH /api/admin/users/[id]`; list at `GET /api/admin/users`). Each user row carries `data-user-id`, the user's id (the same as `/api/me` gives them). `/agent` shows two lists: unassigned open tickets, and tickets assigned to me.

  Assignment: admins assign any agent through a select on the ticket page; agents can take an unassigned ticket with a button; requesters cannot assign. The ticket's status is now `open`, `in_progress`, `resolved` or `closed`, and only these changes are legal: open to in_progress (assigned agent or admin, and a ticket must have an assignee), in_progress to resolved or back to open (assigned agent or admin), resolved to closed or back to open (the ticket's requester or an admin), closed to open (admin only). `POST /api/tickets/[id]/transition` takes `{ "to": "<status>" }`; answer 403 when that person may not do it and 422 when the change itself is illegal. The ticket page shows only the transition buttons the viewer may use. Requesters see the status and assignee read-only.

  Internal notes: agents and admins can add notes to any ticket (`GET` and `POST /api/tickets/[id]/notes`); requesters must never see them, so leave note content out of every response a requester can get, not only the screen.

  The ticket status element reads exactly the status name; the assignee element shows the assignee's name or email. The id used in `/api/admin/users/[id]` is the user's id.

  Names the checks rely on. Please use these exactly, because an automatic check drives the app by them.

  Pages: `/auth/sign-up`, `/auth/sign-in`, `/admin`, `/admin/users`, `/agent`, `/tickets`, `/tickets/[id]`, `/api/me`, `/api/admin/users`, `/api/tickets/[id]/transition`, `/api/tickets/[id]/notes`.

  Elements: give each of these a `data-testid` attribute with exactly this value: `signup-name`, `signup-email`, `signup-password`, `signup-submit`, `signup-error`, `signin-email`, `signin-password`, `signin-submit`, `signin-error`, `user-menu`, `sign-out-button`, `role-badge`, `admin-dashboard`, `agent-dashboard`, `users-table`, `user-row`, `user-role-select`, `queue-unassigned`, `queue-mine`, `ticket-detail-status`, `ticket-assignee`, `assign-to-me`, `assignee-select`, `transition-in_progress`, `transition-resolved`, `transition-closed`, `transition-open`, `notes-section`, `note-input`, `note-submit`, `note-item`.
fixture: deskhero-m1
journeys: journeys.spec.ts
probes:
  - id: unauth-admin
    kind: unauthenticated-route
    target: /admin
  - id: cross-user-api-tickets
    kind: cross-user-read
    target: /api/tickets
    create: { subject: "Probe private", body: "x", priority: "low" }
  - id: sqli-tickets-new
    kind: sql-injection
    target: /tickets/new
timeoutMin: 45
