    name: DeployCompanyDev
    permissions:
      contents: write
    runs-on: ${{ vars.DEPLOY_RUNNER }}
    needs:
      - dev-lightbulb-dev-auth-Deploy
      - dev-lightbulb-dev-dns-Deploy
      - dev-lightbulb-dev-agent-mail-outbound-Deploy
      - dev-lightbulb-dev-database-Deploy
      - dev-lightbulb-dev-network-Deploy
      - dev-lightbulb-dev-api-Deploy
