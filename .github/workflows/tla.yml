# TLA+ model checks: TLC runs every tla/*.cfg on PRs that touch the specs.
# Deliberately path-filtered — a spec is a model of the code, not the code,
# so it cannot gate unrelated PRs; the specs' README says what each mirrors.
name: TLA+ model checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'tla/**'
      - '.github/workflows/tla.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tlc:
    name: TLC
    # Self-hosted (vars.CI_RUNNER) again 2026-11-05: GitHub-hosted runs used up the free Actions minutes.
    runs-on: ${{ vars.CI_RUNNER }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Model-check every config
        run: tla/check.sh
