    scope_separator: " "
    pkce: true
  mcp_remote:
    key: posthog
    # ?mode=cli is PostHog's recommended mode for agents: the server exposes ONE
    # token-optimized `exec` tool (search/info/schema/call subcommands, ~8K tokens
    # of schema) instead of its full raw toolset (500+ tools, ~657K tokens of
    # schemas — more than gpt-5.5's whole 272K ChatGPT-OAuth context window, so
    # raw mode overflow-bricks every run on the container). The agent discovers
    # tool schemas on demand, keeps access to the full capability surface, and
    # destructive calls require an explicit --confirm.
    url: "https://mcp.posthog.com/mcp?mode=cli"
    transport: streamable-http
  wiring:
    materializer: mcp_oauth
  # Automations trigger source — the REVERSE-guided shape. PostHog's HTTP
  # Webhook destination (hog function template-webhook) sends a bare fetch
  # with user-configured headers and no signing of any kind, so instead of
  # the provider minting a secret the owner pastes back (Stripe's whsec_),
  # the trigger's OWN one-time secret flows Isol8 → PostHog: the owner sets
  # it as the destination's Authorization header and Paperclip's native
  # bearer mode does the timing-safe compare. Registration is still guided
  # (the destination is created by hand in PostHog's UI), but there is no
  # paste-back step — signing_mode "bearer" on a guided_paste block is what
  # the seed dispatches that variant on. Event filtering happens in
  # PostHog's destination filter UI, exactly like Stripe events are chosen
  # in Stripe's dashboard.
  inbound:
    webhook_registration: guided_paste
    signing_mode: bearer
    event_in_body: true
    instructions: >-
      In PostHog, open Data pipelines → Destinations and create ONE
      'HTTP Webhook' destination. Set the URL to {proxy_url}, add a header
      named Authorization with the secret shown above as its value
      (including the 'Bearer ' prefix), set the destination's filter to
      {event_labels}, and enable it. For onboarding wall / activation
      exception watches, leave PostHog's default event JSON body enabled so
      the wake contains the browser event `event`, `uuid`, `timestamp`,
      `distinct_id`, `properties.$session_id`, `properties.code`, and
      PostHog project/event metadata when available. Never add URLs,
      message text, transcripts, or other conversation fields to the
      destination body.
    # PostHog events are per-project; these are the universal ones. The
    # catalog is the owner's OWN event definitions — a live picker via
    # PostHog's event_definitions API is the follow-up; filtering happens
    # in PostHog's destination filter either way, so these seed the
    # template/prompt, not a server-side filter.
    events:
      - id: $identify
        label: User identified
      - id: $pageview
        label: Page viewed
      - id: $exception
        label: Exception captured
      - id: onboarding_gate_blocked
        label: Onboarding gate blocked
        starter_prompt: >-
          A browser PostHog `onboarding_gate_blocked` webhook just fired.
          Use only this browser event plus CloudWatch
          `LightbulbAI/provision.gate.blocked{{code, service=lightbulb-backend, env=prod}}`
          direction as activation-wall evidence; never use Stripe-copied
          events or container boot events as activation proof. From the
          payload, record the event `uuid`, `timestamp`, event name, wall
          `properties.code`, a stable person/session dedupe key
          (`distinct_id` and/or `properties.$session_id`), and a
          non-sensitive PostHog reference/permalink from the event/project
          context when available. Do not expose user conversation data.
          Create the concrete blocker issue URL, or use the named null
          outcome `duplicate-activation-blocker` when dedupe proves an open
          blocker already exists.
      - id: any
        label: Any event (choose in PostHog's filter)
    template:
      title: "PostHog: {event_label}"
      suggested_agent: friday
      starter_prompt: >-
        A PostHog webhook just fired: {event_label}. Look at the event
        payload (event name, event uuid, timestamp, person/session key, and
        properties), figure out what happened in the product, and take the
        appropriate next step (e.g. reach out, flag the signal to the team,
        or record the insight). Never expose user conversation data.

# Bucket B variant — paste-token CLI delivered as a bundled SKILL (the GitHub gh_cli
# model). The owner pastes a Vercel Account Token; the skill_cli materializer enables
# skills.entries.vercel + seeds the SKILL.md onto EFS, and OpenClaw injects the token as
# VERCEL_TOKEN (primaryEnv) into the gateway-host exec env. The agent runs `npx vercel`
# (extract→/tmp, storm-safe). The CLI covers read + write, so it is the single Vercel
# integration. Validate by API call — Vercel Account-token prefixes overlap, so
# token_prefix is unusable.
vercel_cli:
  display_name: Vercel
  acquisition: paste_token
  actor: skill
  refresh_owner: none
  validate: { method: GET, url: "https://api.vercel.com/v2/user", auth_header: Authorization }
  skill:
    key: vercel
    primaryEnv: VERCEL_TOKEN
    package: "vercel@54.18.2"
  wiring:
    materializer: skill_cli
  # Automations trigger source — the second AUTO-registering one, with the
  # secret flowing the OPPOSITE direction from GitHub: Vercel GENERATES the
  # webhook secret (shown once in the POST /v1/webhooks response), so the seed
  # creates the webhook first and then ARMS the trigger by rotating its
  # Paperclip secret to Vercel's value. Vercel signs HMAC-SHA1 over the raw
  # body, hex, no prefix, in x-vercel-signature — verified by Paperclip's
  # hmac_sha1 mode (fork v2026.8-isol8.6) via the proxy's header copy into
  # X-Paperclip-Signature. Creating webhooks needs a full-access (not
  # project-scoped) token on a Pro/Enterprise team — a 403 surfaces as a
  # caller-facing error at seed time. provider_events maps our curated event
  # id to the Vercel webhook `events` array to subscribe.
  inbound:
    webhook_registration: auto_vercel
    signing_mode: hmac_sha1
    signature_header: x-vercel-signature
    # Vercel's body carries `type` (e.g. "deployment.succeeded").
    event_in_body: true
    # Full catalog: the events enum from Vercel's OpenAPI
    # (https://openapi.vercel.sh/, POST /v1/webhooks request schema), minus
    # `test-webhook` and the dash-separated legacy aliases of the dotted
    # names (the docs at vercel.com/docs/webhooks/webhooks-api document the
    # dotted forms; the dashed ones remain in the enum only for legacy
    # payload consumers). Fetched 2026-08-13.
    events:
      - id: deployment.error
        label: Deployment failed
        provider_events: [deployment.error]
      - id: deployment.succeeded
        label: Deployment succeeded
        provider_events: [deployment.succeeded]
