        echo "Found $MACHO_COUNT Mach-O binaries to sign under $BIN_ROOT."

        SIGN_SCRIPT="$RUNNER_TEMP/sign-one.sh"
        cat > "$SIGN_SCRIPT" <<'WORKER'
        #!/usr/bin/env bash
        set -euo pipefail
        f="$1"
        ENT_ARGS=()
        case "$(basename "$f")" in
          node-*-apple-darwin)
            ENT_ARGS=(--entitlements "$NODE_ENTITLEMENTS")
            ;;
          agent-browser-*-apple-darwin)
            # A native Rust CLI that handles every workspace cookie: hardened runtime and
            # NO entitlements (no JIT, no unsigned memory, no library-validation opt-out).
            ENT_ARGS=()
            ;;
        esac
        codesign --force --options runtime --timestamp \
          ${ENT_ARGS[@]+"${ENT_ARGS[@]}"} \
          --sign "$SIGN_ID" --keychain "$KEYCHAIN_PATH" "$f"
        WORKER
        chmod +x "$SIGN_SCRIPT"

        xargs -0 -P 8 -n 1 "$SIGN_SCRIPT" < "$MACHO_LIST"
        rm -f "$MACHO_LIST" "$SIGN_SCRIPT"
    - name: Build desktop app (aarch64-apple-darwin)
      uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
      with:
        projectPath: apps/desktop
        tagName: desktop-v0.4.${{ github.run_number }}
        releaseName: Lightbulb Desktop v0.4.${{ github.run_number }}
        releaseDraft: true
        prerelease: false
        args: --target aarch64-apple-darwin
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        LIGHTBULB_CALLBACK_URL: https://flickmeon.ai/auth/desktop-callback
        # Point the native node-host + pairing client at PROD. Without these
        # the compile-time defaults in lib.rs fall back to dev, so the prod
        # app's "computer access" half pairs against dev while the chat UI +
        # Friday run on prod — they never connect.
        LIGHTBULB_API_BASE: https://api.flickmeon.ai
        LIGHTBULB_WS_URL: wss://bv.flickmeon.ai/api/v1/gateway/ws
    - name: Build, sign + notarize DMG (headless)
      run: |-
        set -euo pipefail
        APP="apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Lightbulb.app"
        SIGN_ID="Developer ID Application: Prasiddha Parthsarthy (WZX4U3C22Y)"
        # The bundled agent-browser (workspace sign-in sync) must sit sealed in Resources/bin
        # with our team signature, or the Mac's browser.state.v1 cannot run it.
        codesign --verify --deep --strict --verbose=2 "$APP"
        AB="$APP/Contents/Resources/bin/agent-browser-aarch64-apple-darwin"
