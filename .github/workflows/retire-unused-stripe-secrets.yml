name: Retire unused Stripe webhook secrets
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [dev, prod]
        default: dev
        required: true
      mode:
        type: choice
        options: [plan, execute]
        default: plan
        required: true
      expected_scope_sha256:
        description: 'Execute only: exact reviewed metadata scope hash from plan receipt'
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: retired-stripe-secrets-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  retire:
    runs-on: ubuntu-24.04
    environment: Production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3==1.40.70
      - name: Verify scope and recovery guards
        run: python -m unittest discover -s apps/backend/scripts -p test_retire_unused_stripe_secrets.py
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::877352799272:role/lightbulb-github-actions
          role-session-name: retire-stripe-secrets
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[
              {"Effect":"Allow","Action":["secretsmanager:DescribeSecret","secretsmanager:DeleteSecret"],"Resource":[
                "arn:aws:secretsmanager:us-east-1:877352799272:secret:lightbulb/${{ inputs.environment }}/stripe_connect_webhook_secret-??????",
                "arn:aws:secretsmanager:us-east-1:877352799272:secret:lightbulb/${{ inputs.environment }}/stripe_marketplace_webhook_secret-??????"]},
              {"Effect":"Allow","Action":["cloudformation:ListStacks","ecs:ListClusters","ecs:ListServices","ecs:DescribeServices","ecs:ListTasks","ecs:DescribeTasks","ecs:DescribeTaskDefinition","lambda:ListFunctions","lambda:GetFunctionConfiguration"],"Resource":"*"},
              {"Effect":"Allow","Action":"cloudformation:GetTemplate","Resource":"arn:aws:cloudformation:us-east-1:877352799272:stack/lightbulb-*/*"}
            ]}
      - name: Plan or execute only exact reviewed obsolete scope
        env:
          RETIRE_ENV: ${{ inputs.environment }}
          RETIRE_MODE: ${{ inputs.mode }}
          REVIEWED_HASH: ${{ inputs.expected_scope_sha256 }}
        run: >-
          python apps/backend/scripts/retire_unused_stripe_secrets.py
          --environment "$RETIRE_ENV" --mode "$RETIRE_MODE"
          --expected-scope-sha256 "$REVIEWED_HASH" --receipt retirement-receipt.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retired-stripe-secrets-${{ inputs.environment }}-${{ inputs.mode }}
          path: retirement-receipt.json
