# =============================================================================
# Backend CI Workflow (lint + test on PRs)
# Docker build & deploy handled by CDK Pipeline (deploy.yml)
# =============================================================================
name: Backend CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/backend/**'
      - 'apps/infra/lambda/ses-inbound/**'
      - 'apps/infra/lambda/ws-connect/**'
      - 'apps/infra/lambda/pub-authorizer/**'
      - 'apps/infra/lambda/messaging-projector/**'
      - 'apps/infra/lambda/messaging-search-indexer/**'
      - 'apps/infra/lambda/openrouter-settlement/**'
      - '.github/workflows/backend.yml'

# Supersede in-flight runs for the same PR. Every push to a branch used to
# queue another full run while the previous ones kept their runner slots, so a
# branch pushed 7 times sat 7 runs deep with only the last one mattering.
# `github.ref` is refs/pull/<n>/merge here (pull_request only), so the group is
# per-PR and PRs never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

permissions:
  contents: read

jobs:
  test:
    name: Lint & Test (shard ${{ matrix.shard }}/4)
    # Self-hosted (vars.CI_RUNNER) again 2026-11-05: GitHub-hosted runs used up the org's
    # free Actions minutes. The 4 shards run in parallel as long as the box has >= 4 idle
    # runner instances (isol8-wsl-1..N); fewer instances only queue shards, never fail them.
    runs-on: ${{ vars.CI_RUNNER }}
    strategy:
      fail-fast: false
      matrix:
        # The suite is split 4 ways by test id so shards run on parallel runner instances
        # (tests/conftest.py, BACKEND_TEST_SHARD) and each shard runs under xdist.
        shard: [1, 2, 3, 4]
    # This job had NO cap, so a stalled `Run tests` step billed GitHub's
    # 6-hour default instead of failing — run 31562062289 sat in pytest for
    # 27+ minutes with no way to tell a slow suite from a hung one. The cap is
    # loose because it exists to bound a hang, not to police runtime — and on
    # a self-hosted runner it does double duty: the box is shared, so a wedged
    # job holds a runner slot away from every other workflow until it expires.
    # 2026-09-26: the suite now takes 40-58 min on the self-hosted pool, so 45
    # cancelled three green-bound runs in one night (#3287); a hang still dies
    # well inside the 6-hour default.
    # 2026-10-02: a green run took 72 min wall-clock (18 min of runner setup +
    # lint, 55 min of pytest), so 75 cancelled the next run as soon as one
    # test file slowed down. 100 still dies 5 h before the default; the real
    # fix is a faster suite (xdist / splitting), not a looser cap.
    # 2026-11-04: 4 shards x xdist (10-12 min each on GitHub-hosted); lower this once
    # a few self-hosted runs show the new wall-clock.
    timeout-minutes: 150

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          # Cache uv's wheel/download cache, keyed on the lockfile (Actions cache storage, no minutes).
          enable-cache: true
          cache-dependency-glob: apps/backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen
        working-directory: apps/backend

      - name: Run linting
        run: |
          uv run ruff check .
          uv run ruff format --check .
        working-directory: apps/backend

      - name: Run tests
        env:
          CLERK_ISSUER: https://test.clerk.accounts.dev
          HUGGINGFACE_TOKEN: test_token
          DYNAMODB_TABLE_PREFIX: isol8-test-
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
          DEBUG: "false"
          BACKEND_TEST_SHARD: ${{ matrix.shard }}/4
        # pytest-xdist: one worker per core. Tests are process-isolated (moto is in-process,
        # servers bind port 0), so the suite runs in parallel; `-q` because `-v` per-test
        # lines from N workers are unreadable. pytest-cov merges worker coverage itself.
        run: uv run pytest tests/ -q -n auto --cov=. --cov-report=xml --cov-report=term-missing
        working-directory: apps/backend

      # This Lambda has its own tests and they used to run in NO job at all. It
      # is the ingest path for every inbound agent email -- recipient-suffix routing, the dev/prod backend split, and the
      # shared-secret header -- and a change to it shipped unverified because the
      # infra job only synthesizes templates and never executes Lambda code.
      - name: Run SES inbound Lambda tests
        if: matrix.shard == 1
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
        run: uv run pytest ../infra/lambda/ses-inbound -v
        working-directory: apps/backend

      # Third one in the same state. ws-connect authorizes and records every
      # WebSocket $connect, so a regression here is chat down, not a degraded
      # edge case.
      - name: Run ws-connect Lambda tests
        if: matrix.shard == 1
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
        run: uv run pytest ../infra/lambda/ws-connect -v
        working-directory: apps/backend

      # Decides who may hear a public session link's terminal.
      - name: Run pub-authorizer Lambda tests
        if: matrix.shard == 1
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
        run: uv run pytest ../infra/lambda/pub-authorizer -v
        working-directory: apps/backend

      # Fourth one in the same state, and the reason an image-attachment
      # regression reached production: this Lambda builds the live payload every
      # browser and phone renders a new message from, and its tests ran nowhere.
      - name: Run messaging-projector Lambda tests
        if: matrix.shard == 1
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
        run: uv run pytest ../infra/lambda/messaging-projector -v
        working-directory: apps/backend

      - name: Run messaging-search-indexer Lambda tests
        if: matrix.shard == 1
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
        run: uv run pytest ../infra/lambda/messaging-search-indexer -v
        working-directory: apps/backend

      # Fifth one in the same state. The OpenRouter settlement worker is the
      # money path for managed inference -- generation-cost lookup, the
      # nanodollar Metronome event, dedup, free zero-cost close. Its unittest
      # suite ran nowhere in CI (it uses `python -m unittest discover`, not
      # pytest, so the backend suite never collected it).
      - name: Run OpenRouter settlement Lambda tests
        if: matrix.shard == 1
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
        run: uv run python -m unittest discover -s ../infra/lambda/openrouter-settlement -t ../infra/lambda/openrouter-settlement -v
        working-directory: apps/backend

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: apps/backend/coverage.xml
          fail_ci_if_error: false
