id: b03-curbside
kind: payments
type: build
prompt: |
  Please build Curbside, a small food-delivery marketplace. People sign up (name, email, password; signed in straight away) and sign in and out. Anyone signed in can add a restaurant (name, cuisine, address) and manage the menu of the restaurants they added, and only those. A menu item has a name, a description and a price stored as a whole number of cents, never a decimal.

  On a restaurant's page a customer picks quantities, adds items to a cart and places an order; an order contains items from one restaurant only. The server works out the money: for every line it reads the item's price from the database, multiplies by the quantity and adds the lines up. It ignores any price, subtotal or total the browser sends, so a customer cannot change what they pay. The total equals the subtotal for now. After placing an order the customer lands on that order's page, which shows the restaurant, each line with its quantity and line total, the subtotal, the total and the status. A new order is `placed`; its customer can cancel it while it is placed, which makes it `cancelled`. The orders list shows newest first, and customers can only ever see and act on their own orders (enforce this on the server).

  Add a test-mode checkout on the order page: a pay button that marks the order paid without charging anyone real money (no payment provider keys are available; just simulate a successful test payment). The payment status reads exactly `unpaid` or `paid`.

  Every element that shows an amount of money carries a `data-cents` attribute holding that exact whole number of cents: the cart subtotal, each order line total, the order subtotal and the order total. Menu items show their quantity in a number field. `POST /api/orders` takes `{ restaurantId, items: [{ menuItemId, quantity }] }` and returns the order with an `id`, `subtotalCents`, `totalCents` and `status`; `GET /api/orders` returns an array. Restaurant rows carry a `data-restaurant-id` attribute. `GET /api/restaurants/[id]` returns the restaurant with a `menuItems` array of `{ id, name, priceCents }`, `GET /api/orders/[id]` returns one order, and `POST /api/orders/[id]/cancel` cancels it (403 or 404 for someone else's order). Signed-out requests get 401, and signed-out visitors to any page go to sign-in.

  Names the checks rely on. Please use these exactly, because an automatic check drives the app by them.

  Pages: `/auth/sign-up`, `/auth/sign-in`, `/restaurants`, `/restaurants/new`, `/restaurants/[id]`, `/restaurants/[id]/manage`, `/orders`, `/orders/[id]`, `/api/orders`, `/api/orders/[id]`, `/api/orders/[id]/cancel`, `/api/restaurants/[id]`.

  Elements: give each of these a `data-testid` attribute with exactly this value: `signup-name`, `signup-email`, `signup-password`, `signup-submit`, `signup-error`, `signin-email`, `signin-password`, `signin-submit`, `signin-error`, `user-menu`, `sign-out-button`, `restaurant-new-button`, `restaurant-form-name`, `restaurant-form-cuisine`, `restaurant-form-address`, `restaurant-form-submit`, `restaurants-list`, `restaurant-row`, `restaurant-row-link`, `menu-item-form-name`, `menu-item-form-description`, `menu-item-form-price-cents`, `menu-item-form-submit`, `menu-list`, `menu-item`, `menu-item-name`, `menu-item-qty`, `menu-item-add`, `cart-subtotal`, `place-order-button`, `order-detail-status`, `order-line`, `order-subtotal`, `order-total`, `order-cancel-button`, `order-pay-button`, `order-payment-status`, `orders-list`, `order-row`.
fixture: blank
journeys: journeys.spec.ts
probes:
  - id: unauth-orders
    kind: unauthenticated-route
    target: /orders
  - id: cross-user-api-orders
    kind: cross-user-read
    target: /api/orders
  - id: sqli-restaurants-new
    kind: sql-injection
    target: /restaurants/new
timeoutMin: 45
