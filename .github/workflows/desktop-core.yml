# lightbulb-core (apps/desktop/core) on Linux: the desktop client's parts that build without
# Tauri. Its own workflow, not a desktop-build.yml job: that workflow's `desktop-build`
# concurrency group would queue this behind a 150-minute prod build on the one Mac.
# Plan: docs/superpowers/plans/2026-10-21-lightbulb-core-crate-split.md (section 4).
name: desktop-core
'on':
  pull_request:
    paths:
    - apps/desktop/core/**
    - apps/desktop/Cargo.*
    # Core will compile in the Claude plugin's files and speak the relay frame contract.
    - packages/claude-plugin/**
    - packages/shared/fixtures/local-session-frames/**
    - .github/workflows/desktop-core.yml
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-core-linux:
    name: TestCoreLinux
    # Self-hosted (vars.CI_RUNNER) again 2026-11-05: GitHub-hosted runs used up the free Actions minutes.
    # Core builds without Tauri or Xcode, so Linux is enough. rust-cache keeps target/
    # and the registry between runs.
    runs-on: ${{ vars.CI_RUNNER }}
    timeout-minutes: 20
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
    - name: Cache cargo
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        workspaces: apps/desktop
    # -p compiles only core's dependency tree: no Tauri, webkit or Xcode.
    - name: Cargo test (lightbulb-core)
      run: cargo test --manifest-path apps/desktop/Cargo.toml -p lightbulb-core --locked
