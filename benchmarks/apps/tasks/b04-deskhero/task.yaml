id: b04-deskhero
kind: internal-tool
type: build
prompt: |
  Please build Deskhero, an internal helpdesk where people raise support tickets. Sign-up (name, email, password; signed in straight away) and sign-in with email and password only. Signed-out visitors to any page go to sign-in; signed-in people land on their ticket list, including when they open the home address.

  A ticket has a subject (required), a body, a priority (low, medium or high), a status (open or closed, open by default), its creator and the time it was created. People can create tickets, see a list of their own (newest first, with subject, priority and status on each row), open one, edit its subject, body and priority, close it, reopen it and delete it. Everyone sees and changes only their own tickets: asking for somebody else's ticket answers 404, on the server, for every read and every write. An empty subject shows an error and creates nothing. When someone has no tickets the list shows an empty message.

  The page talks to the server through JSON routes, and these paths must exist: `GET /api/me` (the caller's `{ id, email, name }`, 401 when signed out), `GET` and `POST /api/tickets`, and `GET`, `PATCH` and `DELETE /api/tickets/[id]` (owner only). Signed-out calls to any `/api/tickets` route answer 401. A ticket's status on its page reads exactly `open` or `closed`. The priority field is a select whose values are `low`, `medium`, `high`.

  Names the checks rely on. Please use these exactly, because an automatic check drives the app by them.

  Pages: `/auth/sign-up`, `/auth/sign-in`, `/tickets`, `/tickets/new`, `/tickets/[id]`, `/api/tickets`, `/api/tickets/[id]`, `/api/me`.

  Elements: give each of these a `data-testid` attribute with exactly this value: `signup-name`, `signup-email`, `signup-password`, `signup-submit`, `signup-error`, `signin-email`, `signin-password`, `signin-submit`, `signin-error`, `user-menu`, `sign-out-button`, `new-ticket-link`, `ticket-subject`, `ticket-body`, `ticket-priority`, `ticket-submit`, `ticket-error`, `ticket-list`, `ticket-row`, `ticket-empty`, `ticket-detail-subject`, `ticket-detail-status`, `ticket-detail-priority`, `ticket-edit`, `ticket-close`, `ticket-reopen`, `ticket-delete`.
fixture: blank
journeys: journeys.spec.ts
probes:
  - id: unauth-tickets
    kind: unauthenticated-route
    target: /tickets
  - id: cross-user-api-tickets
    kind: cross-user-read
    target: /api/tickets
    create: { subject: "Probe private", body: "x", priority: "low" }
  - id: sqli-tickets-new
    kind: sql-injection
    target: /tickets/new
timeoutMin: 45
