name: build-openclaw-image

# One image build at a time. Never cancel: each build publishes a distinct
# tag that a promotion may already point at, so a superseded run must still
# finish. (This group was added when builds shared one self-hosted VM and
# raced it into buildkit OOM; on hosted runners each build gets its own VM,
# but the no-cancel tag guarantee stands on its own.)
concurrency:
  group: build-openclaw-image
  cancel-in-progress: false

on:
  push:
    branches:
      - main
    paths:
      - "apps/infra/openclaw/Dockerfile"
      # The Dockerfile bakes apps/infra/openclaw/skills/** into the image, so a
      # change to the bundled skill (e.g. SKILL.md, a reference, or a helper
      # script) must rebuild + republish — otherwise promoted tags keep shipping
      # stale skill content.
      - "apps/infra/openclaw/skills/**"
      # Same staleness class: the Dockerfile bakes the local-sqlite boot chain
      # (isol8-local-sqlite-boot.sh / isol8-local-sqlite-app.sh / isol8-litestream.yml).
      - "apps/infra/openclaw/local-sqlite/**"
      # The Dockerfile also bakes apps/infra/openclaw/plugins/** (the in-repo
      # aws-exec-profile plugin) into /app/dist/extensions, so a change there
      # must rebuild + republish too.
      - "apps/infra/openclaw/plugins/**"
      # Fleet-wide Gen Sage policy (~/.sage/config.json) is baked by Layer 13c;
      # tuning it (sensitivity, disabled_threats) only ships via a rebuild.
      - "apps/infra/openclaw/sage/**"
      - "openclaw-version.json"
  # The boot chain can destroy an owner's data, so its smoke suite must gate
  # the image rather than run after it ships. Same paths as the push trigger.
  pull_request:
    paths:
      - "apps/infra/openclaw/local-sqlite/**"
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write
  packages: read

jobs:
  # 400+ lines of POSIX sh that migrates and can delete an owner's SQLite state.
  # It had a real smoke harness and nothing ran it — a case was asserting
  # nothing for weeks, undetected.
  boot-chain-smoke:
    name: local-sqlite boot chain smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Run smoke suite
        run: |
          sh apps/infra/openclaw/local-sqlite/smoke-test.sh \
             apps/infra/openclaw/local-sqlite/isol8-local-sqlite-boot.sh

  build-and-push:
    name: Build and push extended OpenClaw image
    # A boot chain that fails its own suite must never reach ECR.
    needs: boot-chain-smoke
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # The extended image is ~7.8 GB compressed and the SOCI path holds three
      # copies at once (docker overlay2, the containerd store it's loaded into,
      # and the convert staging ref). A hosted runner starts with ~14 GB free,
      # so drop preinstalled toolchains this build never touches.
      - name: Reclaim disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/.ghcup /usr/local/share/powershell
          df -h /

      - name: Read version metadata
        id: meta
        run: |
          UPSTREAM=$(node -p "require('./openclaw-version.json').upstream.split(':')[1]")
          IMAGE=$(node -p "require('./openclaw-version.json').extendedImage")
          SHORT_SHA=$(git rev-parse --short HEAD)
          TAG="${UPSTREAM}-${SHORT_SHA}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Building ${IMAGE}:${TAG}"

      - name: Authenticate Via OIDC Role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          role-duration-seconds: 1800
          role-skip-session-tagging: true
          role-to-assume: arn:aws:iam::877352799272:role/isol8-openclaw-image-builder

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      # The base image (openclaw-version.json#upstream) is the Isol8 OpenClaw
      # fork on GHCR, a private package this repo has been granted read access
      # to. The build below pulls it via FROM, so authenticate to GHCR first.
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build \
            -t "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}" \
            apps/infra/openclaw/

      # NOTE: we deliberately do NOT `docker push` here. Our ECR repo has tag
      # immutability enabled, and the SOCI v2 step below pushes a different
      # manifest (the SOCI-enabled OCI artifact) under the same tag. If we
      # docker-pushed first, ECR would lock the tag and reject the SOCI push
      # with "tag is immutable" (PR #438/#440 builds hit exactly this). The
      # SOCI step imports the docker-built image into containerd via
      # `docker save | nerdctl image load` and pushes from there — single
      # ECR push, immutable tag claimed by the SOCI v2 manifest.

      - name: Set up containerd
        uses: crazy-max/ghaction-setup-containerd@v3

      - name: Convert image to SOCI v2 and push
        env:
          SOCI_VERSION: "0.13.0"
          NERDCTL_VERSION: "2.2.2"
          IMAGE_REF: "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}"
        # Fargate refuses SOCI Index Manifest v1 for accounts that didn't
        # already use SOCI before 2025-07-03 (per AWS containers blog
        # "improving-amazon-ecs-deployment-consistency-with-soci-index-manifest-v2").
        # We're a new customer, so v1 silently falls back to a full pull.
        # `soci convert` produces a v2 SOCI-enabled image (single OCI artifact
        # with the index attached). We push it under the deploy tag — the
        # only push to ECR for this tag (no docker push first).
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/awslabs/soci-snapshotter/releases/download/v${SOCI_VERSION}/soci-snapshotter-${SOCI_VERSION}-linux-amd64-static.tar.gz" \
            | sudo tar -xz -C /usr/local/bin/ soci
          sudo chmod +x /usr/local/bin/soci

          # `crazy-max/ghaction-setup-containerd@v3` installs containerd + ctr,
          # but not nerdctl. Pull the static binary from upstream releases.
          # nerdctl is required (per upstream cli-usage.md) for v2 push —
          # it uploads child blobs before committing the index manifest,
          # which is what ECR's strict validation expects.
          curl -sSL "https://github.com/containerd/nerdctl/releases/download/v${NERDCTL_VERSION}/nerdctl-${NERDCTL_VERSION}-linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin/ nerdctl
          sudo chmod +x /usr/local/bin/nerdctl

          # Authenticate nerdctl to ECR.
          ECR_PASSWORD=$(aws ecr get-login-password --region us-east-1)
          REGISTRY="$(echo "${IMAGE_REF}" | cut -d/ -f1)"
          echo "${ECR_PASSWORD}" | sudo nerdctl login --username AWS --password-stdin "${REGISTRY}"

          # Import the docker-built image into containerd's content store.
          # `docker save` streams the image; `nerdctl image load` ingests it.
          # Both use the same containerd backend so soci convert sees it next.
          docker save "${IMAGE_REF}" | sudo nerdctl image load

          # Convert to a SOCI v2 image. Requires src != dst, so we stage
          # under a -soci-staging suffix and re-tag onto the deploy ref.
          sudo soci convert --platform linux/amd64 "${IMAGE_REF}" "${IMAGE_REF}-soci-staging"
          sudo nerdctl rmi "${IMAGE_REF}" || true
          sudo nerdctl tag "${IMAGE_REF}-soci-staging" "${IMAGE_REF}"

          # Push the SOCI v2 image — first push to ECR for this tag, no
          # immutability conflict.
          sudo nerdctl push --platform linux/amd64 "${IMAGE_REF}"

      # On a SELF-HOSTED runner the container stores are not thrown away with
      # the VM, so anything this job leaves behind is permanent. The SOCI step
      # above leaves THREE copies of a ~16 GB image per run: the docker-built
      # one in containerd's `moby` namespace, plus `IMAGE_REF` and
      # `IMAGE_REF-soci-staging` in `default` (nerdctl's namespace). Nothing
      # collected them, and critically `docker system prune` cannot — it only
      # knows about `moby`. Roughly 200 builds accumulated 614 images and grew
      # /var/lib/containerd to 732 GB, filling the runner box's disk until
      # builds began failing (run #196 attempt 2, 2026-08-11).
      #
      # `if: always()` because a build that fails partway through the convert
      # is exactly the case that used to strand the most bytes.
      - name: Reclaim container storage
        if: always()
        env:
          IMAGE_REF: "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}"
        run: |
          set -uo pipefail
          # nerdctl's `default` namespace — both tags the convert produced.
          sudo nerdctl rmi -f "${IMAGE_REF}" "${IMAGE_REF}-soci-staging" 2>/dev/null || true
          # Docker's own copy plus the layer cache this build populated.
          docker image rm -f "${IMAGE_REF}" 2>/dev/null || true
          docker builder prune -af --filter until=168h 2>&1 | tail -2 || true
          echo "disk after reclaim:"
          df -h / | tail -1

      - name: Summary
        run: |
          echo "## Built image" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Bump \`openclaw-version.json#dev.tag\` to \`${{ steps.meta.outputs.tag }}\` in a PR to deploy to dev." >> "$GITHUB_STEP_SUMMARY"
