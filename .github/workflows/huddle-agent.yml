name: Huddle Agent

# LiveKit Cloud Agents worker (apps/huddle-agent). The plan allows one deployed agent, prod `lightbulb-huddle`
# (deploy-prod, manual). Dev workers run on the Mac with `lk agent start`, so there is no dev deploy.
on:
  pull_request:
    # The three backend files are the replay's router (tests/replay/router.py loads them by path), so a
    # change to them runs the replay gate.
    paths:
      - "apps/huddle-agent/**"
      - ".github/workflows/huddle-agent.yml"
      - "apps/backend/core/services/messaging.py"
      - "apps/backend/core/services/jev.py"
      - "apps/backend/core/services/voice_calls.py"
  push:
    branches: [main]
    paths: ["apps/huddle-agent/**", ".github/workflows/huddle-agent.yml"]
  workflow_dispatch:

permissions:
  contents: read

# Supersede in-flight runs for the same PR; a push to main gets its own group (its SHA).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    # Self-hosted (vars.CI_RUNNER) again 2026-11-05: GitHub-hosted runs used up the free Actions minutes.
    runs-on: ${{ vars.CI_RUNNER }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/huddle-agent
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: apps/huddle-agent/uv.lock
      - run: uv sync
      - run: uv run pytest

  deploy-prod:
    needs: test
    if: github.event_name == 'workflow_dispatch' && vars.LIVEKIT_PROD_ENABLED == 'true'
    runs-on: ${{ vars.CI_RUNNER }}
    steps:
      - uses: actions/checkout@v7
      # lk agent deploy needs the livekit.toml that `lk agent create` wrote for this project (README).
      - run: cp apps/huddle-agent/livekit.prod.toml apps/huddle-agent/livekit.toml
      - uses: livekit/deploy-action@v2.12.2
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL_PROD }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY_PROD }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET_PROD }}
        with:
          OPERATION: deploy
          WORKING_DIRECTORY: apps/huddle-agent
      # A deploy whose worker crashloops is a failed deploy (7 Nov: three "successful" deploys, zero sessions served).
      - name: Wait until the agent is running
        working-directory: apps/huddle-agent
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL_PROD }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY_PROD }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET_PROD }}
        run: |
          command -v lk >/dev/null 2>&1 || curl -sSL https://get.livekit.io/cli | bash >/dev/null 2>&1 || true
          if ! command -v lk >/dev/null 2>&1; then echo "::warning::lk not available; skipping the running check"; exit 0; fi
          for i in $(seq 1 30); do
            status=$(lk agent status --json 2>/dev/null | python3 -c 'import json,sys; print(json.load(sys.stdin)["agents"][0]["agentDeployments"][0]["status"])' 2>/dev/null || echo unknown)
            echo "agent status: $status"
            case "$status" in
              *unning*|*eady*) exit 0 ;;
              *rash*|*rror*|*ail*) echo "::error::agent deployment is $status"; exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::agent not running after 5 minutes (last: $status)"; exit 1
