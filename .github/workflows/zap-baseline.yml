# =============================================================================
# Weekly OWASP ZAP passive API scan of api-dev (observation only)
# =============================================================================
# zap-api-scan imports the OpenAPI document (dev serves it publicly at
# /api/v1/openapi.json; prod does not), so every documented route is reached,
# including /health and /api/v1/public/*. A plain baseline cannot do this: it
# spiders a page URL, and "/" is link-less JSON.
#
# Passive only, via cmd_options -S. zap-api-scan.py --help: "-S  safe mode this
# will skip the active scan and perform a baseline scan". Why: people and real
# agents use dev, and the API Gateway stage throttles at 100 burst / 50 rps. An
# active scan is a separate owner decision.
#
# /api/v1/public/* is unauthenticated and everything else 401s, so expect
# findings mostly about headers, TLS and the public routes.
#
# The ZAP image is pinned by digest (docker_name). To refresh: GET the manifest
# for ghcr.io/zaproxy/zaproxy:stable and read its docker-content-digest header.
#
# Never a red check (fail_action: false). Findings land in ONE GitHub issue the
# action files and updates. Known-noise alert ids are in .zap/rules.tsv.
name: ZAP Passive API Scan

on:
  schedule:
    - cron: '17 7 * * 1' # Mondays 07:17 UTC = Sunday night US time
  workflow_dispatch:

concurrency:
  group: zap-baseline
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  api-scan:
    runs-on: ${{ vars.CI_RUNNER }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: zaproxy/action-api-scan@5158fe4d9d8fcc75ea204db81317cce7f9e5453d # v0.10.0
        with:
          format: openapi
          docker_name: ghcr.io/zaproxy/zaproxy@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef # stable as of 2026-10-07
          cmd_options: '-S'
          target: https://api-dev.thelightbulb.company/api/v1/openapi.json
          rules_file_name: .zap/rules.tsv
          allow_issue_writing: true
          fail_action: false
