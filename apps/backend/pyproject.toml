[project]
name = "isol8-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2,<0.143.0",
    "starlette>=0.47.2",
    "uvicorn>=0.54.0,<1.0.0",
    "pydantic>=2.13.5,<3.0.0",
    "pydantic-settings>=2.15.0",
    "python-dotenv==1.2.4",
    "cryptography>=46.0.5,<47.0.0",
    "httpx>=0.28.0,<0.29.0",
    "boto3>=1.43.108",
    "PyJWT[crypto]>=2.14.0",
    "stripe>=14.4.1",
    "websockets>=12.0",
    "posthog>=3.5.0,<6.0.0",
]

[tool.uv]
dev-dependencies = [
    "pytest==8.0.2",
    "pytest-asyncio==0.23.5",
    "pytest-cov==4.1.0",
    "pytest-mock==3.12.0",
    "pytest-xdist==3.6.1",
    "factory-boy==3.3.0",
    "respx==0.20.2",
    "schemathesis>=3.28.0",
    "ruff>=0.8.0",
    "pre-commit>=3.0.0",
    "moto[dynamodb]>=5.1.22",
    "hypothesis>=6.100.0",
]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "real_background_workers: run the real lifespan sweepers (tests/conftest.py stubs them by default)",
]
