# Infra CI (PRs): type check, the vitest suite (it asserts on synthesized templates), and a
# full `cdk synth`, which is what turns a type-correct stack into what CloudFormation sees.
name: Infra CI

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/infra/**"
      - ".github/workflows/infra-ci.yml"
      - ".github/workflows/deploy.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/infra
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/infra/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npx cdk synth --no-notices > /dev/null
