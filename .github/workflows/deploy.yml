  prod-DeployVercelProd:
    name: DeployVercelProd
    permissions:
      contents: write
    runs-on: ${{ vars.DEPLOY_RUNNER }}
    needs:
      - prod-lightbulb-prod-auth-Deploy
      - prod-lightbulb-prod-dns-Deploy
      - prod-lightbulb-prod-database-Deploy
      - prod-lightbulb-prod-network-Deploy
      - prod-lightbulb-prod-spark-store-Deploy
      - prod-lightbulb-prod-container-Deploy
      - prod-lightbulb-prod-service-Deploy
      - prod-lightbulb-prod-observability-Deploy
      - prod-lightbulb-prod-api-Deploy
      - Build-Synth
      - dev-lightbulb-dev-auth-Deploy
      - dev-lightbulb-dev-dns-Deploy
      - dev-lightbulb-dev-database-Deploy
      - dev-lightbulb-dev-network-Deploy
      - dev-lightbulb-dev-spark-store-Deploy
      - dev-lightbulb-dev-container-Deploy
      - dev-lightbulb-dev-service-Deploy
      - dev-lightbulb-dev-observability-Deploy
      - dev-lightbulb-dev-api-Deploy
      - dev-DeployVercelDev
    env: {}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: pnpm
      - name: Install Vercel CLI
        run: npm install -g vercel@63.1.0
      - name: Pull Vercel Settings
        run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Build Frontend (Production)
        run: vercel build --prod --token=$VERCEL_TOKEN
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY_PROD }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL_PROD }}
      - name: Deploy to Vercel (Production)
        id: vercel-deploy-prod
        run: DEPLOY_URL=$(vercel deploy --prebuilt --archive=tgz --prod
          --token=$VERCEL_TOKEN) && echo "DEPLOY_URL=$DEPLOY_URL" >>
          $GITHUB_OUTPUT
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Register thelightbulb.company project domain
        run: vercel domains add thelightbulb.company frontend --force
          --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Alias to thelightbulb.company
        run: vercel alias ${{ steps.vercel-deploy-prod.outputs.DEPLOY_URL }}
          thelightbulb.company --token=$VERCEL_TOKEN
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Register www.thelightbulb.company project domain
        run: vercel domains add www.thelightbulb.company frontend --force
          --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Alias to www.thelightbulb.company
        run: vercel alias ${{ steps.vercel-deploy-prod.outputs.DEPLOY_URL }}
          www.thelightbulb.company --token=$VERCEL_TOKEN
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Register admin.thelightbulb.company project domain
        run: vercel domains add admin.thelightbulb.company frontend --force
          --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Alias to admin.thelightbulb.company
        run: vercel alias ${{ steps.vercel-deploy-prod.outputs.DEPLOY_URL }}
          admin.thelightbulb.company --token=$VERCEL_TOKEN
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Alias to flickmeon.ai
        run: vercel alias ${{ steps.vercel-deploy-prod.outputs.DEPLOY_URL }}
          flickmeon.ai --token=$VERCEL_TOKEN
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Alias to www.flickmeon.ai
        run: vercel alias ${{ steps.vercel-deploy-prod.outputs.DEPLOY_URL }}
          www.flickmeon.ai --token=$VERCEL_TOKEN
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    if: github.event_name == 'workflow_dispatch'
permissions:
  id-token: write
  contents: write
