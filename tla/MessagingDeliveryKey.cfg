\* The code as shipped since PR #2965: create_message's transaction carries a
\* ConditionCheck on the author's own MEMBER row, and the projector reads META
\* with ConsistentRead.
SPECIFICATION Spec
CONSTANTS
  Humans = {h1, h2}
  Owner = h1
  MaxSeq = 2
  MemberCheckInTxn = TRUE
  ConsistentMetaRead = TRUE
INVARIANTS
  TypeOK
  NoLeak
  RevokedNeverHoldsLiveKey
  AuthorWasMember
